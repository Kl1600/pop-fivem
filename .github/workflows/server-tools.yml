# Outils serveur lancés à la main (onglet Actions > Server tools > Run workflow).
#  - list        : affiche l'arborescence des ressources du serveur.
#  - logs        : affiche les erreurs récentes de la console (txAdmin).
#  - disable_esx : déplace les ressources esx_* inutiles hors de resources/
#                  (dans esx_desactives/ à la racine du serveur, réversible).
#  - fix_esx_save : corrige la sauvegarde ESX avec un inventaire externe (pop_inventory) :
#                  getInventory(true) plantait (inventoryIndexes nil), donc ESX n'enregistrait plus
#                  banque, job, position. Copie de l'original : inventory.lua.pop-backup (réversible).
name: Server tools

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list, disable_esx, logs ou fix_esx_save"
        required: true
        default: list
        type: choice
        options: [list, disable_esx, logs, fix_esx_save]

concurrency:
  group: server-tools
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Chemins
        id: p
        run: |
          # SFTP_REMOTE_PATH pointe sur .../resources/[pop] ; on remonte d'un et deux niveaux.
          RES="$(dirname "$SFTP_REMOTE_PATH")"
          ROOT="$(dirname "$RES")"
          echo "res=$RES" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Liste des ressources
        run: |
          lftp -e "
            set sftp:auto-confirm yes;
            open --env-password -u '$SFTP_USER' -p ${SFTP_PORT:-22} sftp://$SFTP_HOST;
            cd '${{ steps.p.outputs.res }}';
            find --maxdepth=3 . ;
            bye
          " | grep -v '/\.' | grep -E '^\./[^/]+/?$|^\./[^/]+/[^/]+/?$' | sort > tree.txt
          cat tree.txt

      - name: Désactiver les ressources ESX inutiles
        if: inputs.action == 'disable_esx'
        run: |
          # Gardées : celles de la base d'origine + celles appelées par les scripts pop.
          KEEP="es_extended esx_lib esx_skin skinchanger cron esx_addonaccount esx_basicneeds esx_datastore esx_society esx_status esx_addoninventory"
          : > cmds.txt
          grep -E '/esx_[^/]+/?$' tree.txt | sed 's#/$##' | while read -r p; do
            name="$(basename "$p")"
            case " $KEEP " in *" $name "*) echo "garde  $p"; continue;; esac
            echo "désactive $p"
            echo "mv '${{ steps.p.outputs.res }}/${p#./}' '${{ steps.p.outputs.root }}/esx_desactives/$name';" >> cmds.txt
          done
          if [ ! -s cmds.txt ]; then echo "Rien à déplacer."; exit 0; fi
          lftp -e "
            set sftp:auto-confirm yes;
            open --env-password -u '$SFTP_USER' -p ${SFTP_PORT:-22} sftp://$SFTP_HOST;
            mkdir -p -f '${{ steps.p.outputs.root }}/esx_desactives';
            $(cat cmds.txt)
            bye
          "
          echo "Terminé."

      - name: Erreurs récentes de la console
        if: inputs.action == 'logs'
        run: |
          ROOT='${{ steps.p.outputs.root }}'
          lftp -e "
            set sftp:auto-confirm yes;
            open --env-password -u '$SFTP_USER' -p ${SFTP_PORT:-22} sftp://$SFTP_HOST;
            cd '$ROOT';
            find --maxdepth=4 . ;
            bye
          " | grep -iE 'log' | grep -vE '/resources/' | head -40 > logs_list.txt || true
          echo "== Fichiers de logs trouvés :"; cat logs_list.txt
          echo "== Diagnostic sauvegarde ESX (pop_admin) :"
          lftp -e "
            set sftp:auto-confirm yes;
            open --env-password -u '$SFTP_USER' -p ${SFTP_PORT:-22} sftp://$SFTP_HOST;
            get '${{ steps.p.outputs.res }}/[pop]/pop_admin/diag_save.log' -o diag.log;
            bye
          " 2>/dev/null && tail -n 80 diag.log || echo "(aucun diagnostic pour l'instant)"
          LOG=$(grep -iE 'fxserver.*\.log$' logs_list.txt | head -1)
          if [ -z "$LOG" ]; then echo "Aucun fxserver.log trouvé."; exit 0; fi
          lftp -e "
            set sftp:auto-confirm yes;
            open --env-password -u '$SFTP_USER' -p ${SFTP_PORT:-22} sftp://$SFTP_HOST;
            cd '$ROOT';
            get '$LOG' -o fx.log;
            bye
          "
          echo "== Lignes utiles (fin du log) :"
          tail -n 4000 fx.log | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -iE 'error|erreur|warn|failed|stale|save|dropped|es_extended|script:pop|oxmysql|stack|attempt to' \
            | grep -viE 'licensekey|password|mysql_connection_string|token' | tail -n 150

      - name: Corriger la sauvegarde ESX (inventaire externe)
        if: inputs.action == 'fix_esx_save'
        run: |
          RES='${{ steps.p.outputs.res }}'
          DIR=$(grep -E '/es_extended/?$' tree.txt | head -1 | sed 's#/$##; s#^\./##')
          if [ -z "$DIR" ]; then echo "es_extended introuvable dans resources/"; exit 1; fi
          FILE="$RES/$DIR/server/classes/player/inventory.lua"
          CONF="$RES/$DIR/shared/config/main.lua"
          echo "Fichier : $FILE"
          lftp -e "
            set sftp:auto-confirm yes;
            open --env-password -u '$SFTP_USER' -p ${SFTP_PORT:-22} sftp://$SFTP_HOST;
            get '$FILE' -o inventory.lua;
            get '$CONF' -o config_main.lua;
            bye
          "
          echo "== Réglage inventaire d'ESX :"; grep -nE 'CustomInventory|PlayerFunctionOverride' config_main.lua || true
          OLD='for itemName, item in pairs(inventoryIndexes\[self\]) do'
          if grep -q 'pairs(inventoryIndexes\[self\] or {})' inventory.lua; then echo "Déjà corrigé."; exit 0; fi
          if ! grep -q "$OLD" inventory.lua; then echo "Ligne attendue absente : version d'ESX différente, rien n'est modifié."; exit 1; fi
          cp inventory.lua inventory.orig.lua
          sed -i 's/pairs(inventoryIndexes\[self\])/pairs(inventoryIndexes[self] or {})/g' inventory.lua
          echo "== Modification :"; diff inventory.orig.lua inventory.lua || true
          lftp -e "
            set sftp:auto-confirm yes;
            open --env-password -u '$SFTP_USER' -p ${SFTP_PORT:-22} sftp://$SFTP_HOST;
            put inventory.orig.lua -o '$FILE.pop-backup';
            put inventory.lua -o '$FILE';
            bye
          "
          echo "Corrigé. Redémarrer le serveur pour l'appliquer. Annuler : remettre $FILE.pop-backup à la place de inventory.lua."
