# Déploie resources/[pop]/ sur le serveur de test par SFTP à chaque push sur main.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   SFTP_HOST         ex. 123.45.67.89
#   SFTP_PORT         ex. 2022
#   SFTP_USER         identifiant SFTP du panel
#   SFTP_PASSWORD     mot de passe SFTP du panel
#   SFTP_REMOTE_PATH  dossier des ressources sur le serveur, ex. /resources/[pop]
name: Deploy to test server

on:
  push:
    branches: [main]
    paths: ['resources/\[pop\]/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          HOST: ${{ secrets.SFTP_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "Secrets SFTP absents : déploiement ignoré."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          fetch-depth: 0

      # Date de chaque fichier = date de son dernier commit : lftp n'envoie
      # ensuite que les fichiers réellement modifiés (au lieu de tout renvoyer).
      - name: Restore file dates
        if: steps.check.outputs.skip != 'true'
        run: |
          git -c core.quotepath=off log --format='@%ct' --name-only --no-renames -- ':(literal)resources/[pop]' | awk '
            /^@/ { t = substr($0, 2); next }
            NF && !($0 in seen) { seen[$0] = t; print t "\t" $0 }
          ' | while IFS=$'\t' read -r t f; do
            if [ -f "$f" ]; then touch -m -d "@$t" "$f"; fi
          done

      - name: Install lftp
        if: steps.check.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Données écrites par le serveur lui-même (bans, logs, plantes, portes) : jamais
      # envoyées ni supprimées par le déploiement, sinon elles seraient écrasées à chaque push.
      - name: Upload via SFTP
        if: steps.check.outputs.skip != 'true'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          lftp -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set xfer:use-temp-file yes;
            open --env-password -u '$SFTP_USER' -p ${SFTP_PORT:-22} sftp://$SFTP_HOST;
            mkdir -p -f '$SFTP_REMOTE_PATH';
            lcd 'resources/[pop]';
            mirror -R --parallel=8 --verbose --delete --exclude-glob .gitkeep --exclude-glob SPEC.md --exclude-glob diag_save.log --exclude-glob bans.json --exclude-glob staff_characters.json --exclude-glob disconnect_logs.json --exclude-glob plants.json --exclude-glob overrides.json --exclude-glob doors.json . '$SFTP_REMOTE_PATH';
            bye
          "
