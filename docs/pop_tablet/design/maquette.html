<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POP Tablet · Maquette</title>
<style>
:root{
  --scene:#060709;--bezel:#000;--bg:#0e0f12;--s1:#15171c;--s2:#1c1f26;--s3:#262a33;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --tx:#fff;--tx2:rgba(255,255,255,.62);--tx3:rgba(255,255,255,.38);
  --ac:#4FA3FF;--ac-s:rgba(79,163,255,.14);--ac-on:#04111f;
  --danger:#E5484D;--danger-s:rgba(229,72,77,.14);--warn:#F5A524;
  --r1:8px;--r2:12px;--r3:16px;--r4:20px;
  --sh:0 18px 48px rgba(0,0,0,.55);
  --fade:150ms;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--scene);color:var(--tx);font:14px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.ltr{direction:ltr;unicode-bidi:isolate}
@keyframes f{from{opacity:0}to{opacity:1}}
.fade{animation:f var(--fade) linear}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- Scène et barre de maquette ---------- */
#demo{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px 6px 5px 14px;background:#111318;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--tx2);z-index:50;white-space:nowrap}
#demo b{color:var(--tx);font-weight:600;margin-inline-end:6px}
#demo button{padding:5px 11px;border-radius:999px;color:var(--tx2)}
#demo button:hover{background:var(--s2);color:var(--tx)}
#demo button.on{background:var(--ac-s);color:var(--ac)}
#demo .sep{width:1px;height:16px;background:var(--line2);margin:0 4px}
#demo .codes{padding:0 8px}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:15px;color:var(--tx2);display:none}
#hint .k{display:inline-block;border:1px solid var(--ac);color:var(--ac);border-radius:5px;padding:1px 7px;font-weight:600;margin-inline-end:8px}
#device{position:fixed;left:50%;top:50%;width:1208px;height:788px;margin:-394px 0 0 -604px;background:var(--bezel);border-radius:32px;padding:14px;box-shadow:0 0 0 1px #24272e,0 30px 80px rgba(0,0,0,.6);transition:opacity var(--fade) linear}
#device.closed{opacity:0;pointer-events:none}
#homebtn{position:absolute;bottom:3px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#1d2026;cursor:pointer}
#cam{position:absolute;top:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#1a1d22}
#screen{position:relative;width:1180px;height:760px;border-radius:18px;overflow:hidden;background:var(--bg)}

/* ---------- Barre du haut (28 px) ---------- */
#top{position:absolute;inset:0 0 auto 0;height:28px;display:flex;align-items:center;padding:0 18px;font-size:12px;font-weight:600;z-index:20}
#top .mid{position:absolute;left:50%;transform:translateX(-50%);color:var(--tx2);font-weight:500}
#top .end{margin-inline-start:auto;display:flex;align-items:center;gap:14px}
.duty{display:flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:var(--s2);font-weight:500;color:var(--tx2)}
.duty i{width:6px;height:6px;border-radius:50%;background:var(--tx3)}
.duty.on{color:var(--tx)} .duty.on i{background:var(--ac)}
.net{direction:ltr;display:flex;align-items:flex-end;gap:2px;height:11px}
.net i{width:3px;background:var(--tx);border-radius:1px}
.bell{position:relative;display:flex;color:var(--tx)}
.bell svg{width:16px;height:16px}
.bell em{position:absolute;top:-5px;inset-inline-end:-7px;font-style:normal;font-size:9px;min-width:14px;height:14px;line-height:14px;text-align:center;border-radius:7px;background:var(--ac);color:var(--ac-on);font-weight:700}
.batt{display:flex;align-items:center;gap:6px;direction:ltr}.batt em{font-style:normal}
.batt span{display:inline-block;width:22px;height:11px;border:1.5px solid var(--tx2);border-radius:3px;padding:1px;position:relative}
.batt span::after{content:"";position:absolute;top:2.5px;inset-inline-end:-4px;width:2px;height:4px;background:var(--tx2);border-radius:0 1px 1px 0}
.batt span b{display:block;height:100%;background:var(--tx);border-radius:1px}
#view{position:absolute;inset:28px 0 0 0}

/* ---------- Écran verrouillé ---------- */
.lock{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center}
.lock .l{padding-inline-start:96px}
.lock .clock{font-size:104px;font-weight:200;letter-spacing:-3px;line-height:1}
.lock .date{font-size:20px;color:var(--tx2);margin-top:12px}
.lock .serial{position:absolute;bottom:28px;inset-inline-start:96px;font-size:12px;color:var(--tx3);letter-spacing:.5px}
.lock .r{display:flex;flex-direction:column;align-items:center}
.lock h2{font-size:17px;font-weight:500;margin:0 0 18px;display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:14px;height:14px;margin-bottom:12px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--tx3)}
.dots i.f{background:var(--tx);border-color:var(--tx)}
.dots.err{animation:shake 80ms linear 3}
.lmsg{height:20px;font-size:13px;color:var(--danger);margin-bottom:14px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--s2);font-size:26px;font-weight:300}
.pad button:hover{background:var(--s3)}
.pad button.x{background:none;font-size:14px;color:var(--tx2)}
.pad button.x:hover{color:var(--tx)}
.lock .forgot{margin-top:22px;font-size:12px;color:var(--tx3)}

/* ---------- Accueil ---------- */
.home{position:absolute;inset:0;display:flex;flex-direction:column}
.grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:136px;align-content:center;padding:24px 96px 0}
.app-ic{display:flex;flex-direction:column;align-items:center;gap:10px;justify-self:center;align-self:start;width:112px;border-radius:var(--r3);padding:6px 0;outline:none}
.app-ic .t{position:relative;width:72px;height:72px;border-radius:20px;background:var(--s2);display:grid;place-items:center;transition:background var(--fade) linear}
.app-ic .t svg{width:32px;height:32px;stroke-width:1.5}
.app-ic:hover .t,.app-ic:focus-visible .t{background:var(--s3)}
.app-ic:focus-visible .t{box-shadow:0 0 0 2px var(--ac)}
.app-ic span{font-size:13px;color:var(--tx);max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ac);color:var(--ac-on);font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.hfoot{height:64px;display:flex;align-items:center;justify-content:center;position:relative}
.pdots{display:flex;gap:8px}.pdots i{width:7px;height:7px;border-radius:50%;background:var(--tx3)}.pdots i.on{background:var(--tx)}
.langbtn{position:absolute;inset-inline-start:24px;bottom:18px;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--s2);font-size:13px;color:var(--tx2)}
.langbtn:hover{color:var(--tx);background:var(--s3)}
.hint-r{position:absolute;inset-inline-end:24px;bottom:22px;font-size:12px;color:var(--tx3)}

/* ---------- App : cadre commun ---------- */
.app{position:absolute;inset:0;display:flex}
.side{width:232px;flex:none;background:var(--s1);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px 16px}
.side .brand{display:flex;align-items:center;gap:12px;padding:0 8px 20px}
.side .brand .t{width:36px;height:36px;border-radius:10px;background:var(--s3);display:grid;place-items:center}
.side .brand b{display:block;font-size:14px;white-space:nowrap}
.side .brand small{display:block;font-size:12px;color:var(--tx2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:var(--tx2);text-align:start;font-size:14px}
.nav button:hover{background:var(--s2);color:var(--tx)}
.nav button.on{background:var(--ac-s);color:var(--ac);font-weight:600}
.nav button em{margin-inline-start:auto;font-style:normal;font-size:12px;color:var(--tx3)}
.nav button.on em{color:var(--ac)}
.side .foot{margin-top:auto;padding:12px;border-radius:var(--r2);background:var(--s2);font-size:12px;color:var(--tx2)}
.side .foot b{display:block;color:var(--tx);font-size:13px;margin-bottom:2px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;gap:12px;height:72px;padding:0 32px 0 20px;flex:none}
.back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tx2)}
.back:hover{background:var(--s2);color:var(--tx)}
.mhead h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.3px}
.mhead .sub{color:var(--tx2);font-size:13px;margin-inline-start:4px;padding-top:6px}
.mhead .act{margin-inline-start:auto;display:flex;gap:10px;align-items:center}
.mbody{flex:1;min-height:0;overflow:auto;padding:4px 32px 32px}
.mbody::-webkit-scrollbar{width:8px}.mbody::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}

/* ---------- Composants ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;background:var(--s2);color:var(--tx);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--s3)}
.btn.p{background:var(--ac);color:var(--ac-on);font-weight:600}
.btn.p:hover{background:#6db2ff}
.btn.g{background:none;color:var(--ac)}
.btn.g:hover{background:var(--ac-s)}
.btn.d{background:var(--danger-s);color:var(--danger)}
.btn.lg{height:48px;padding:0 24px;font-size:15px;border-radius:12px}
.btn.sm{height:30px;padding:0 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.req{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:6px;margin-top:8px}
.req svg{width:14px;height:14px}
.tabs{display:inline-flex;gap:2px;padding:3px;background:var(--s1);border:1px solid var(--line);border-radius:11px}
.tabs button{height:32px;padding:0 14px;border-radius:8px;color:var(--tx2);font-size:13px;font-weight:500}
.tabs button:hover{color:var(--tx)}
.tabs button.on{background:var(--s3);color:var(--tx)}
.utabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:20px}
.utabs button{height:40px;color:var(--tx2);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.utabs button:hover{color:var(--tx)}
.utabs button.on{color:var(--tx);border-color:var(--ac);font-weight:600}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);padding:20px}
.card h3{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--tx2);text-transform:none}
.list{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);overflow:hidden}
.row{display:flex;align-items:center;gap:16px;min-height:56px;padding:10px 18px;border-bottom:1px solid var(--line);text-align:start;width:100%}
.row:last-child{border-bottom:0}
button.row:hover,.row.click:hover{background:var(--s2);cursor:pointer}
.row.sel{background:var(--s2);box-shadow:inset 3px 0 0 var(--ac)}
[dir=rtl] .row.sel{box-shadow:inset -3px 0 0 var(--ac)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m small{display:block;color:var(--tx2);font-size:12px;margin-top:2px}
.row .e{text-align:end;color:var(--tx2);font-size:12px;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--tx3);text-align:start;padding:0 18px 10px}
.tbl td{padding:14px 18px;border-top:1px solid var(--line)}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--s2)}
.tbl .n{text-align:end;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--s3);color:var(--tx2);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.a{background:var(--ac-s);color:var(--ac)}
.pill.w{background:rgba(255,255,255,.1);color:var(--tx)}
.pill.d{background:var(--danger-s);color:var(--danger)}
.pill.o{background:none;box-shadow:inset 0 0 0 1px var(--line2);color:var(--tx2)}
.av{width:40px;height:40px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--tx2);flex:none}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld label{font-size:12px;color:var(--tx2);font-weight:500}
.in{height:42px;border-radius:10px;background:var(--s2);border:1px solid transparent;padding:0 14px;outline:none;width:100%}
textarea.in{height:84px;padding:10px 14px;resize:none}
.in:focus{border-color:var(--ac)}
.in::placeholder{color:var(--tx3)}
.search{position:relative}.search svg{position:absolute;inset-inline-start:14px;top:11px;color:var(--tx3)}
.search .in{padding-inline-start:44px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.check input{appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--tx3);margin:0;display:grid;place-items:center;flex:none;cursor:pointer}
.check input:checked{background:var(--ac);border-color:var(--ac)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--ac-on);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.radio input{border-radius:50%}
.radio input:checked::after{width:8px;height:8px;border:0;border-radius:50%;background:var(--ac-on);transform:none}
.big{font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.muted{color:var(--tx2)}.faint{color:var(--tx3)}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-size:14px}
.sum.t{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-size:17px;font-weight:700}
.g2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi small{display:block;font-size:12px;color:var(--tx2);margin-bottom:8px}
.kpi b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.toolbar .sp{flex:1}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.plus{color:var(--ac)}

/* États */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 24px;gap:14px}
.state .ic{width:56px;height:56px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--tx2)}
.state .ic svg{width:26px;height:26px}
.state .ic.err{background:var(--danger-s);color:var(--danger)}
.state p{margin:0;color:var(--tx2);max-width:360px}
.state h2{margin:0;font-size:20px}
.sk{background:var(--s2);border-radius:6px;height:12px}
.skrow{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}
.skrow:last-child{border:0}
#banner{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:10px 18px;background:var(--s3);border-radius:var(--r2);box-shadow:var(--sh);font-weight:500;z-index:40;white-space:nowrap;border-inline-start:3px solid var(--ac)}
#banner svg{color:var(--ac)}
#banner.show{display:flex;animation:f var(--fade) linear}
/* Fenêtres */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:30;animation:f var(--fade) linear}
.dlg{width:440px;background:var(--s1);border:1px solid var(--line2);border-radius:var(--r4);box-shadow:var(--sh);padding:24px}
.dlg h2{margin:0 0 6px;font-size:19px}
.dlg .lead{margin:0 0 20px;color:var(--tx2)}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:var(--s2);border-radius:10px}
.seg button{height:34px;border-radius:8px;color:var(--tx2);font-size:13px;font-weight:500}
.seg button.on{background:var(--s3);color:var(--tx)}
.notif{position:absolute;top:34px;inset-inline-end:12px;width:340px;background:var(--s1);border:1px solid var(--line2);border-radius:var(--r3);box-shadow:var(--sh);z-index:35;padding:8px;animation:f var(--fade) linear}
.notif h4{margin:8px 12px 6px;font-size:13px;color:var(--tx2);font-weight:500}
.notif .row{border:0;border-radius:10px;min-height:0;padding:10px 12px;align-items:flex-start}

/* Police */
.disp{display:grid;grid-template-columns:400px 1fr;gap:20px;height:100%}
.disp .list{overflow:auto}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.map{border-radius:var(--r2);overflow:hidden;background:#111419;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.det{display:flex;flex-direction:column;gap:16px;overflow:auto}
.kv{display:grid;grid-template-columns:120px 1fr;row-gap:10px;font-size:14px}
.kv dt{color:var(--tx2)}.kv dd{margin:0}
.idh{display:flex;gap:20px;align-items:center}
.idh .ph{width:88px;height:88px;border-radius:var(--r3);background:var(--s3);display:grid;place-items:center;font-size:28px;font-weight:600;color:var(--tx2)}
.idh h2{margin:0 0 4px;font-size:24px}
.actbar{display:flex;gap:10px;padding:16px 32px;border-top:1px solid var(--line);background:var(--bg);flex:none}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--s2);border-radius:8px}
.qty button{width:28px;height:28px;color:var(--tx2)}.qty button:hover{color:var(--tx)}
.qty span{min-width:18px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}

/* Navigateur */
.br{position:absolute;inset:0;display:flex;flex-direction:column}
.brtabs{display:flex;gap:6px;padding:8px 16px 0;background:var(--s1)}
.brtabs .tb{display:flex;align-items:center;gap:10px;height:34px;padding:0 14px;border-radius:10px 10px 0 0;font-size:13px;color:var(--tx2);max-width:220px}
.brtabs .tb.on{background:var(--s2);color:var(--tx)}
.brbar{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--s2);border-bottom:1px solid var(--line)}
.brbar .ib{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--tx2)}
.brbar .ib:hover{background:var(--s3);color:var(--tx)}
.brbar .ib[disabled]{opacity:.3;cursor:default;background:none}
.addr{flex:1;height:36px;border-radius:10px;background:var(--bg);border:1px solid transparent;padding:0 16px;outline:none;text-align:center}
.addr:focus{border-color:var(--ac);text-align:start}
.ib.fav{color:var(--ac)}
.brpage{flex:1;overflow:auto;background:var(--bg)}
.brpage::-webkit-scrollbar{width:8px}.brpage::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}
.se{max-width:620px;margin:0 auto;padding:110px 24px 40px;text-align:center}
.se h1{font-size:40px;font-weight:700;letter-spacing:-1px;margin:0 0 28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 44px}
.chips button{height:32px;padding:0 14px;border-radius:999px;background:var(--s2);color:var(--tx2);font-size:13px}
.chips button:hover{color:var(--tx);background:var(--s3)}
.res{max-width:720px;margin:0 auto;padding:32px 24px}
.res a{display:block;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.res a b{color:var(--ac);font-size:16px;font-weight:600}
.res a small{display:block;color:var(--tx3);font-size:12px;margin:2px 0 6px}
/* Site Dynasty 8 (briques) */
.site{max-width:1000px;margin:0 auto;padding:0 40px 48px}
.site .snav{display:flex;align-items:center;height:72px;gap:28px;border-bottom:1px solid var(--line)}
.site .logo{font-weight:800;font-size:19px;letter-spacing:-.3px;margin-inline-end:auto;display:flex;align-items:center;gap:10px}
.site .logo i{width:28px;height:28px;border-radius:8px;background:var(--ac);display:grid;place-items:center;color:var(--ac-on);font-style:normal;font-size:15px}
.site .snav a{color:var(--tx2);font-size:14px;cursor:pointer}.site .snav a:hover{color:var(--tx)}
.blk{padding:40px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border:0}
.blk h1{font-size:44px;line-height:1.1;letter-spacing:-1.2px;margin:0 0 16px;max-width:640px}
.blk h2{font-size:24px;margin:0 0 20px;letter-spacing:-.3px}
.blk p{color:var(--tx2);font-size:16px;max-width:600px;margin:0}
.hero{border-radius:var(--r3);overflow:hidden;margin-top:28px;background:#14171d}
.hero svg,.cat svg{display:block;width:100%;height:auto}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);overflow:hidden}
.cat .b{padding:16px}
.cat b{display:block;font-size:15px}
.cat small{display:block;color:var(--tx2);font-size:13px;margin:4px 0 12px;min-height:38px}
.cat .pr{display:flex;align-items:center;justify-content:space-between}
.cat .pr>span:first-child{font-weight:700;font-size:17px}
.hrs{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.hrs table{width:100%;border-collapse:collapse}
.hrs td{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hrs td+td{text-align:end;color:var(--tx2)}
.hrs tr.today td{color:var(--tx);font-weight:600}
.sfoot{text-align:center;color:var(--tx3);font-size:12px;padding-top:24px}

/* Météo et gang */
.wx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:72px}
.wx .city{font-size:30px;font-weight:600;cursor:pointer;user-select:none;padding:4px 14px;border-radius:12px}
.wx .city.hold{background:var(--s2)}
.wx .deg{font-size:120px;font-weight:200;line-height:1;margin:6px 0 4px;letter-spacing:-4px}
.wx .cond{font-size:18px;color:var(--tx2)}
.wx .hours{display:flex;gap:8px;margin-top:44px;padding:16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r3)}
.wx .hours div{width:72px;text-align:center;font-size:13px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:8px}
.wx .hours b{color:var(--tx);font-size:15px}
.wx .days{display:grid;grid-template-columns:repeat(3,200px);gap:12px;margin-top:12px}
.wx .days div{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:14px}
.wx .days span{margin-inline-start:auto;color:var(--tx2);white-space:nowrap}
.wx .code{margin-top:24px;display:flex;flex-direction:column;gap:8px;align-items:center;height:76px}
.wx .code .in{width:200px;text-align:center;letter-spacing:4px}
.wx .code p{margin:0;color:var(--tx2);font-size:13px}.wx .code .in::placeholder{letter-spacing:0}
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:4px 32px 16px}
.msg{max-width:62%;display:flex;flex-direction:column;gap:4px}
.msg .bub{background:var(--s2);padding:10px 14px;border-radius:16px;border-end-start-radius:6px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--ac);color:var(--ac-on);border-radius:16px;border-end-end-radius:6px}
.msg .meta{font-size:11px;color:var(--tx3);display:flex;gap:10px}
.msg .meta button{color:var(--tx3);font-size:11px}.msg .meta button:hover{color:var(--danger)}
.compose{display:flex;gap:10px;padding:16px 32px 24px;border-top:1px solid var(--line)}
.more{align-self:center;font-size:12px;color:var(--ac)}
</style>

   '<span class="net" title="Réseau"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>'+
   (S.view!=='lock'?'<button class="bell" data-a="notif">'+I('bell')+'<em>3</em></button>':'')+

  k+='<button class="x" data-pin="del">'+t('del')+'</button><button data-pin="0">0</button><button class="x" data-pin="ok">'+t('ok')+'</button>';
  return '<div class="lock"><div class="l"><div class="clock ltr">'+clock()+'</div><div class="date">'+t('date')+'</div></div>'+
   '<div class="r"><h2>'+I('lock')+t('lockT')+'</h2><div class="dots ltr" id="dots">'+d+'</div><div class="lmsg">'+esc(S.lockMsg)+'</div>'+

}
function pinKey(k){
  if(k==='del'){S.pin=S.pin.slice(0,-1);return refreshDots()}
  if(k==='ok'){
    if(S.pin==='4821'){S.pin='';S.fails=0;S.lockMsg='';S.view='home';return render()}
    if(S.pin.length<4)return;
    S.fails=Math.min(S.fails+1,4);S.pin='';S.lockMsg=t('bad').replace('%d',5-S.fails);render();
    var d=$('#dots');d.classList.add('err');return;
  }
  if(S.pin.length<6){S.pin+=k;S.lockMsg='';refreshDots()}
}
function refreshDots(){var d=$('#dots');if(!d)return;d.classList.remove('err');[].forEach.call(d.children,function(e,i){e.className=i<S.pin.length?'f':''});$('.lmsg').textContent=S.lockMsg}

   '<div class="sfoot">dynasty8.rp · Site créé avec les briques de la tablette</div></div>';
}

/* ---------- Météo (app gang déguisée) ---------- */
var W={code:false,msg:'',fails:0};
function appMeteo(){
  return '<div class="wx"><button class="back" data-a="back" style="position:absolute;top:16px;inset-inline-start:20px">'+I('back','flip')+'</button><div class="city" id="city" title="">Los Santos</div><div class="deg ltr">24°</div><div class="cond">Ensoleillé · Max 27° Min 18°</div>'+
   (W.code?'<div class="code"><input class="in ltr" id="zip" maxlength="6" inputmode="numeric" placeholder="Code postal"><p>'+esc(W.msg)+'</p></div>':'')+
   '<div class="hours">'+[['Maint.','sun','24°'],['19 h','sun','23°'],['20 h','cloud','21°'],['21 h','cloud','20°'],['22 h','cloud','19°'],['23 h','cloud','19°'],['0 h','cloud','18°']].map(function(h){return '<div>'+h[0]+I(h[1])+'<b>'+h[2]+'</b></div>'}).join('')+'</div>'+
   '<div class="days">'+[['Mercredi','sun','27° / 18°'],['Jeudi','cloud','22° / 16°'],['Vendredi','sun','25° / 17°']].map(function(d){return '<div>'+I(d[1])+d[0]+'<span>'+d[2]+'</span></div>'}).join('')+'</div></div>';
}
var G={msgs:MSGS.slice(),ledger:LEDGER.slice(),lf:'Tout',nk:'Entrée'};
function appGang(){
  var foot='<div class="foot"><b>Corbeau · Lieutenant</b>Session fermée à la sortie</div>';
  if(S.sub==='comptes')return shell('gang','Comptes','Novembre 2026','<button class="btn p" data-a="newline">'+I('plus')+'Nouvelle ligne</button>',body(gangLedger()),foot);
  if(S.sub==='membres')return shell('gang','Membres','6 membres','',body('<div class="list">'+[['Mako','Chef','En ligne'],['Corbeau','Lieutenant','En ligne'],['Silence','Lieutenant','Hors ligne'],['Vito','Membre','En ligne'],['Pike','Membre','Hors ligne'],['Juno','Recrue','Hors ligne']].map(function(m){return '<div class="row"><span class="av">'+m[0][0]+'</span><div class="m"><b>'+m[0]+'</b><small>'+m[1]+'</small></div><span class="pill '+(m[2]==='En ligne'?'a':'o')+'">'+m[2]+'</span></div>'}).join('')+'</div>'),foot);
  var m=G.msgs.length?G.msgs.map(function(x,i){return '<div class="msg'+(x.me?' me':'')+'">'+(x.me?'':'<span class="meta"><b style="color:var(--tx2)">'+x.a+'</b></span>')+'<div class="bub">'+esc(x.t)+'</div><span class="meta"><span class="ltr">'+x.d+'</span>'+(x.me?'<button data-wd="'+i+'">Retirer</button>':'')+'</span></div>'}).join(''):'<div class="state"><p>Aucun message.</p></div>';
  return shell('gang','Messages','','','<div class="chat"><div class="msgs" id="msgs"><button class="more">Charger plus</button>'+m+'</div><div class="compose"><input class="in" id="gmsg" maxlength="300" placeholder="Message…"><button class="btn p" data-a="gsend">'+I('send','flip')+'</button></div></div>',foot);
}
function gangLedger(){
  var rows=G.ledger.filter(function(l){return G.lf==='Tout'||l.k+'s'===G.lf||(G.lf==='Partages'&&l.k==='Partage')});
  var kind={'Entrée':'a','Dépense':'o','Dette':'w','Partage':'o'};
  return '<div class="g4"><div class="card kpi"><small>Entrées</small><b>84 500 $</b></div><div class="card kpi"><small>Dépenses</small><b>31 200 $</b></div><div class="card kpi"><small>Dettes à recevoir</small><b>12 000 $</b></div><div class="card kpi"><small>Dettes à payer</small><b>4 500 $</b></div></div>'+
   '<div class="toolbar"><div class="tabs">'+['Tout','Entrées','Dépenses','Dettes','Partages'].map(function(x){return '<button class="'+(G.lf===x?'on':'')+'" data-lf="'+x+'">'+x+'</button>'}).join('')+'</div><span class="sp"></span><span class="faint" style="font-size:12px">Registre écrit : aucun argent ne bouge.</span></div>'+
   '<div class="list">'+(rows.length?rows.map(function(l){return '<div class="row"><span class="muted" style="width:44px">'+l.d+'</span><span class="pill '+kind[l.k]+'" style="width:76px;justify-content:center">'+l.k+'</span><div class="m"><b>'+esc(l.l)+'</b>'+(l.m?'<small>'+esc(l.m)+'</small>':'')+'</div><span class="amt ltr'+(l.v>0?' plus':'')+'">'+(l.v>0?'+':'−')+Math.abs(l.v).toLocaleString('fr-FR')+' $</span><button class="btn sm g">Corriger</button></div>'}).join(''):'<div class="state"><p>Aucune ligne.</p></div>')+'</div>';
}

/* ---------- Navigation ---------- */
var DEF={police:'dispatch',factures:'suivi',entreprise:'service',gang:'messages'};
function openApp(a){S.notif=false;S.app=a;S.sub=DEF[a]||null;S.hist=[];S.view='app';if(a==='navigateur'){N.url='';N.back=[];N.fwd=[]}if(a==='meteo'){W.code=false;W.msg=''}render()}
function sub(s){if(S.sub===s)return;S.hist.push(S.sub);S.sub=s;render()}
function back(){
  if(S.modal)return closeModal();
  if(S.notif){S.notif=false;return renderLayer()}
  if(S.view==='lock'||S.view==='home')return closeTablet();
  if(S.app==='meteo'&&W.code){W.code=false;return render()}
  if(S.app==='gang'){S.app='meteo';W.code=false;S.hist=[];return render()}
  if(S.app==='navigateur'&&N.back.length){N.fwd.push(N.url);N.url=N.back.pop();return render()}
  if(S.hist.length){S.sub=S.hist.pop();return render()}
  S.view='home';S.app=null;render();
}
function closeTablet(){S.open=false;S.modal=null;S.notif=false;$('#device').classList.add('closed');$('#hint').style.display='block'}
function openTablet(){if(S.open)return;S.open=true;S.view='lock';S.pin='';S.lockMsg='';$('#hint').style.display='none';$('#device').classList.remove('closed');render()}
function setDemo(d){
  [].forEach.call(document.querySelectorAll('#demo [data-demo]'),function(b){b.classList.toggle('on',b.dataset.demo===d)});
  if(!S.open)openTablet();
  S.modal=null;S.notif=false;if(S.view==='lock')S.view='home';
  S.demo=d==='normal'||d==='succes'?null:d;
  if(d==='hs'){S.duty=false;S.app='police';S.sub='dispatch';S.view='app';S.hist=[];return render()}
  if(d==='droit'){S.app='entreprise';S.sub='compte';S.view='app';S.hist=[];return render()}
  if(d==='normal'&&S.app&&S.view==='app'){return render()}
  S.app='factures';S.sub='suivi';S.view='app';S.hist=[];render();
  if(d==='succes')banner('Facture F-2026-0143 envoyée à Ana Ruiz.');
  if(d==='chargement'){clearTimeout(S.slowT);S.slowT=setTimeout(function(){var s=$('#slow');if(s&&S.demo==='chargement')s.innerHTML='<div class="state" style="padding:28px"><p>Le chargement prend plus de temps que prévu.</p><button class="btn" data-demo="chargement">Réessayer</button></div>'},5000)}
}

/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('button,[data-go],[data-a],tr[data-inv],[data-open]');
  if(!el){return}
  if(el.closest('.ov')&&!el.closest('.dlg')&&el.dataset.a!=='ovclose')return;
  var d=el.dataset;
  if(d.a==='ovclose'){if(e.target===el)closeModal();return}
  if(S.notif&&!el.closest('.notif')&&d.a!=='notif'){S.notif=false;renderLayer()}
  if(d.demo)return setDemo(d.demo);
  if(d.pin)return pinKey(d.pin);
  if(d.open){if(d.open==='meteo'||APPS.indexOf(d.open)>=0)openApp(d.open);return}
  if(d.sub){S.demo=S.demo==='hs'?null:S.demo;return sub(d.sub)}
  if(d.go!==undefined)return go(d.go);
  if(d.call){P.sel=d.call;return render()}
  if(d.ptab){P.tab=d.ptab;return render()}
  if(d.cit){S.hist.push(S.sub);S.sub='fiche';P.ftab='Casier';return render()}
  if(d.ftab){P.ftab=d.ftab;return render()}
  if(d.q){var q=d.q.split(':');P.inf[q[0]]=Math.max(1,Math.min(5,(P.inf[q[0]]||0)+(+q[1])));P.amount=null;return render()}
  if(d.stab){F.stTab=d.stab;return render()}
  if(d.del){F.lines.splice(+d.del,1);return render()}
  if(d.inv){var iv=INV.filter(function(x){return x.no===d.inv})[0];return modal(invDetail({no:iv.no,ent:iv.c,emp:iv.e,due:'01/12',st:iv.st,tot:iv.tot,lines:[['Prestation atelier',1,iv.tot]]}))}
  if(d.recv){return modal(invDetail(RECV.filter(function(x){return x.no===d.recv})[0]))}
  if(d.pf){payFrom=d.pf;return renderLayer()}
  if(d.ef){E.filter=d.ef;return render()}
  if(d.lf){G.lf=d.lf;return render()}
  if(d.nk){G.nk=d.nk;return renderLayer()}
  if(d.wd!==undefined){var wi=+d.wd;return modal(function(){return '<h2>Retirer ce message ?</h2><p class="lead">Il ne sera plus visible par le gang.</p><div class="acts"><button class="btn" data-a="mclose">Annuler</button><button class="btn d" data-a="wdgo" data-i="'+wi+'">Retirer</button></div>'})}
  var a=d.a;if(!a)return;
  switch(a){
  case 'back':return back();
  case 'home':S.view='home';S.app=null;return render();
  case 'lang':S.lang=S.lang==='fr'?'ar':'fr';return render();
  case 'notif':S.notif=!S.notif;return renderLayer();
  case 'duty':if(S.duty){S.duty=false;render();return banner('Vous n\'êtes plus en service.')}/* falls through */
  case 'takeduty':S.duty=true;S.dutySince=S.min;if(S.demo==='hs')S.demo=null;[].forEach.call(document.querySelectorAll('#demo [data-demo]'),function(b){b.classList.toggle('on',b.dataset.demo==='normal')});render();return banner('Vous êtes en service.');
  case 'leaveduty':S.duty=false;render();return banner('Vous n\'êtes plus en service.');
  case 'mclose':return closeModal();
  case 'take':var c=CALLS.filter(function(x){return x.id===P.sel})[0];c.status='pris';c.by.push('2-ADAM-14');render();return banner('Appel '+c.id+' pris. GPS activé.');
  case 'leave':var c2=CALLS.filter(function(x){return x.id===P.sel})[0];c2.by.splice(c2.by.indexOf('2-ADAM-14'),1);if(!c2.by.length)c2.status='nouveau';render();return banner('Vous vous êtes retiré de l\'appel '+c2.id+'.');
  case 'gps':return banner('Itinéraire posé sur votre GPS.');
  case 'closecall':return modal(function(){return '<h2>Clôturer l\'appel '+P.sel+'</h2><p class="lead">Choisissez un motif.</p><div class="fld"><label>Motif</label>'+['Traité','Fausse alerte','Sans suite','Transféré (EMS, autre service)'].map(function(m,i){return '<label class="check radio" style="padding:6px 0"><input type="radio" name="mo"'+(i?'':' checked')+'>'+m+'</label>'}).join('')+'</div><div class="fld"><label>Note (facultative)</label><input class="in"></div><label class="check" style="margin-bottom:20px"><input type="checkbox">Créer un rapport à partir de cet appel</label><div class="acts"><button class="btn" data-a="mclose">Annuler</button><button class="btn p" data-a="closego">Confirmer</button></div>'});
  case 'closego':var id=P.sel;for(var k=0;k<CALLS.length;k++)if(CALLS[k].id===id){CALLS.splice(k,1);break}P.sel=CALLS[0]?CALLS[0].id:null;S.modal=null;render();return banner('Appel '+id+' clôturé.');
  case 'emitfine':var tot=fineTotal(),v=parseInt(($('#famt')||{}).value,10)||0;if(v>tot){$('#ferr').textContent='Le montant ne peut pas dépasser le barème ('+moneyT(tot)+').';return}
    P.amendes.unshift({no:'A-0232',d:'24/11',c:NEAR[P.person].n,m:v,st:'attente'});S.hist.push(S.sub);S.sub='amendes';render();return banner('Amende A-0232 de '+moneyT(v)+' envoyée à '+NEAR[P.person].n+'.');
  case 'addline':if(F.lines.length<20)F.lines.push({a:'',q:1,p:0});render();var ins=document.querySelectorAll('[data-ln$=":a"]');ins[ins.length-1].focus();return;
  case 'sendinv':var ok=F.lines.some(function(l){return l.a&&l.q>0&&l.p>0});if(!ok)return banner('Ajoutez au moins un article.',true);
    var no='F-2026-0'+(F.invNo++),cl=['Ana Ruiz','Marcus Delaney'][F.client],tt=0;F.lines.forEach(function(l){tt+=l.q*l.p});INV.unshift({no:no,d:'24/11',c:cl,e:'Nina Valdez',tot:tt,st:'attente'});F.lines=[{a:'',q:1,p:0}];render();return banner('Facture '+no+' envoyée à '+cl+'.');
  case 'pay':var r=RECV.filter(function(x){return x.no===d.no})[0];payFrom='Banque';return modal(payDlg(r));
  case 'paygo':var r2=RECV.filter(function(x){return x.no===d.no})[0];r2.st='payee';BADGES.factures=Math.max(0,BADGES.factures-1);S.modal=null;render();return banner('Facture '+r2.no+' payée.');
  case 'refuse':var r3=RECV.filter(function(x){return x.no===d.no})[0];r3.st='refusee';S.modal=null;render();return banner('Facture '+r3.no+' refusée.');
  case 'deposit':case 'withdraw':var dep=a==='deposit';return modal(function(){return '<h2>'+(dep?'Déposer':'Retirer')+'</h2><p class="lead">Compte de Los Santos Customs.</p><div class="fld"><label>Montant</label><input class="in ltr" id="mamt" inputmode="numeric" placeholder="0 $"></div><div class="fld"><label>'+(dep?'Depuis':'Vers')+'</label><div class="seg"><button class="on">Banque</button><button>Liquide</button></div></div><div class="fld"><label>'+(dep?'Motif (facultatif)':'Motif')+'</label><input class="in" placeholder="'+(dep?'Dépôt':'Achat de pièces')+'"></div><div class="acts"><button class="btn" data-a="mclose">Annuler</button><button class="btn p" data-a="mvgo" data-dep="'+(dep?1:0)+'">'+(dep?'Déposer':'Retirer')+'</button></div>'});
  case 'mvgo':var amt=parseInt($('#mamt').value.replace(/\D/g,''),10)||0;if(amt<1){$('#mamt').style.borderColor='var(--danger)';return}var dp=d.dep==='1';E.bal+=dp?amt:-amt;E.moves.unshift({d:'24/11 '+clock(),l:dp?'Dépôt':'Retrait',b:'Nina Valdez',v:dp?amt:-amt});S.modal=null;render();return banner(moneyT(amt)+(dp?' déposés.':' retirés.'));
  case 'nback':if(N.back.length){N.fwd.push(N.url);N.url=N.back.pop();render()}return;
  case 'nfwd':if(N.fwd.length){N.back.push(N.url);N.url=N.fwd.pop();render()}return;
  case 'nreload':return render();
  case 'fav':var fi=N.fav.indexOf(N.url);if(fi>=0)N.fav.splice(fi,1);else N.fav.push(N.url);render();return banner(fi>=0?'Retiré des favoris.':'Ajouté aux favoris.');
  case 'd8contact':var f=$('#d8form');if(f)f.scrollIntoView();return;
  case 'd8send':return banner('Demande envoyée.');
  case 'gsend':var gi=$('#gmsg'),tx=gi.value.trim();if(!tx)return;G.msgs.push({a:'Corbeau',d:'24/11/2026 '+clock(),t:tx,me:true});render();var mm=$('#msgs');mm.scrollTop=mm.scrollHeight;$('#gmsg').focus();return;
  case 'wdgo':G.msgs.splice(+d.i,1);S.modal=null;render();return banner('Message retiré.');
  case 'newline':G.nk='Entrée';return modal(function(){return '<h2>Nouvelle ligne</h2><p class="lead">Le livre est un registre écrit : aucun argent ne bouge.</p><div class="seg" style="margin-bottom:16px">'+['Entrée','Dépense','Dette','Partage'].map(function(k){return '<button class="'+(G.nk===k?'on':'')+'" data-nk="'+k+'">'+k+'</button>'}).join('')+'</div><div class="fld"><label>Libellé</label><input class="in" id="ll" maxlength="60" placeholder="Vente lot n°13"></div><div class="fld"><label>Montant</label><input class="in ltr" id="lm" inputmode="numeric" placeholder="0 $"></div><div class="fld"><label>Membre lié (facultatif)</label><input class="in" placeholder="Surnom"></div><div class="acts"><button class="btn" data-a="mclose">Annuler</button><button class="btn p" data-a="linego">Enregistrer</button></div>'});
  case 'linego':var lv=parseInt($('#lm').value.replace(/\D/g,''),10)||0,ll=$('#ll').value.trim();if(!ll||!lv){banner('Certaines informations ne sont pas valides.',true);return}G.ledger.unshift({d:'24/11',k:G.nk,l:ll,m:'Corbeau',v:G.nk==='Entrée'?lv:-lv});S.modal=null;render();return banner('Enregistré.');
  }
});
document.addEventListener('input',function(e){
  var d=e.target.dataset;
  if(d.ln){var p=d.ln.split(':'),l=F.lines[+p[0]];l[p[1]]=p[1]==='a'?e.target.value:(parseInt(e.target.value,10)||0);var tt=0;F.lines.forEach(function(x){tt+=x.q*x.p});var lt=$('#lt'+p[0]);if(lt)lt.innerHTML=money(l.q*l.p);$('#ftot').innerHTML=money(tt)}
  if(e.target.id==='famt'){P.amount=parseInt(e.target.value,10)||0;var fe=$('#ferr');if(fe)fe.textContent=P.amount>fineTotal()?'Le montant ne peut pas dépasser le barème ('+moneyT(fineTotal())+').':''}
});
document.addEventListener('change',function(e){var d=e.target.dataset;if(d.person){P.person=+d.person;return render()}if(d.fc){F.client=+d.fc;return render()}if(d.inf){if(e.target.checked)P.inf[d.inf]=1;else delete P.inf[d.inf];P.amount=null;render()}});
document.addEventListener('keydown',function(e){
  var tg=e.target,k=e.key;
  if(k==='F9'){e.preventDefault();return openTablet()}
  if(!S.open)return;
  if(k==='Escape'){e.preventDefault();if(tg.id==='addr'){tg.value=N.url.replace(/^\?/,'');tg.blur();return}return back()}
  if(S.view==='lock'&&!S.modal){if(/^[0-9]$/.test(k))return pinKey(k);if(k==='Backspace')return pinKey('del');if(k==='Enter')return pinKey('ok')}
  if(k==='Enter'){
    if(tg.id==='csearch'){P.q=tg.value.trim();if(P.q.length<2){P.q='';}render();var cs=$('#csearch');cs.focus();return}
    if(tg.id==='addr'||tg.id==='sq'){var v=tg.value.trim().toLowerCase();if(!v)return go('');if(/^[a-z0-9-]+\.[a-z]+$/.test(v))return go(v);if(/^[a-z0-9-]{3,30}$/.test(v)&&SITES.some(function(s){return s.a===v+'.rp'}))return go(v+'.rp');return go('?'+tg.value.trim())}
    if(tg.id==='zip'){if(tg.value==='482915'){W.code=false;S.app='gang';S.sub='messages';S.hist=[];render();return banner('Session ouverte.')}W.fails++;W.msg='Code postal inconnu';tg.value='';render();$('#zip').focus();return}
    if(tg.id==='gmsg'){return document.querySelector('[data-a=gsend]').click()}
  }
});
/* appui long 1 s sur la ville */
var holdT;
document.addEventListener('pointerdown',function(e){if(e.target.id==='city'){e.target.classList.add('hold');holdT=setTimeout(function(){W.code=true;W.msg='';render();var z=$('#zip');if(z)z.focus()},1000)}});
document.addEventListener('pointerup',function(){clearTimeout(holdT);var c=$('#city');if(c)c.classList.remove('hold')});
document.addEventListener('pointerleave',function(){clearTimeout(holdT)});
$('#homebtn').addEventListener('click',function(){if(S.view==='app'){S.view='home';S.app=null;S.modal=null;render()}});
$('#hint').addEventListener('click',openTablet);

/* Mise à l'échelle : 85 % de la hauteur, 90 % de la largeur */
function fit(){var w=innerWidth,h=innerHeight-56;var s=Math.min(h*0.94/788,w*0.9/1208,1.4);$('#device').style.transform='translateY(22px) scale('+s+')'}
addEventListener('resize',fit);fit();
/* Heure du jeu : 1 minute de jeu = 2 s réelles */
setInterval(function(){if(!S.open)return;S.min=(S.min+1)%1440;var sp=$('#top .ltr');if(sp)sp.textContent=clock();var lc=$('.lock .clock');if(lc)lc.textContent=clock()},2000);
render();
window.__S=S;window.__setDemo=setDemo;
})();
</script>
