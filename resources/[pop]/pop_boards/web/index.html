<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="surface" class="surface pop-panel pop-fade">
    <div class="surface-head">
      <strong id="title"></strong>
      <button id="close" type="button" class="pop-button" data-locale="close"></button>
    </div>
    <form id="editor">
      <canvas id="art" width="512" height="512"></canvas>
      <div class="brush-controls">
        <label><span data-locale="color"></span><input id="color" type="color" value="#121212"></label>
        <label><span data-locale="brush"></span><input id="brush" type="range" min="1" max="32" value="8"></label>
        <button id="erase" type="button" class="pop-button" data-locale="erase"></button>
      </div>
      <div class="surface-actions">
        <button id="save" type="submit" class="pop-button" data-locale="confirm"></button>
        <button id="remove" type="button" class="pop-button" data-locale="remove"></button>
      </div>
    </form>
    <p id="status" class="surface-status pop-small" aria-live="polite"></p>
  </section>
  <script src="kit/pop.js"></script>
  <script src="drawing.js"></script>
  <script src="script.js"></script>
</body>
</html>
