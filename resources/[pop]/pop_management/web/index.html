<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>POP</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Panneau patron (focus NUI) -->
  <div id="mgmt-panel" class="pop-panel pop-fade">
    <header class="mgmt-head">
      <div class="mgmt-grow">
        <div id="mgmt-society" class="mgmt-strong"></div>
        <div id="mgmt-grade" class="pop-small"></div>
      </div>
      <div class="mgmt-end">
        <div class="pop-small" data-locale="balance"></div>
        <div id="mgmt-balance" class="mgmt-strong mgmt-num"></div>
      </div>
      <button type="button" id="mgmt-close" class="mgmt-link" data-locale="close"></button>
    </header>

    <nav class="mgmt-tabs">
      <button type="button" class="mgmt-tab" data-tab="employees" data-locale="tab_employees"></button>
      <button type="button" class="mgmt-tab" data-tab="account" data-locale="tab_account"></button>
    </nav>

    <!-- Onglet Employés -->
    <section id="mgmt-tab-employees" class="mgmt-view">
      <div id="mgmt-staff" class="mgmt-view">
        <div class="mgmt-bar-row">
          <span id="mgmt-count" class="pop-small"></span>
          <button type="button" id="mgmt-recruit" class="mgmt-btn" data-lock data-locale="recruit"></button>
        </div>
        <ul id="mgmt-employees" class="mgmt-list"></ul>
      </div>
      <div id="mgmt-nearby" class="mgmt-view pop-hidden">
        <div class="mgmt-bar-row">
          <span class="pop-small" data-locale="nearby_title"></span>
          <button type="button" id="mgmt-nearby-back" class="mgmt-btn" data-locale="cancel"></button>
        </div>
        <ul id="mgmt-nearby-list" class="mgmt-list"></ul>
      </div>
    </section>

    <!-- Onglet Compte -->
    <section id="mgmt-tab-account" class="mgmt-view pop-hidden">
      <label class="mgmt-field">
        <span class="pop-small" data-locale="amount"></span>
        <select id="mgmt-amount" class="mgmt-input" data-lock></select>
      </label>
      <div class="mgmt-row">
        <button type="button" id="mgmt-deposit" class="pop-button mgmt-grow" data-lock data-locale="deposit"></button>
        <button type="button" id="mgmt-withdraw" class="pop-button mgmt-grow" data-lock data-locale="withdraw"></button>
      </div>
      <div class="pop-small" data-locale="history"></div>
      <ul id="mgmt-history" class="mgmt-list"></ul>
    </section>
  </div>

  <!-- Formulaire de facture (focus NUI) -->
  <div id="mgmt-invoice" class="pop-panel pop-fade">
    <div>
      <div class="mgmt-strong" data-locale="invoice_title"></div>
      <div id="inv-society" class="pop-small"></div>
    </div>
    <label class="mgmt-field">
      <span class="pop-small" data-locale="invoice_to"></span>
      <select id="inv-target" class="mgmt-input" data-lock></select>
      <span id="inv-none" class="pop-small pop-hidden" data-locale="nearby_none"></span>
    </label>
    <label class="mgmt-field">
      <span class="pop-small" data-locale="amount"></span>
      <select id="inv-amount" class="mgmt-input" data-lock></select>
    </label>
    <label class="mgmt-field">
      <span class="pop-small" data-locale="invoice_reason"></span>
      <input type="text" id="inv-note" class="mgmt-input" maxlength="50" data-lock>
    </label>
    <div class="mgmt-row">
      <button type="button" id="inv-send" class="pop-button mgmt-grow" data-locale="invoice_send"></button>
      <button type="button" id="inv-cancel" class="mgmt-btn mgmt-grow" data-locale="cancel"></button>
    </div>
  </div>

  <!-- Offre reçue (jamais de focus) -->
  <div id="mgmt-offer" class="pop-panel pop-fade">
    <div id="offer-title" class="mgmt-strong"></div>
    <div id="offer-line" class="mgmt-num"></div>
    <div id="offer-note" class="pop-small pop-hidden"></div>
    <div class="mgmt-keys">
      <span><span id="offer-accept-key" class="pop-key"></span><span data-locale="offer_accept"></span></span>
      <span><span id="offer-refuse-key" class="pop-key"></span><span data-locale="offer_refuse"></span></span>
    </div>
    <div class="mgmt-timer"><div id="offer-fill" class="mgmt-timer-fill"></div></div>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
