<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>pop_dealing</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Masqué par défaut. Le HUD du kit est ajouté automatiquement. Textes remplis par script.js (locales). -->
  <div id="dealing" class="dl-column">

    <!-- Pastille de statut (mode vente actif, hors négociation) -->
    <div id="status" class="pop-panel pop-fade dl-status">
      <div class="pop-accent dl-strong" data-locale="hud_selling"></div>
      <div id="status-state"></div>
      <div id="status-stop" class="pop-small"></div>
    </div>

    <!-- Panneau de négociation -->
    <div id="deal" class="pop-panel pop-fade dl-deal">
      <div class="dl-row">
        <span class="dl-strong" data-locale="ui_title"></span>
        <span id="deal-attempts" class="pop-small"></span>
      </div>
      <div id="deal-qty"></div>
      <div class="pop-small">
        <span data-locale="ui_market"></span>
        <span id="deal-hint"></span>
      </div>

      <div class="dl-price">
        <button type="button" id="deal-minus" class="pop-button dl-step">-</button>
        <div class="dl-price-value">
          <span id="deal-price" class="pop-accent dl-strong"></span>
          <span class="pop-small" data-locale="ui_unit"></span>
        </div>
        <button type="button" id="deal-plus" class="pop-button dl-step">+</button>
      </div>

      <div class="dl-row">
        <span data-locale="ui_total"></span>
        <span id="deal-total" class="dl-strong"></span>
      </div>

      <div class="dl-actions">
        <button type="button" id="deal-propose" class="pop-button dl-primary" data-locale="ui_propose"></button>
        <button type="button" id="deal-refuse" class="pop-button" data-locale="ui_refuse"></button>
      </div>

      <div id="deal-feedback" class="pop-small dl-feedback" aria-live="polite"></div>
    </div>

  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
