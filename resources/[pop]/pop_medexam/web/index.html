<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>POP Medical Exam</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Mini-jeu (vision / réflexes) -->
  <div id="med-skill" class="pop-panel pop-fade">
    <div id="med-skill-label" class="med-title"></div>
    <div class="med-bar">
      <div id="med-skill-zone" class="med-zone"></div>
      <div id="med-skill-cursor" class="med-cursor"></div>
    </div>
    <div class="pop-small"><span id="med-skill-key" class="pop-key"></span> <span data-locale="skill_hint"></span></div>
  </div>

  <!-- Demande de consentement du patient -->
  <div id="med-consent" class="pop-panel pop-fade">
    <div id="med-consent-text"></div>
    <div class="pop-small med-keys">
      <span><span id="med-accept-key" class="pop-key"></span> <span data-locale="accept"></span></span>
      <span><span id="med-refuse-key" class="pop-key"></span> <span data-locale="refuse"></span></span>
    </div>
  </div>

  <!-- Carte du certificat -->
  <div id="med-card" class="pop-panel pop-fade">
    <div class="med-title" data-locale="card_title"></div>
    <div id="med-card-name"></div>
    <div id="med-card-issued" class="pop-small"></div>
    <div id="med-card-expires" class="pop-small"></div>
    <div id="med-card-doctor" class="pop-small"></div>
    <div id="med-card-status" class="med-status"></div>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
