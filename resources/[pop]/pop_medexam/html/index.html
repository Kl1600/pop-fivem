<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div id="exam" class="hidden">
    <svg id="lines" preserveAspectRatio="none"></svg>
    <div id="labels"></div>
    <div id="hint"><i class="fa-solid fa-heart-pulse"></i> Examen médical <span class="key">X</span> Fermer</div>
  </div>
  <script>
    /* responsive scale: --rsp = 1.0 @ 1920x1080, >1 sur plus haute resolution */
    (function () {
      function rsp() {
        document.documentElement.style.setProperty('--rsp', Math.min(window.innerWidth / 1920, window.innerHeight / 1080));
      }
      window.addEventListener('resize', rsp);
      rsp();
    })();
  </script>
  <script src="script.js"></script>
</body>
</html>
