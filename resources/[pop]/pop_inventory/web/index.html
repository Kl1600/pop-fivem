<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>pop_inventory</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Inventaire : deux panneaux sur les côtés, le centre de l'écran reste libre. -->
  <div id="inventory" class="pop-fade">
    <section id="panel-player" class="inv-panel pop-panel" data-side="player">
      <header class="inv-head">
        <span class="inv-label"></span>
        <span class="inv-weight pop-small"></span>
      </header>
      <div class="inv-bar"><div class="inv-bar-fill"></div></div>
      <div class="inv-grid"></div>
    </section>

    <div id="center">
      <label class="inv-amount-label pop-small" for="amount" data-locale="ui_amount"></label>
      <input id="amount" type="number" min="0" step="1" inputmode="numeric" autocomplete="off">
      <button id="btn-use" class="inv-action" type="button" data-locale="ui_use"></button>
      <button id="btn-give" class="inv-action" type="button" data-locale="ui_give"></button>
    </div>

    <section id="panel-secondary" class="inv-panel pop-panel" data-side="secondary">
      <header class="inv-head">
        <span class="inv-label"></span>
        <span class="inv-weight pop-small"></span>
      </header>
      <div class="inv-bar"><div class="inv-bar-fill"></div></div>
      <div class="inv-grid"></div>
    </section>
  </div>

  <div id="tooltip" class="pop-panel pop-hidden"></div>
  <div id="hotbar" class="pop-fade"></div>
  <div id="notify"></div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
