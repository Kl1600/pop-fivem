<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Import TT Firs Neue Trl font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.cdnfonts.com/css/tt-firs-neue-trl" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>3D UI</title>
</head>

<body>
    <div id="ui-container"></div>
    <script>
        /* responsive scale: --rsp = 1.0 @ 1920x1080, >1 sur plus haute resolution */
        (function () {
            function rsp() {
                document.documentElement.style.setProperty('--rsp', Math.min(window.innerWidth / 1920, window.innerHeight / 1080));
            }
            window.addEventListener('resize', rsp);
            rsp();
        })();
    </script>
    <script src="script.js"></script>
</body>

</html>
