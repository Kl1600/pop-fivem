<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intérim</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app" style="display: none;">
        <div id="carousel" class="carousel">
            <!-- Cases injectées -->
        </div>

        <div id="loader" class="loader hidden">
            <div class="loader-corner">
                <div class="loader-text">CHARGEMENT</div>
                <div class="gta-spinner"></div>
            </div>
        </div>
    </div>
    <script>
        /* responsive scale: --rsp = 1.0 @ 1920x1080, >1 sur plus haute resolution */
        (function () {
            function rsp() {
                document.documentElement.style.setProperty('--rsp', Math.min(window.innerWidth / 1920, window.innerHeight / 1080));
            }
            window.addEventListener('resize', rsp);
            rsp();
        })();
    </script>
    <script src="js/app.js"></script>
</body>

</html>
