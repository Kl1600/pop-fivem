<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>POP</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="interim" class="pop-panel pop-fade">
    <div class="interim-head">
      <span class="interim-title" data-locale="ui_title"></span>
      <button type="button" id="interim-close" class="interim-link pop-small" data-locale="close"></button>
    </div>
    <div id="interim-current" class="pop-small"></div>
    <ul id="interim-list"></ul>
    <div id="interim-cooldown" class="pop-small pop-hidden"></div>
    <div class="interim-foot">
      <button type="button" id="interim-confirm" class="pop-button" data-locale="confirm" disabled></button>
      <button type="button" id="interim-resign" class="interim-link pop-small" data-locale="ui_resign"></button>
    </div>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
