<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="menu" class="pop-panel pop-fade" inert>
    <header>
      <h1 data-locale="menu_title"></h1>
      <button id="close" class="pop-button" data-locale="close"></button>
    </header>
    <section id="invitation" hidden>
      <p id="inviter"></p>
      <div class="actions">
        <button id="accept" class="pop-button" data-locale="accept_invite"></button>
        <button id="decline" class="pop-button" data-locale="decline_invite"></button>
      </div>
    </section>
    <label class="filter"><input id="only-favorites" type="checkbox"><span data-locale="favorites"></span></label>
    <div id="items"></div>
    <button id="stop" class="pop-button" data-locale="cancel_emote" hidden></button>
  </main>
  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
