<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif; color: #fff; user-select: none; }
  #death { position: fixed; inset: 0; opacity: 0; transition: opacity 150ms ease; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.7) 100%); }
  #death.show { opacity: 1; }
  .panel { position: absolute; left: 50%; bottom: 9vh; transform: translateX(-50%); min-width: 320px;
    background: rgba(14,14,14,0.92); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
    padding: 16px 22px 14px; text-align: center; }
  .title { font-size: 13px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #e74c3c; }
  .sub { margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.6); }
  .timer { margin-top: 2px; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .call { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
  .key { min-width: 20px; padding: 2px 6px; border: 1px solid rgba(255,255,255,0.7); border-radius: 3px;
    font-size: 11px; font-weight: 700; }
  .call.sent { color: rgba(255,255,255,0.45); }
  .call.sent .key { display: none; }
</style>
</head>
<body>
  <div id="death">
    <div class="panel">
      <div class="title" id="title">Inconscient</div>
      <div class="sub" id="respawnIn">Transfert à l'hôpital dans</div>
      <div class="timer" id="timer">05:00</div>
      <div class="call" id="call"><span class="key" id="key">G</span><span id="callText">Appeler les secours</span></div>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  let texts = {};
  const fmt = (s) => {
    s = Math.max(0, s | 0);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };
  const setCallReady = () => {
    $('call').classList.remove('sent');
    $('callText').textContent = texts.callKey || 'Appeler les secours';
  };
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.action === 'show') {
      texts = d.texts || {};
      $('title').textContent = texts.title || 'Inconscient';
      $('respawnIn').textContent = texts.respawnIn || '';
      $('key').textContent = texts.key || 'G';
      setCallReady();
      $('timer').textContent = fmt(d.seconds);
      $('death').classList.add('show');
    } else if (d.action === 'tick') {
      $('timer').textContent = fmt(d.seconds);
    } else if (d.action === 'called') {
      $('call').classList.add('sent');
      $('callText').textContent = '✓ ' + (texts.callSent || 'Secours appelés');
    } else if (d.action === 'callReady') {
      setCallReady();
    } else if (d.action === 'hide') {
      $('death').classList.remove('show');
    }
  });
</script>
</body>
</html>
