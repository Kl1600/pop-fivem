<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Benny's</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="app" style="display:none">
    <div class="menu-container">

      <div class="header">
        <div class="title">ATELIER</div>
        <div class="vehicle-label" id="vehicle-name">—</div>
      </div>

      <div class="categories" id="categories"></div>

      <div class="content-wrapper">
        <div id="content"></div>
      </div>

      <div class="footer">
        <div class="cost-label">COÛT EN PIÈCES</div>
        <div class="cost-panel" id="cost-panel"></div>
        <div class="footer-actions">
          <div class="cancel-btn" onclick="closeMenu()">
            <i class="fa-solid fa-xmark"></i> ANNULER
          </div>
          <div class="apply-btn" id="apply-btn" onclick="applyMods()">
            <i class="fa-solid fa-check"></i> APPLIQUER
          </div>
        </div>
      </div>

    </div>
  </div>
  <script>
    /* responsive scale: --rsp = 1.0 @ 1920x1080, >1 sur plus haute resolution */
    (function () {
      function rsp() {
        document.documentElement.style.setProperty('--rsp', Math.min(window.innerWidth / 1920, window.innerHeight / 1080));
      }
      window.addEventListener('resize', rsp);
      rsp();
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
