<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>POP Bennys</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Interface propre au script (masquée par défaut). Le HUD du kit est ajouté automatiquement. -->
  <div id="app">
    <div id="bennys" class="pop-panel pop-fade">
      <div class="bennys-title" data-locale="title"></div>
      <div id="bennys-tabs"></div>
      <div id="bennys-items"></div>
      <div class="bennys-foot">
        <div id="bennys-total"></div>
        <div class="bennys-actions">
          <button type="button" id="bennys-confirm" class="pop-button" data-locale="confirm" disabled></button>
          <button type="button" id="bennys-cancel" class="pop-button bennys-ghost" data-locale="cancel"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
