<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>POP</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Carte rapport balistique (masquée par défaut, sans focus). Le HUD du kit est ajouté automatiquement. -->
  <div id="casing-report" class="pop-panel pop-fade" aria-live="polite">
    <div class="cr-title" data-locale="report_title"></div>
    <dl class="cr-rows">
      <div class="cr-row"><dt data-locale="report_caliber"></dt><dd id="cr-caliber"></dd></div>
      <div class="cr-row"><dt data-locale="report_signature"></dt><dd id="cr-signature" dir="ltr"></dd></div>
      <div class="cr-row"><dt data-locale="report_time"></dt><dd id="cr-time"></dd></div>
      <div class="cr-row"><dt data-locale="report_street"></dt><dd id="cr-street"></dd></div>
      <div class="cr-row"><dt data-locale="report_count"></dt><dd id="cr-count"></dd></div>
    </dl>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
