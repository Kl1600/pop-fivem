<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>POP</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Carte d'info de la plante la plus proche (masquée par défaut). -->
  <div id="weed-info" class="pop-panel pop-fade">
    <div class="weed-head">
      <span class="weed-title" data-locale="info_title"></span>
      <span id="weed-stage" class="weed-stage"></span>
    </div>
    <div class="weed-row">
      <div class="weed-line"><span class="weed-label" data-locale="info_growth"></span><span id="weed-growth-val" class="weed-val"></span></div>
      <div class="weed-track"><div id="weed-growth-bar" class="weed-fill"></div></div>
    </div>
    <div class="weed-row">
      <div class="weed-line"><span class="weed-label" data-locale="info_water"></span><span id="weed-water-val" class="weed-val"></span></div>
      <div class="weed-track"><div id="weed-water-bar" class="weed-fill"></div></div>
    </div>
    <div class="weed-row">
      <div class="weed-line"><span class="weed-label" data-locale="info_quality"></span><span id="weed-quality-val" class="weed-val"></span></div>
      <div class="weed-track"><div id="weed-quality-bar" class="weed-fill"></div></div>
    </div>
    <div id="weed-fert" class="pop-small"></div>
  </div>

  <!-- Panneau du mode placement (masqué par défaut). -->
  <div id="weed-place" class="pop-panel pop-fade">
    <span id="weed-reason" class="weed-reason pop-hidden"></span>
    <span id="weed-confirm" class="weed-action"><span id="weed-confirm-key" class="pop-key"></span><span data-locale="place_confirm"></span></span>
    <span class="weed-action"><span id="weed-cancel-key" class="pop-key"></span><span data-locale="cancel"></span></span>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
