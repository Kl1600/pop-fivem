<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>POP Radio</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="radio" class="pop-panel pop-fade" aria-hidden="true">
      <div class="radio-screen">
        <span class="radio-title" data-locale="title"></span>
        <span id="radio-freq" class="radio-freq" dir="ltr"></span>
      </div>

      <input id="radio-input" class="radio-input" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" dir="ltr">

      <div class="radio-actions">
        <button id="radio-connect" class="pop-button" type="button" data-locale="connect"></button>
        <button id="radio-off" class="pop-button radio-off" type="button" data-locale="turn_off"></button>
      </div>

      <div class="radio-volume">
        <span class="radio-volume-label" data-locale="volume"></span>
        <div class="radio-volume-ctrl" dir="ltr">
          <button id="radio-vol-down" class="radio-step" type="button">&minus;</button>
          <span id="radio-vol" class="radio-vol"></span>
          <button id="radio-vol-up" class="radio-step" type="button">+</button>
        </div>
      </div>
    </section>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
