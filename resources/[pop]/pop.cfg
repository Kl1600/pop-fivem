# =====================================================================
#  POP : configuration gérée depuis GitHub (dépôt pop-fivem).
#  Déployé automatiquement dans resources/[pop]/pop.cfg à chaque push.
#  NE PAS MODIFIER sur le serveur : ce fichier est écrasé au déploiement.
#  Aucun secret ici (clé de licence, mot de passe base : dans server.cfg / OuiPanel).
#
#  server.cfg doit contenir, tout en bas, à la place de "ensure [pop]" :
#      exec resources/[pop]/pop.cfg
# =====================================================================

# --- Inventaire : pop_inventory remplace l'inventaire ESX ---
# (es_extended : Config.CustomInventory = true, réglé sur le serveur)
stop esx_inventory

# --- Doublons ESX / POP ---
# Versions ESX coupées pour tester les POP (esx_hud->pop_hud, adminmenu->admin, policejob->police,
# banking->bank, lscustom->bennys, rpchat->chat, animations->emotes, joblisting->interim).
stop esx_hud
stop esx_adminmenu
stop esx_policejob
stop esx_banking
stop esx_lscustom
stop esx_rpchat
stop esx_animations
stop esx_joblisting

# --- Droits admin POP (pop_admin et commandes admin des scripts) ---
add_ace group.admin pop.admin allow

# --- Lancement de tous les scripts POP (toujours en dernier) ---
ensure [pop]
