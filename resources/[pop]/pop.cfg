# =====================================================================
#  POP : configuration gérée depuis GitHub (dépôt pop-fivem).
#  Déployé automatiquement dans resources/[pop]/pop.cfg à chaque push.
#  NE PAS MODIFIER sur le serveur : ce fichier est écrasé au déploiement.
#  Aucun secret ici (clé de licence, mot de passe base : dans server.cfg / OuiPanel).
#
#  server.cfg doit contenir, tout en bas :
#      exec resources/[pop]/pop.cfg
#
#  Les ressources ESX inutiles sont rangées hors de resources/ (dossier esx_desactives/).
#  ESX gardé (comme la base d'origine) : es_extended, esx_lib, esx_skin, skinchanger, cron,
#  esx_addonaccount, esx_addoninventory, esx_basicneeds, esx_datastore, esx_society, esx_status.
#  es_extended : Config.CustomInventory = true (pop_inventory remplace l'inventaire ESX).
# =====================================================================

# --- Droits admin POP (pop_admin et commandes admin des scripts) ---
add_ace group.admin pop.admin allow
add_ace resource.object_gizmo command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow

# --- Lancement de tous les scripts POP (toujours en dernier) ---
ensure [pop]
