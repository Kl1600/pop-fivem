<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="document" class="pop-panel pop-fade" aria-live="polite">
    <div class="document-head"><strong data-locale="document_title"></strong><span id="variant"></span></div>
    <strong id="name" dir="auto"></strong>
    <dl>
      <div><dt data-locale="document_number"></dt><dd id="serial" dir="ltr"></dd></div>
      <div id="birth-row"><dt data-locale="document_birth"></dt><dd id="birth" dir="ltr"></dd></div>
      <div id="sex-row"><dt data-locale="document_sex"></dt><dd id="sex"></dd></div>
      <div><dt data-locale="document_issued"></dt><dd id="issued" dir="ltr"></dd></div>
      <div id="expiry-row"><dt data-locale="document_expires"></dt><dd id="expiry" dir="ltr"></dd></div>
    </dl>
  </main>
  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
