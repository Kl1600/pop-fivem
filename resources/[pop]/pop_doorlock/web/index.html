<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>pop_doorlock</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Prompt de porte : [E] Libellé + cadenas. -->
  <div id="prompt" class="pop-panel pop-prompt dl-side dl-prompt pop-fade">
    <span id="prompt-key" class="pop-key"></span>
    <span id="prompt-label" class="dl-grow"></span>
    <svg id="icon-locked" class="dl-lock" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M4.5 6.5V4.5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="2.5" y="6.5" width="9" height="6" rx="1.2" fill="currentColor"/>
    </svg>
    <svg id="icon-unlocked" class="dl-lock pop-hidden" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M4.5 6.5V4.5a2.5 2.5 0 0 1 4.85-.85" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="2.5" y="6.5" width="9" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </div>

  <!-- Mini-jeu de crochetage. -->
  <div id="lockpick" class="pop-panel dl-side dl-lockpick pop-fade">
    <div class="dl-title" data-locale="lockpick_title"></div>
    <div id="lp-track" class="dl-track">
      <div id="lp-zone" class="dl-zone"></div>
      <div id="lp-cursor" class="dl-cursor"></div>
    </div>
    <div class="dl-lp-foot">
      <div id="lp-dots" class="dl-dots"></div>
      <span class="pop-small dl-hint"><span id="lp-key" class="pop-key"></span> <span data-locale="lockpick_hint"></span></span>
    </div>
  </div>

  <!-- Éditeur admin : vues list, detail, aim. -->
  <div id="editor" class="pop-panel dl-side dl-editor pop-fade">

    <section id="view-list" class="dl-view">
      <header class="dl-head">
        <span class="dl-title" data-locale="editor_title"></span>
        <button type="button" id="btn-new" class="pop-button" data-locale="editor_new_group"></button>
      </header>
      <p id="list-empty" class="pop-small dl-empty" data-locale="editor_empty"></p>
      <div id="group-list" class="dl-scroll"></div>
    </section>

    <section id="view-detail" class="dl-view pop-hidden">
      <header class="dl-head">
        <span id="detail-title" class="dl-title"></span>
        <button type="button" id="btn-back" class="pop-button dl-ghost" data-locale="editor_back"></button>
      </header>
      <div class="dl-scroll">
        <form id="form" autocomplete="off" novalidate>
          <label class="dl-field">
            <span class="pop-small" data-locale="editor_label"></span>
            <input type="text" id="f-label" maxlength="32" dir="auto">
          </label>
          <label class="dl-check">
            <input type="checkbox" id="f-locked">
            <span data-locale="editor_locked"></span>
          </label>
          <label class="dl-field">
            <span class="pop-small" data-locale="editor_distance"></span>
            <input type="number" id="f-distance" min="1" max="5" step="0.5" dir="ltr">
          </label>
          <fieldset class="dl-field">
            <legend class="pop-small" data-locale="editor_security"></legend>
            <div class="dl-seg">
              <label><input type="radio" name="security" value="0"><span data-locale="editor_security_0"></span></label>
              <label><input type="radio" name="security" value="1"><span data-locale="editor_security_1"></span></label>
              <label><input type="radio" name="security" value="2"><span data-locale="editor_security_2"></span></label>
            </div>
          </fieldset>
          <label id="row-alert" class="dl-check">
            <input type="checkbox" id="f-alert">
            <span data-locale="editor_alert"></span>
          </label>
          <label class="dl-field">
            <span class="pop-small" data-locale="editor_jobs"></span>
            <input type="text" id="f-jobs" maxlength="400" dir="ltr">
          </label>
          <label id="row-key" class="dl-check">
            <input type="checkbox" id="f-key">
            <span data-locale="editor_key"></span>
          </label>
          <p id="key-info" class="pop-small dl-info" data-locale="editor_key_unsupported"></p>
          <div class="dl-actions">
            <button type="submit" id="btn-save" class="pop-button" data-locale="editor_save"></button>
            <button type="button" id="btn-give" class="pop-button dl-ghost" data-locale="editor_give_key"></button>
            <button type="button" id="btn-reset" class="pop-button dl-ghost" data-locale="editor_reset_key"></button>
          </div>
        </form>

        <div class="dl-section">
          <div class="pop-small dl-section-title" data-locale="editor_doors"></div>
          <div id="door-list"></div>
          <button type="button" id="btn-add-door" class="pop-button dl-block" data-locale="editor_add_door"></button>
        </div>

        <button type="button" id="btn-delete" class="pop-button dl-danger dl-block"></button>
      </div>
    </section>

    <section id="view-aim" class="dl-view pop-hidden">
      <div class="dl-title" data-locale="editor_aim_title"></div>
      <div id="aim-count" class="pop-small"></div>
      <ul class="dl-keys">
        <li><span id="aim-key-select" class="pop-key"></span><span data-locale="editor_aim_select"></span></li>
        <li><span id="aim-key-confirm" class="pop-key"></span><span data-locale="editor_aim_confirm"></span></li>
        <li><span id="aim-key-cancel" class="pop-key"></span><span data-locale="cancel"></span></li>
      </ul>
    </section>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
