<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>POP Crew</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Panneau du crew (masqué par défaut). Le HUD du kit est ajouté automatiquement. -->
  <div id="app" class="pop-panel pop-fade">

    <div class="crew-panel-title pop-small" data-locale="crew_title"></div>

    <!-- Invitation reçue -->
    <section id="view-invite" class="crew-view pop-hidden">
      <div class="crew-title" data-locale="invite_title"></div>
      <div class="crew-line">
        <span id="invite-dot" class="crew-swatch"></span>
        <span id="invite-name" class="crew-name"></span>
      </div>
      <div id="invite-expires" class="pop-small"></div>
      <div class="crew-actions">
        <button id="invite-accept" class="pop-button" data-locale="accept"></button>
        <button id="invite-decline" class="pop-button" data-locale="decline"></button>
      </div>
    </section>

    <!-- Création -->
    <section id="view-create" class="crew-view pop-hidden">
      <div class="crew-title" data-locale="create_title"></div>
      <label class="pop-small" for="create-name" data-locale="create_name"></label>
      <input id="create-name" class="crew-input" type="text" autocomplete="off" spellcheck="false">
      <div class="pop-small" data-locale="create_color"></div>
      <div id="create-colors" class="crew-colors"></div>
      <div id="create-cost" class="pop-small"></div>
      <div class="crew-actions">
        <button id="create-submit" class="pop-button" data-locale="create_button"></button>
      </div>
    </section>

    <!-- Mon crew -->
    <section id="view-crew" class="crew-view pop-hidden">
      <div class="crew-head">
        <div class="crew-line">
          <span id="crew-dot" class="crew-swatch"></span>
          <span id="crew-name" class="crew-name crew-title"></span>
        </div>
        <div class="crew-line pop-small">
          <span id="crew-rank" class="crew-grow"></span>
          <span id="crew-count"></span>
        </div>
      </div>
      <div class="pop-small crew-list-title" data-locale="members"></div>
      <div id="crew-members" class="crew-list"></div>
      <div class="crew-actions">
        <button id="crew-invite" class="pop-button" data-locale="invite_button"></button>
        <button id="crew-leave" class="pop-button" data-locale="leave"></button>
        <button id="crew-disband" class="pop-button crew-danger" data-locale="disband"></button>
      </div>
    </section>

    <!-- Joueurs proches -->
    <section id="view-nearby" class="crew-view pop-hidden">
      <div class="crew-title" data-locale="invite_nearby"></div>
      <div id="nearby-list" class="crew-list"></div>
      <div id="nearby-none" class="pop-small pop-hidden" data-locale="invite_none"></div>
      <div class="crew-actions">
        <button id="nearby-back" class="pop-button" data-locale="back"></button>
      </div>
    </section>

    <div class="crew-actions crew-foot">
      <button id="close" class="pop-button" data-locale="close"></button>
    </div>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
