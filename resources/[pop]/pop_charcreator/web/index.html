<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POP</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="character" class="pop-panel pop-fade" hidden>
    <header>
      <h1 data-locale="title"></h1>
      <button type="button" id="close" class="pop-button" data-locale="close"></button>
    </header>
    <fieldset id="fields">
      <label><span data-locale="first_name"></span><input id="first" maxlength="48" required autocomplete="off"></label>
      <label><span data-locale="last_name"></span><input id="last" maxlength="48" required autocomplete="off"></label>
      <label><span data-locale="birth_date"></span><input type="date" id="birth" required></label>
      <label><span data-locale="model"></span><select id="model"></select></label>
      <div id="appearance"></div>
      <label id="spawn-label"><span data-locale="spawn"></span><select id="spawn"></select></label>
    </fieldset>
    <footer>
      <button type="button" class="pop-button rotate" data-direction="-1" data-locale="rotate_left"></button>
      <button type="button" class="pop-button rotate" data-direction="1" data-locale="rotate_right"></button>
      <button class="pop-button primary" id="save" data-locale="save"></button>
    </footer>
  </form>
  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
