<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>POP Bank</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bank" class="pop-panel pop-fade">
    <div class="bank-head">
      <span id="bank-title" class="bank-title" data-locale="ui_title"></span>
      <button id="bank-close" class="bank-link pop-small" data-locale="close"></button>
    </div>

    <div class="bank-balances">
      <div class="pop-small" data-locale="ui_bank"></div>
      <div id="bank-balance" class="bank-balance pop-accent"></div>
      <div class="bank-row pop-small">
        <span data-locale="ui_cash"></span>
        <span id="bank-cash"></span>
      </div>
      <div id="bank-account" class="pop-small pop-hidden"></div>
    </div>

    <div class="bank-tabs">
      <button id="tab-deposit" class="bank-tab" data-tab="deposit" data-locale="ui_deposit"></button>
      <button id="tab-withdraw" class="bank-tab" data-tab="withdraw" data-locale="ui_withdraw"></button>
      <button id="tab-transfer" class="bank-tab" data-tab="transfer" data-locale="ui_transfer"></button>
    </div>

    <form id="bank-form" class="bank-form" autocomplete="off">
      <input id="bank-target" class="bank-input pop-hidden" type="text" maxlength="64">
      <select id="bank-amount" class="bank-input"></select>
      <button id="bank-submit" type="submit" class="pop-button" data-locale="confirm"></button>
    </form>

    <div id="bank-status" class="bank-status pop-small"></div>

    <div class="bank-section pop-small" data-locale="ui_history"></div>
    <div id="bank-history" class="bank-history"></div>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
