<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="police-menu" class="pop-panel pop-fade" inert>
      <h1 data-locale="menu_title"></h1>
      <p id="menu-target" class="pop-small"></p>
      <div id="menu-actions"></div>
    </section>
    <section id="police-fine" class="pop-panel pop-fade" inert>
      <h1 data-locale="fine_title"></h1>
      <p id="fine-target" class="pop-small"></p>
      <form id="fine-form">
        <label for="fine-amount" data-locale="fine_amount"></label>
        <select id="fine-amount"></select>
        <small id="fine-bounds" class="pop-small"></small>
        <label for="fine-reason" data-locale="fine_reason"></label>
        <input id="fine-reason" maxlength="100">
        <div class="row">
          <button id="fine-send" class="pop-button" data-locale="fine_send"></button>
          <button id="fine-cancel" class="pop-button" type="button" data-locale="cancel"></button>
        </div>
      </form>
    </section>
    <section id="police-mdt" class="pop-panel pop-fade" inert>
      <header class="row">
        <h1 data-locale="mdt_title"></h1>
        <button id="mdt-close" class="pop-button" data-locale="close"></button>
      </header>
      <form id="mdt-search" class="row">
        <input id="mdt-query" maxlength="50">
        <button id="mdt-search-btn" class="pop-button" data-locale="mdt_search"></button>
      </form>
      <div id="mdt-results"></div>
      <article id="mdt-profile" hidden>
        <button id="mdt-back" class="pop-button" data-locale="mdt_back"></button>
        <h2 id="mdt-name"></h2>
        <p id="mdt-status" class="pop-small"></p>
        <p id="mdt-unpaid" class="danger" hidden></p>
        <section>
          <h2 data-locale="mdt_notes"></h2>
          <div id="mdt-notes"></div>
          <form id="mdt-note-form">
            <textarea id="mdt-note" maxlength="500"></textarea>
            <button id="mdt-add-note" class="pop-button" data-locale="mdt_add_note"></button>
          </form>
        </section>
        <section>
          <h2 data-locale="mdt_fines"></h2>
          <div id="mdt-fines"></div>
        </section>
      </article>
    </section>
    <section id="police-fine-request" class="pop-panel pop-fade" role="status" aria-hidden="true">
      <h1 data-locale="fine_request_title"></h1>
      <p id="fr-amount" class="pop-accent"></p>
      <p id="fr-reason"></p>
      <p id="fr-officer" class="pop-small"></p>
      <div class="row">
        <span><kbd id="fr-accept" class="pop-key"></kbd> <span data-locale="fine_pay"></span></span>
        <span><kbd id="fr-decline" class="pop-key"></kbd> <span data-locale="fine_decline"></span></span>
      </div>
      <div id="fr-timer"></div>
    </section>
  </main>
  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
