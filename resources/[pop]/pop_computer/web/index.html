<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="terminal" class="pop-panel pop-fade" role="dialog" aria-labelledby="title">
    <header>
      <h1 id="title" data-locale="terminal_title"></h1>
      <button id="close" class="pop-button" type="button" data-locale="close"></button>
    </header>
    <dl>
      <div><dt data-locale="terminal_user"></dt><dd id="user" dir="auto"></dd></div>
      <div id="role-row"><dt data-locale="terminal_role"></dt><dd id="role" dir="auto"></dd></div>
      <div><dt data-locale="terminal_time"></dt><dd id="time" dir="ltr"></dd></div>
    </dl>
  </main>
  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
