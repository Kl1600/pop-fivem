<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>POP</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="garage" class="pop-panel pop-fade">
    <div class="garage-title" data-locale="title"></div>
    <div id="garage-list"></div>
    <div class="garage-foot">
      <span id="garage-count" class="pop-small"></span>
      <button class="pop-button pop-small" id="garage-close" data-locale="close"></button>
    </div>
  </div>

  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
