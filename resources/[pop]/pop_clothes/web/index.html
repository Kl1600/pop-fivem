<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POP</title>
  <link rel="stylesheet" href="kit/pop.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="shop" class="pop-panel pop-fade" hidden>
    <header>
      <h1 id="title"></h1>
      <button type="button" id="close" class="pop-button" data-locale="close"></button>
    </header>
    <fieldset id="catalog"></fieldset>
    <div id="total"></div>
    <footer>
      <button type="button" class="pop-button rotate" data-direction="-1" data-locale="rotate_left"></button>
      <button type="button" class="pop-button rotate" data-direction="1" data-locale="rotate_right"></button>
      <button type="submit" id="buy" class="pop-button primary" data-locale="buy"></button>
    </footer>
  </form>
  <script src="kit/pop.js"></script>
  <script src="script.js"></script>
</body>
</html>
