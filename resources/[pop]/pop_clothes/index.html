<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magasin de Vêtement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'TT Firs Neue Trl';
            src: local('Inter');
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'TT Firs Neue Trl', 'Inter', sans-serif;
            background: transparent;
        }

        #app {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .bg-gradient {
            width: 100vw;
            height: 100vh;
            left: 0px; top: 0px;
            position: absolute;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.57) 26%, rgba(0, 0, 0, 0) 41%);
        }

        .divider-v {
            width: 1px; height: 885px;
            left: 122px; top: 7px;
            position: absolute;
            background: rgba(217, 217, 217, 0.13);
        }

        .divider-h {
            width: 408px; height: 1px;
            left: 122px; top: 81px;
            position: absolute;
            background: rgba(217, 217, 217, 0.13);
        }

        .app-title {
            width: 91px; left: 22px; top: 29px;
            position: absolute; text-align: center;
            color: white; font-size: 10px; font-weight: 400;
        }

        .category-title {
            left: 289px; top: 35px;
            position: absolute; color: white;
            font-size: 15px; font-weight: 400;
            text-transform: uppercase;
        }

        .scroll-container {
            width: 68px; height: max-content;
            max-height: 775px; left: 28px; top: 115px;
            position: absolute; background: rgba(245, 245, 245, 0.11);
            border-radius: 10px; overflow-y: auto;
            display: flex; flex-direction: column;
            gap: 20px; align-items: center;
            padding: 15px 0; scrollbar-width: none;
        }

        .scroll-container::-webkit-scrollbar { display: none; }

        .category-item {
            flex: 0 0 40px; width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 5px; cursor: pointer;
            border: 1px solid transparent; transition: background-color 0.2s;
        }

        .category-item:hover, .category-item.active {
            background-color: rgba(245, 245, 245, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .category-item .icon {
            width: 24px; height: 24px;
            color: rgba(255, 255, 255, 0.70);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; transition: color 0.2s;
        }

        .category-item:hover .icon, .category-item.active .icon { color: white; }

        .central-container {
            width: 391px; height: 778px;
            left: 139px; top: 114px;
            position: absolute; overflow-y: auto;
            scrollbar-width: none;
        }

        .central-container::-webkit-scrollbar { display: none; }

        #grid-container {
            display: flex; flex-wrap: wrap;
            gap: 19px 20px; width: 100%;
        }

        .grid-item {
            width: 117px; height: 114px;
            background: rgba(245, 245, 245, 0.11);
            border-radius: 3px; display: flex;
            align-items: center; justify-content: center;
            position: relative; cursor: pointer;
            border: 1px solid transparent; transition: transform 0.2s;
            overflow: hidden;
        }

        .grid-item:hover { transform: scale(1.02); background: rgba(245, 245, 245, 0.20); }
        .grid-item.selected { background: rgba(245, 245, 245, 0.25); border: 1px solid rgba(255, 255, 255, 0.6); }

        .grid-item img { width: 100%; height: 100%; object-fit: contain; }

        .item-price {
            position: absolute; bottom: 6px; right: 8px;
            color: white; font-size: 11px; font-weight: 600;
            background: rgba(0, 0, 0, 0.35); padding: 2px 5px;
            border-radius: 3px;
        }

        .buy-btn {
            width: 125px; height: 38px;
            left: 405px; top: 998px;
            position: absolute; cursor: pointer;
            border-radius: 3px; overflow: hidden;
        }

        .buy-bg { width: 100%; height: 100%; background: #5695C8; transition: filter 0.2s; }
        .buy-btn:hover .buy-bg { filter: brightness(1.2); }

        .buy-text {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 17px; font-weight: 700;
        }

        .variations-title { left: 37px; top: 916px; position: absolute; color: white; font-size: 16px; font-weight: 300; }
        .variations-count { width: 77px; left: 453px; top: 916px; position: absolute; text-align: right; color: white; font-size: 11px; line-height: 22px; }
        .variations-bar {
            width: 493px; height: 7px;
            left: 37px; top: 942px;
            position: absolute; background: rgba(217, 217, 217, 0.40);
            border-radius: 3px; appearance: none; outline: none; cursor: pointer;
        }
        .variations-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 69px; height: 7px; background: rgba(217, 217, 217, 0.80); border-radius: 3px; cursor: pointer; }

        #return-btn { position: absolute; left: 22px; top: 75px; color: white; font-size: 11px; cursor: pointer; display: none; opacity: 0.7; font-weight: 600; }

        .currency-selector {
            position: absolute;
            left: 37px;
            top: 998px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .currency-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .currency-options-wrapper {
            display: flex;
            background: rgba(245, 245, 245, 0.08);
            border-radius: 4px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .currency-option {
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        .currency-option:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }
        .currency-option.active {
            color: white;
            background: #5695C8;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="bg-gradient"></div>
        <div class="divider-v"></div>
        <div class="divider-h"></div>
        <div class="app-title" id="app-title">MAGASIN</div>
        <div class="category-title" id="category-title">CATÉGORIE</div>

        <div class="scroll-container" id="category-list"></div>

        <div class="central-container">
            <div id="grid-container"></div>
        </div>

        <div class="variations-title" id="slider-title">Variations</div>
        <div class="variations-count" id="variations-count">01 / 01</div>
        <input type="range" min="0" max="0" value="0" class="variations-bar" id="variations-slider" oninput="updateVariation(this.value)">

        <div class="currency-selector" id="currency-selector" style="display: none;">
            <div class="currency-label">Devise :</div>
            <div class="currency-options-wrapper">
                <div class="currency-option active" data-currency="cash" onclick="selectCurrency('cash')">DOLLAR ($)</div>
            </div>
        </div>

        <div class="buy-btn" onclick="buyItems()">
            <div class="buy-bg"></div>
            <div class="buy-text">ACHETER</div>
        </div>

        <div id="return-btn" onclick="returnToCreator()">◄ RETOUR</div>
    </div>

    <script>
        let currentGender = 'male';
        let shopType = 'clothing';
        const selectedItems = {};
        let GlobalCounts = {};
        let GlobalTattoos = {};
        let GlobalPrices = {};
        let currentCategory = null;
        let selectedCurrency = 'cash';
        let pesosRate = 20;

        const categoryMapping = {
            // Clothes
            'Masks': { icon: 'fas fa-mask', type: 'clothing', comp: 1, label: 'MASQUES' },
            'Hats': { icon: 'fas fa-hat-cowboy', type: 'prop', comp: 0, label: 'CHAPEAUX' },
            'Glasses': { icon: 'fas fa-glasses', type: 'prop', comp: 1, label: 'LUNETTES' },
            'Ears': { icon: 'fas fa-ear-listen', type: 'prop', comp: 2, label: 'BOUCLES' },
            'Accessories': { icon: 'fas fa-user-tie', type: 'clothing', comp: 7, label: 'ACCESSOIRES' },
            'Undershirts': { icon: 'fas fa-shirt', type: 'clothing', comp: 8, label: 'SOUS-VÊTEMENTS' },
            'Tops': { icon: 'fas fa-shirt', type: 'clothing', comp: 11, label: 'HAUTS' },
            'Legs': { icon: 'fas fa-socks', type: 'clothing', comp: 4, label: 'PANTALONS' },
            'Shoes': { icon: 'fas fa-shoe-prints', type: 'clothing', comp: 6, label: 'CHAUSSURES' },
            'Bags': { icon: 'fas fa-bag-shopping', type: 'clothing', comp: 5, label: 'SACS' },
            'Watches': { icon: 'fas fa-clock', type: 'prop', comp: 6, label: 'MONTRES' },
            'Bracelets': { icon: 'fas fa-ring', type: 'prop', comp: 7, label: 'BRACELETS' },
            'Torsos': { icon: 'fas fa-user', type: 'clothing', comp: 3, label: 'BRAS' },
            'Body Armors': { icon: 'fas fa-shield-halved', type: 'clothing', comp: 9, label: 'GILETS' },
            'Decals': { icon: 'fas fa-layer-group', type: 'clothing', comp: 10, label: 'DÉCALS' },
            // Barber
            'Hair': { icon: 'fas fa-scissors', type: 'clothing', comp: 2, label: 'COIFFURE' },
            'Beard': { icon: 'fas fa-user-ninja', type: 'overlay', comp: 1, label: 'BARBE' },
            'Eyebrows': { icon: 'fas fa-eye', type: 'overlay', comp: 2, label: 'SOURCILS' },
            'ChestHair': { icon: 'fas fa-person', type: 'overlay', comp: 10, label: 'TORSE' },
            'Makeup': { icon: 'fas fa-paint-brush', type: 'overlay', comp: 4, label: 'MAQUILLAGE' },
            'Lipstick': { icon: 'fas fa-face-kiss', type: 'overlay', comp: 8, label: 'ROUGE À LÈVRES' },
            'Blush': { icon: 'fas fa-wand-magic-sparkles', type: 'overlay', comp: 5, label: 'BLUSH' },
            // Tattoos
            'Head': { icon: 'fas fa-user', type: 'tattoo', label: 'TÊTE' },
            'Torso': { icon: 'fas fa-vest', type: 'tattoo', label: 'TORSE' },
            'LeftArm': { icon: 'fas fa-hand-fist', type: 'tattoo', label: 'BRAS GAUCHE' },
            'RightArm': { icon: 'fas fa-hand-fist', type: 'tattoo', label: 'BRAS DROIT' },
            'LeftLeg': { icon: 'fas fa-walking', type: 'tattoo', label: 'JAMBE GAUCHE' },
            'RightLeg': { icon: 'fas fa-walking', type: 'tattoo', label: 'JAMBE DROITE' }
        };

        function initCategories(categories) {
            const container = document.getElementById('category-list');
            container.innerHTML = '';
            categories.forEach(cat => {
                const info = categoryMapping[cat];
                if (!info) return;
                const div = document.createElement('div');
                div.className = 'category-item';
                div.innerHTML = `<i class="${info.icon} icon"></i>`;
                div.onclick = () => {
                    document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
                    div.classList.add('active');
                    document.getElementById('category-title').innerText = info.label;
                    currentCategory = cat;
                    loadItems(cat, info);

                    // Trigger camera focus & auto-rotation on the client side
                    fetch(`https://${GetParentResourceName()}/switchCategory`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ category: cat })
                    });
                };
                container.appendChild(div);
            });
        }

        function loadItems(cat, info) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            let count = 20;

            if (info.type === 'tattoo') {
                const tattoos = GlobalTattoos[cat] || [];
                tattoos.forEach((t, i) => createGridItem(container, i, cat, info, t.label));
                const slider = document.getElementById('variations-slider');
                const max = Math.max(0, tattoos.length - 1);
                slider.max = max;
                slider.value = 0;
                updateVariationDisplay(0, max);
            } else {
                const countKey = info.type === 'prop' ? 'props' : (info.type === 'overlay' ? 'overlays' : 'clothing');
                count = (GlobalCounts[countKey] && GlobalCounts[countKey][info.comp]) || 20;
                
                createGridItem(container, -1, cat, info);

                for (let i = 0; i < count; i++) createGridItem(container, i, cat, info);
            }
        }

        // End preview when the mouse leaves the grid (restores the pre-preview state)
        document.getElementById('grid-container').addEventListener('mouseleave', () => {
            fetch(`https://${GetParentResourceName()}/endPreview`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: '{}'
            });
        });

        function createGridItem(container, i, cat, info, label) {
            const div = document.createElement('div');
            div.className = 'grid-item';
            if (selectedItems[cat] && selectedItems[cat].index === i) div.classList.add('selected');
            
            if (info.type === 'tattoo') {
                let svgIcon = '';
                if (cat === 'Head') {
                    svgIcon = `<svg viewBox="0 0 24 24" width="40" height="40" stroke="#5695C8" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.65"><path d="M12 2a5 5 0 0 0-5 5v3a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5zM6 15v1a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3v-1M12 19v3"></path></svg>`;
                } else if (cat === 'Torso') {
                    svgIcon = `<svg viewBox="0 0 24 24" width="40" height="40" stroke="#5695C8" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.65"><path d="M12 22v-9M5 3h14M5 3l2 7h10l2-7M7 10v7a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3v-7"></path></svg>`;
                } else if (cat === 'LeftArm' || cat === 'RightArm') {
                    svgIcon = `<svg viewBox="0 0 24 24" width="40" height="40" stroke="#5695C8" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.65"><path d="M6 3h12l-1 9a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4L6 3zM12 16v6"></path></svg>`;
                } else {
                    svgIcon = `<svg viewBox="0 0 24 24" width="40" height="40" stroke="#5695C8" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.65"><path d="M7 3h10v10l-2 5-1 4H10l-1-4-2-5V3z"></path></svg>`;
                }

                const prices = { 'Head': 150, 'Torso': 300, 'LeftArm': 200, 'RightArm': 200, 'LeftLeg': 180, 'RightLeg': 180 };
                const price = prices[cat] || 150;
                const displayPrice = selectedCurrency === 'pesos' ? (price * pesosRate) : price;
                const symbol = selectedCurrency === 'pesos' ? ' ₱' : '$';

                // Ensure styling doesn't corrupt layout
                div.style.display = 'flex';
                div.style.flexDirection = 'column';
                div.style.padding = '8px';
                div.style.justifyContent = 'space-between';
                div.style.alignItems = 'center';
                
                div.innerHTML = `
                    <div style="margin-top: 4px; display: flex; justify-content: center; align-items: center; width: 100%; height: 40px;">
                        ${svgIcon}
                    </div>
                    <div style="color: white; font-size: 10px; text-align: center; font-weight: 600; width: 100%; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 20px; padding: 0 4px;">
                        ${label || '#'+i}
                    </div>
                    <div class="item-price" style="position: absolute; bottom: 4px; right: 4px; font-size: 9px; padding: 1px 4px; z-index: 10;">
                        ${displayPrice}${symbol}
                    </div>
                `;
            } else {
                if (i === -1) {
                    const fallback = document.createElement('div');
                    fallback.style.cssText = 'color:white;font-size:16px;text-align:center;font-weight:bold;';
                    fallback.innerText = '-1';
                    div.appendChild(fallback);
                } else {
                    const img = document.createElement('img');
                    let typeStr;
                    if (info.type === 'prop') {
                        typeStr = `prop_${info.comp}`;
                    } else if (info.type === 'overlay') {
                        typeStr = `overlay_${info.comp}`;
                    } else {
                        typeStr = info.comp;
                    }
                    // Vignettes uz_AutoShot : ressource absente du serveur -> numéro affiché
                    // directement (évite des centaines d'erreurs 404). Remettre true si installée.
                    const USE_AUTOSHOT = false;
                    if (USE_AUTOSHOT) img.src = `https://cfx-nui-uz_AutoShot/shots/${currentGender}/${typeStr}/${i}.png`;
                    img.onerror = function() {
                        this.style.display = 'none';
                        const fallback = document.createElement('div');
                        fallback.style.cssText = 'color:white;font-size:12px;text-align:center;';
                        fallback.innerText = '#' + i;
                        this.parentNode.appendChild(fallback);
                    };
                    if (USE_AUTOSHOT) {
                        div.appendChild(img);
                    } else {
                        const fallback = document.createElement('div');
                        fallback.style.cssText = 'color:white;font-size:12px;text-align:center;';
                        fallback.innerText = '#' + i;
                        div.appendChild(fallback);
                    }
                    
                    const priceVal = GlobalPrices[cat] || GlobalPrices['default'] || 50;
                    const displayPrice = selectedCurrency === 'pesos' ? (priceVal * pesosRate) : priceVal;
                    const symbol = selectedCurrency === 'pesos' ? ' ₱' : '$';
                    const priceDiv = document.createElement('div');
                    priceDiv.className = 'item-price';
                    priceDiv.innerText = displayPrice + symbol;
                    div.appendChild(priceDiv);
                }
            }

            // Real-time preview on hover (now supporting tattoos!)
            div.addEventListener('mouseenter', () => {
                const payload = {
                    index: i, type: info.type, component: info.comp,
                    category: cat, isPreview: true
                };
                if (info.type === 'tattoo') {
                    const tat = GlobalTattoos[cat][i];
                    if (tat) {
                        payload.collection = tat.collection;
                        payload.hash = tat.hash;
                        payload.label = tat.label;
                    }
                } else {
                    const sel = selectedItems[cat];
                    payload.texture = (sel && sel.index === i && sel.texture) ? sel.texture : 0;
                }
                fetch(`https://${GetParentResourceName()}/change`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            });

            div.onclick = () => {
                container.querySelectorAll('.grid-item').forEach(s => s.classList.remove('selected'));
                div.classList.add('selected');
                selectedItems[cat] = { index: i, type: info.type, component: info.comp };

                if (info.type === 'tattoo') {
                    const tat = GlobalTattoos[cat][i];
                    selectedItems[cat].collection = tat.collection;
                    selectedItems[cat].hash = tat.hash;
                    selectedItems[cat].label = tat.label;
                }

                fetch(`https://${GetParentResourceName()}/change`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...selectedItems[cat], category: cat })
                });

                const slider = document.getElementById('variations-slider');
                if (shopType === 'barber') {
                    slider.max = 63; slider.value = 0; updateVariationDisplay(0, 63);
                } else if (info.type === 'tattoo') {
                    const tattoos = GlobalTattoos[cat] || [];
                    const max = Math.max(0, tattoos.length - 1);
                    slider.max = max;
                    slider.value = i;
                    updateVariationDisplay(i, max);
                } else {
                    if (i === -1) {
                        slider.max = 0; slider.value = 0; updateVariationDisplay(0, 0);
                    } else {
                        fetch(`https://${GetParentResourceName()}/requestTextures`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ type: info.type, component: info.comp, index: i })
                        }).then(r => r.json()).then(resp => {
                            let m = (resp.count || 1) - 1;
                            if (m < 0) m = 0;
                            slider.max = m; slider.value = 0; updateVariationDisplay(0, slider.max);
                        });
                    }
                }
            };
            container.appendChild(div);
        }

        function updateVariation(val) {
            const slider = document.getElementById('variations-slider');
            const info = categoryMapping[currentCategory];
            const idx = parseInt(val);

            if (info && info.type === 'tattoo') {
                const tattoos = GlobalTattoos[currentCategory] || [];
                const tat = tattoos[idx];
                if (!tat) return;
                selectedItems[currentCategory] = {
                    index: idx, type: 'tattoo', component: info.comp,
                    collection: tat.collection, hash: tat.hash, label: tat.label
                };
                document.querySelectorAll('.grid-item').forEach((el, i) => {
                    el.classList.toggle('selected', i === idx);
                });
                fetch(`https://${GetParentResourceName()}/change`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...selectedItems[currentCategory], category: currentCategory })
                });
                updateVariationDisplay(idx, slider.max);
                return;
            }

            if (!selectedItems[currentCategory]) return;
            selectedItems[currentCategory].texture = idx;
            fetch(`https://${GetParentResourceName()}/change`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...selectedItems[currentCategory], category: currentCategory })
            });
            updateVariationDisplay(idx, slider.max);
        }

        function updateVariationDisplay(curr, max) {
            curr = parseInt(curr) + 1; max = parseInt(max) + 1;
            document.getElementById('variations-count').innerText = (curr < 10 ? '0' + curr : curr) + ' / ' + (max < 10 ? '0' + max : max);
        }

        let isCreatorMode = false;

        function selectCurrency(currency) {
            selectedCurrency = currency;
            document.querySelectorAll('.currency-option').forEach(opt => {
                if (opt.getAttribute('data-currency') === currency) {
                    opt.classList.add('active');
                } else {
                    opt.classList.remove('active');
                }
            });
            if (currentCategory) {
                loadItems(currentCategory, categoryMapping[currentCategory]);
            }
        }

        function buyItems() {
            fetch(`https://${GetParentResourceName()}/buy`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cart: selectedItems, type: shopType, currency: selectedCurrency })
            });
        }

        function returnToCreator() {
            // Pour les tatouages en mode créateur, on sauvegarde la sélection
            // avant de fermer (sinon les tatouages prévisualisés seraient perdus).
            if (isCreatorMode && shopType === 'tattoo' && Object.keys(selectedItems).length > 0) {
                fetch(`https://${GetParentResourceName()}/buy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart: selectedItems, type: shopType })
                });
            }
            closeUI();
        }

        function closeUI() {
            document.getElementById('app').style.display = 'none';
            fetch(`https://${GetParentResourceName()}/close`, { method: 'POST', body: '{}' });
        }

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.action === 'open') {
                shopType = data.shopType || 'clothing';
                currentGender = data.currentGender || 'male';
                GlobalCounts = data.counts || {};
                GlobalTattoos = data.tattoos || {};
                GlobalPrices = data.prices || {};
                pesosRate = data.pesosRate || 20;
                
                isCreatorMode = !!data.isCreator;
                if (data.isCreator) {
                    document.querySelector('.buy-btn').style.display = 'none';
                    const retBtn = document.getElementById('return-btn');
                    retBtn.style.display = 'block';
                    retBtn.textContent = shopType === 'tattoo' ? '◄ ENREGISTRER ET RETOURNER' : '◄ RETOUR';
                    document.getElementById('currency-selector').style.display = 'none';
                } else {
                    document.querySelector('.buy-btn').style.display = 'block';
                    document.getElementById('return-btn').style.display = 'none';
                    // Plus de choix de devise : paiement en dollars (cash, sinon banque)
                    document.getElementById('currency-selector').style.display = 'none';
                    selectedCurrency = 'cash';
                }
                
                document.getElementById('app').style.display = 'block';
                document.getElementById('app-title').innerText = shopType === 'clothing' ? 'MAGASIN DE VÊTEMENTS' : (shopType === 'barber' ? 'BARBIER / SALON' : 'TATTOO STUDIO');
                document.getElementById('slider-title').innerText = shopType === 'barber' ? 'COULEURS' : 'VARIATIONS';
                initCategories(data.categories);
                const first = document.querySelector('.category-item');
                if (first) first.click();
            } else if (data.action === 'close') {
                closeUI();
            }
        });

        document.onkeyup = (e) => { if (e.which == 27) closeUI(); };

        // Camera Controls
        let isDragging = false, lastX = 0, lastY = 0;
        document.getElementById('app').addEventListener('mousedown', (e) => {
            if (e.target.closest('.scroll-container') || e.target.closest('.central-container') || e.target.closest('.variations-bar') || e.target.closest('.buy-btn') || e.target.closest('.currency-selector')) return;
            isDragging = true; lastX = e.clientX; lastY = e.clientY;
        });
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - lastX, deltaY = e.clientY - lastY;
                lastX = e.clientX; lastY = e.clientY;
                fetch(`https://${GetParentResourceName()}/rotate`, { method: 'POST', body: JSON.stringify({ deltaX, deltaY }) });
            }
        });
        document.getElementById('app').addEventListener('wheel', (e) => {
            if (e.target.closest('.central-container') || e.target.closest('.scroll-container')) return;
            fetch(`https://${GetParentResourceName()}/zoom`, { method: 'POST', body: JSON.stringify({ delta: e.deltaY }) });
        }, { passive: true });
    </script>
</body>

</html>
