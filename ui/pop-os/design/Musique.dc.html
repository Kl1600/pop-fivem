<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Musique</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; display: flex; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: {{c.cell}}; color: {{c.fg}}; overflow: hidden; position: relative">

<nav aria-label="Musique" style="width: 280px; flex-shrink: 0; height: 100%; box-sizing: border-box; background: {{c.side}}; border-right: 1px solid {{c.sep}}; padding: 46px 14px 20px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 34px; font-weight: 700; padding: 0 10px 12px">Musique</span>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
<span style="display: {{n.headShow}}; font-size: 13px; font-weight: 600; color: {{c.sub}}; padding: 14px 10px 6px">Bibliothèque</span>
<button onClick="{{n.go}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; border-radius: 10px; background: {{n.bg}}; color: {{n.fg}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"/></svg>
<span style="font-size: 17px">{{n.name}}</span>
</button>
</sc-for>
</nav>

<main style="flex-grow: 1; min-width: 0; height: 100%; position: relative; background: {{c.cell}}">
<div style="position: absolute; inset: 0; overflow-y: auto; padding: 46px 40px 130px">
<span style="display: block; font-size: 34px; font-weight: 700; padding-bottom: 18px">{{title}}</span>

<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<span style="display: block; font-size: 22px; font-weight: 700; padding: 6px 0 12px">Écoutés récemment</span>
<div style="display: flex; gap: 20px; flex-wrap: wrap">
<sc-for list="{{recent}}" as="a" hint-placeholder-count="4">
<button onClick="{{a.go}}" style="all: unset; cursor: pointer; width: 190px; display: flex; flex-direction: column; gap: 4px"><span style="display: block; width: 190px; height: 190px; border-radius: 12px; background: {{a.bg}}; box-shadow: 0 6px 16px rgba(0,0,0,.2)"></span><span style="font-size: 16px; font-weight: 600; padding-top: 6px">{{a.title}}</span><span style="font-size: 14px; color: {{c.sub}}">{{a.sub}}</span></button>
</sc-for>
</div>
<span style="display: block; font-size: 22px; font-weight: 700; padding: 30px 0 12px">Radios de Los Santos</span>
<div style="display: flex; gap: 16px; flex-wrap: wrap">
<sc-for list="{{radiosHome}}" as="r" hint-placeholder-count="4">
<button onClick="{{r.go}}" style="all: unset; cursor: pointer; width: 250px; height: 140px; border-radius: 16px; background: {{r.bg}}; color: #fff; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; opacity: .85">{{r.tag}}</span><span style="font-size: 20px; font-weight: 800">{{r.name}}</span></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isGrid}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 22px; flex-wrap: wrap">
<sc-for list="{{cards}}" as="a" hint-placeholder-count="6">
<button onClick="{{a.go}}" style="all: unset; cursor: pointer; width: 190px; display: flex; flex-direction: column; gap: 4px"><span style="display: block; width: 190px; height: 190px; border-radius: 12px; background: {{a.bg}}; box-shadow: 0 6px 16px rgba(0,0,0,.2)"></span><span style="font-size: 16px; font-weight: 600; padding-top: 6px">{{a.title}}</span><span style="font-size: 14px; color: {{c.sub}}">{{a.sub}}</span></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isRadio}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px">
<sc-for list="{{radios}}" as="r" hint-placeholder-count="6">
<button onClick="{{r.go}}" style="all: unset; cursor: pointer; height: 160px; border-radius: 18px; background: {{r.bg}}; color: #fff; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; position: relative"><span style="position: absolute; top: 16px; right: 16px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; padding: 3px 8px; border-radius: 10px; background: rgba(0,0,0,.3)">{{r.live}}</span><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; opacity: .85">{{r.tag}}</span><span style="font-size: 22px; font-weight: 800">{{r.name}}</span></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isArtists}}" hint-placeholder-val="{{false}}">
<sc-for list="{{artists}}" as="a" hint-placeholder-count="5">
<button onClick="{{a.go}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 16px; width: 100%; box-sizing: border-box; padding: 10px 0; border-bottom: 1px solid {{c.sep}}"><span style="width: 64px; height: 64px; border-radius: 32px; background: {{a.bg}}"></span><span style="font-size: 19px; font-weight: 600; flex-grow: 1">{{a.name}}</span><span style="font-size: 15px; color: {{c.sub}}">{{a.sub}}</span></button>
</sc-for>
</sc-if>

<sc-if value="{{isSongs}}" hint-placeholder-val="{{false}}">
<sc-for list="{{songs}}" as="t" hint-placeholder-count="8">
<button onClick="{{t.go}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; height: 58px; border-bottom: 1px solid {{c.sep}}"><span style="width: 44px; height: 44px; border-radius: 8px; background: {{t.bg}}"></span><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600; color: {{t.color}}">{{t.title}}</span><span style="font-size: 14px; color: {{c.sub}}">{{t.artist}}</span></span><span style="font-size: 15px; color: {{c.sub}}">{{t.dur}}</span></button>
</sc-for>
</sc-if>

<sc-if value="{{isAlbum}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 32px; align-items: flex-end; padding-bottom: 24px">
<span style="display: block; width: 260px; height: 260px; border-radius: 14px; background: {{album.bg}}; box-shadow: 0 10px 28px rgba(0,0,0,.3); flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 34px; font-weight: 800">{{album.title}}</span><span style="font-size: 22px; color: #ff2d55; font-weight: 600">{{album.artist}}</span><span style="font-size: 14px; color: {{c.sub}}">{{album.meta}}</span>
<span style="display: flex; gap: 10px; padding-top: 14px">
<button onClick="{{playAlbum}}" style="all: unset; cursor: pointer; height: 44px; padding: 0 28px; border-radius: 22px; background: #ff2d55; color: #fff; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg>Lecture</button>
<button onClick="{{shuffleAlbum}}" style="all: unset; cursor: pointer; height: 44px; padding: 0 28px; border-radius: 22px; background: {{c.fill}}; color: #ff2d55; font-size: 17px; font-weight: 700; display: flex; align-items: center">Aléatoire</button>
</span></span>
</div>
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.go}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 16px; width: 100%; box-sizing: border-box; height: 52px; border-bottom: 1px solid {{c.sep}}"><span style="width: 28px; text-align: center; font-size: 16px; color: {{t.numColor}}">{{t.n}}</span><span style="flex-grow: 1; font-size: 17px; font-weight: 500; color: {{t.color}}">{{t.title}}</span><span style="font-size: 15px; color: {{c.sub}}">{{t.dur}}</span></button>
</sc-for>
</sc-if>
</div>

<sc-if value="{{hasPlayer}}" hint-placeholder-val="{{true}}">
<div class="{{c.glass}}" style="position: absolute; left: 50%; bottom: 22px; margin-left: -330px; width: 660px; height: 68px; border-radius: 34px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 10px; box-sizing: border-box; z-index: 5">
<button onClick="{{openFull}}" aria-label="Ouvrir le lecteur" style="all: unset; cursor: pointer; flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 12px"><span style="width: 48px; height: 48px; border-radius: 24px; background: {{pl.bg}}; flex-shrink: 0"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{pl.title}}</span><span style="font-size: 13px; color: {{c.sub}}">{{pl.artist}}</span></span></button>
<button onClick="{{toggle}}" aria-label="{{pl.playLabel}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="{{pl.playIcon}}"/></svg></button>
<button onClick="{{next}}" aria-label="Suivant" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round"><path d="M5 5l10 7-10 7zM18 5v14"/></svg></button>
</div>
</sc-if>

<div style="position: absolute; inset: 0; z-index: 20; background: {{pl.full}}; color: #fff; display: flex; flex-direction: column; transition: transform .4s, opacity .3s; transform: translateY({{fullY}}); opacity: {{fullOp}}; pointer-events: {{fullPe}}">
<div style="display: flex; justify-content: center; padding-top: 18px"><button onClick="{{closeFull}}" aria-label="Fermer le lecteur" style="all: unset; cursor: pointer; width: 60px; height: 28px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="34" height="14" viewBox="0 0 34 14" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l13 8 13-8"/></svg></button></div>
<div style="flex-grow: 1; display: flex; gap: 40px; padding: 10px 56px 40px; min-height: 0">
<div style="width: 480px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; justify-content: center">
<span style="display: block; width: 440px; height: 440px; border-radius: 18px; background: {{pl.bg}}; box-shadow: 0 24px 60px rgba(0,0,0,.45); align-self: center"></span>
<span style="display: flex; flex-direction: column; padding-top: 8px"><span style="font-size: 26px; font-weight: 800">{{pl.title}}</span><span style="font-size: 19px; opacity: .75">{{pl.artist}}</span></span>
<input type="range" aria-label="Progression" min="0" max="{{pl.dur}}" value="{{pl.pos}}" onInput="{{onSeek}}" style="width: 100%; accent-color: #ffffff; margin: 0; opacity: {{pl.seekOp}}">
<span style="display: flex; justify-content: space-between; font-size: 13px; opacity: .7"><span>{{pl.posLabel}}</span><span>{{pl.durLabel}}</span></span>
<span style="display: flex; justify-content: center; align-items: center; gap: 30px">
<button onClick="{{prev}}" aria-label="Précédent" style="all: unset; cursor: pointer; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.500" stroke-linejoin="round"><path d="M19 5L9 12l10 7zM6 5v14"/></svg></button>
<button onClick="{{toggle}}" aria-label="{{pl.playLabel}}" style="all: unset; cursor: pointer; width: 72px; height: 72px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="52" height="52" viewBox="0 0 24 24" fill="#fff"><path d="{{pl.playIcon}}"/></svg></button>
<button onClick="{{next}}" aria-label="Suivant" style="all: unset; cursor: pointer; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.500" stroke-linejoin="round"><path d="M5 5l10 7-10 7zM18 5v14"/></svg></button>
</span>
<span style="display: flex; align-items: center; gap: 12px; opacity: .85"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/></svg><input type="range" aria-label="Volume" min="0" max="100" value="{{vol}}" onInput="{{onVol}}" style="flex-grow: 1; accent-color: #ffffff; margin: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.500 6a8 8 0 0 1 0 12"/></svg></span>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 60px 0; display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{lyrics}}" as="l" hint-placeholder-count="8"><span style="font-size: 34px; font-weight: 800; line-height: 1.2; opacity: {{l.op}}; transition: opacity .4s">{{l.t}}</span></sc-for>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1348,"height":1019}}'>
