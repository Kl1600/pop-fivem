<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fichiers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; display: flex; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: {{c.cell}}; color: {{c.fg}}; overflow: hidden; position: relative">

<nav aria-label="Fichiers" style="width: 300px; flex-shrink: 0; height: 100%; box-sizing: border-box; background: {{c.side}}; border-right: 1px solid {{c.sep}}; padding: 46px 14px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 34px; font-weight: 700; padding: 0 10px 10px">Fichiers</span>
<sc-for list="{{side}}" as="g" hint-placeholder-count="4">
<span style="font-size: 13px; font-weight: 600; color: {{c.sub}}; padding: 14px 10px 4px; text-transform: uppercase">{{g.head}}</span>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<button onClick="{{it.go}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 10px; border-radius: 10px; background: {{it.bg}}; color: {{it.fg}}">
<sc-if value="{{it.isTag}}" hint-placeholder-val="{{false}}"><span style="width: 14px; height: 14px; border-radius: 50%; background: {{it.color}}; margin: 0 4px"></span></sc-if>
<sc-if value="{{it.isIcon}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{it.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d}}"/></svg></sc-if>
<span style="font-size: 17px">{{it.name}}</span>
</button>
</sc-for>
</sc-for>
</nav>

<main style="flex-grow: 1; min-width: 0; height: 100%; display: flex; flex-direction: column">
<div style="flex-shrink: 0; padding: 40px 24px 10px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 34px; font-weight: 700; flex-grow: 1">{{title}}</span>
<label class="{{c.glass}}" style="height: 40px; width: 230px; border-radius: 20px; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box; color: {{c.sub}}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input aria-label="Rechercher" placeholder="Rechercher" value="{{query}}" onInput="{{onQuery}}" style="all: unset; flex-grow: 1; font-size: 16px; color: {{c.fg}}">
</label>
<div class="{{c.glass}}" style="display: flex; padding: 3px; border-radius: 20px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button onClick="{{m.go}}" aria-label="{{m.label}}" style="all: unset; cursor: pointer; width: 42px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; background: {{m.bg}}; color: {{m.fg}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="{{m.d}}"/></svg></button></sc-for>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 36px">
<span class="{{c.glass}}" style="display: flex; align-items: center; height: 34px; border-radius: 17px; padding: 0 6px; font-size: 15px">
<sc-for list="{{crumbs}}" as="b" hint-placeholder-count="2"><button onClick="{{b.go}}" style="all: unset; cursor: pointer; padding: 0 8px; font-weight: {{b.weight}}; color: {{b.fg}}">{{b.name}}<span style="color: {{c.sub}}; padding-left: 8px">{{b.sep}}</span></button></sc-for>
</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 15px; color: {{c.sub}}">Trier par
<sc-for list="{{sorts}}" as="so" hint-placeholder-count="4"><button onClick="{{so.go}}" style="all: unset; cursor: pointer; padding: 5px 12px; border-radius: 15px; font-weight: 600; background: {{so.bg}}; color: {{so.fg}}">{{so.name}}</button></sc-for>
</span>
</div>
</div>

<div style="flex-grow: 1; overflow-y: auto; padding: 8px 24px 30px">
<sc-if value="{{isIcons}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px 12px">
<sc-for list="{{items}}" as="f" hint-placeholder-count="8">
<button onClick="{{f.go}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 14px; background: {{f.bg}}">
<sc-if value="{{f.isFolder}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="120" height="96" viewBox="0 0 120 96"><path d="M6 20a8 8 0 0 1 8-8h28l10 11h54a8 8 0 0 1 8 8v47a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z" fill="#1a8cff"/><rect x="6" y="30" width="108" height="56" rx="8" fill="#52aaff"/></svg></sc-if>
<sc-if value="{{f.isImg}}" hint-placeholder-val="{{false}}"><span style="width: 120px; height: 96px; border-radius: 8px; background: {{f.grad}}; box-shadow: 0 2px 8px rgba(0,0,0,.25)"></span></sc-if>
<sc-if value="{{f.isDoc}}" hint-placeholder-val="{{true}}"><span style="width: 76px; height: 96px; border-radius: 6px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: center"><span style="position: absolute; left: 8px; right: 8px; top: 12px; height: 38px; background: repeating-linear-gradient(#d1d1d6 0 3px, transparent 3px 9px)"></span><span style="width: 100%; background: {{f.color}}; color: #fff; font-size: 12px; font-weight: 800; text-align: center; padding: 4px 0">{{f.ext}}</span></span></sc-if>
<span style="font-size: 15px; font-weight: 500; text-align: center; max-width: 140px; line-height: 1.2; display: flex; align-items: center; gap: 4px"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{f.tagColor}}; flex-shrink: 0"></span>{{f.name}}</span>
<span style="font-size: 13px; color: {{c.sub}}">{{f.info}}</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isList}}" hint-placeholder-val="{{false}}">
<div style="display: flex; padding: 6px 12px; font-size: 13px; color: {{c.sub}}; border-bottom: 1px solid {{c.sep}}"><span style="flex-grow: 1">Nom</span><span style="width: 160px">Date</span><span style="width: 100px">Taille</span><span style="width: 100px">Type</span></div>
<sc-for list="{{items}}" as="f" hint-placeholder-count="8">
<button onClick="{{f.go}}" style="all: unset; cursor: pointer; display: flex; align-items: center; width: 100%; box-sizing: border-box; padding: 6px 12px; height: 52px; border-bottom: 1px solid {{c.sep}}; background: {{f.bg}}">
<span style="flex-grow: 1; display: flex; align-items: center; gap: 12px; min-width: 0">
<sc-if value="{{f.isFolder}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="34" height="28" viewBox="0 0 120 96"><path d="M6 20a8 8 0 0 1 8-8h28l10 11h54a8 8 0 0 1 8 8v47a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z" fill="#1a8cff"/><rect x="6" y="30" width="108" height="56" rx="8" fill="#52aaff"/></svg></sc-if>
<sc-if value="{{f.isImg}}" hint-placeholder-val="{{false}}"><span style="width: 34px; height: 28px; border-radius: 4px; background: {{f.grad}}"></span></sc-if>
<sc-if value="{{f.isDoc}}" hint-placeholder-val="{{true}}"><span style="width: 24px; height: 32px; border-radius: 3px; background: #fff; border: 1px solid {{c.sep}}; border-top: 8px solid {{f.color}}; margin: 0 5px; box-sizing: border-box"></span></sc-if>
<span style="font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span><span style="width: 10px; height: 10px; border-radius: 50%; background: {{f.tagColor}}; flex-shrink: 0"></span>
</span>
<span style="width: 160px; font-size: 15px; color: {{c.sub}}">{{f.date}}</span><span style="width: 100px; font-size: 15px; color: {{c.sub}}">{{f.size}}</span><span style="width: 100px; font-size: 15px; color: {{c.sub}}">{{f.kind}}</span>
</button>
</sc-for>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><span style="display: block; text-align: center; padding: 120px 0; font-size: 18px; color: {{c.sub}}">Aucun élément.</span></sc-if>
</div>
<div style="flex-shrink: 0; text-align: center; font-size: 13px; color: {{c.sub}}; padding: 8px; border-top: 1px solid {{c.sep}}">{{count}} éléments · 41 Go disponibles</div>
</main>

<sc-if value="{{pv.on}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: {{c.pvBg}}; display: flex; flex-direction: column; align-items: center">
<div class="{{c.glass}}" style="margin-top: 30px; width: 1180px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; box-sizing: border-box">
<button onClick="{{closePv}}" style="all: unset; cursor: pointer; font-size: 17px; font-weight: 600; color: #0088ff">‹ OK</button>
<span style="font-size: 16px; font-weight: 600">{{pv.name}}</span>
<button onClick="{{sharePv}}" aria-label="Partager" style="all: unset; cursor: pointer; color: #0088ff"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 12v8h14v-8"/></svg></button>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px">
<sc-if value="{{pv.isImg}}" hint-placeholder-val="{{false}}"><span style="width: 820px; height: 620px; border-radius: 10px; background: {{pv.grad}}"></span></sc-if>
<sc-if value="{{pv.isDoc}}" hint-placeholder-val="{{true}}">
<div style="width: 640px; height: 800px; background: #fff; color: #1c1c1e; border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.35); padding: 52px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<span style="font-size: 12px; font-weight: 700; color: #1a3fb8">POLICE DE LOS SANTOS · MISSION ROW</span>
<span style="font-size: 26px; font-weight: 800">{{pv.heading}}</span>
<sc-for list="{{pv.lines}}" as="ln" hint-placeholder-count="6"><span style="font-size: 14px; line-height: 1.5; color: #3a3a3c">{{ln}}</span></sc-for>
<span style="height: 90px; border-radius: 6px; background: repeating-linear-gradient(90deg, #e3e3e8 0 1px, transparent 1px 80px), repeating-linear-gradient(#e3e3e8 0 1px, transparent 1px 30px); border: 1px solid #e3e3e8"></span>
<span style="font-size: 12px; color: #8e8e93; margin-top: auto">{{pv.info}}</span>
</div>
</sc-if>
</div>
<sc-if value="{{pv.toast}}" hint-placeholder-val="{{false}}"><span class="{{c.glass}}" style="position: absolute; bottom: 40px; padding: 10px 20px; border-radius: 20px; font-size: 15px">Lien de partage copié</span></sc-if>
</div>
</sc-if>
</div>
</x-dc>
