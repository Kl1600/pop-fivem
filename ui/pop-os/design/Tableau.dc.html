<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tableau</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: {{c.canvas}}; color: {{c.fg}}">

<div onPointerDown="{{bgDown}}" onPointerMove="{{move}}" onPointerUp="{{up}}" style="position: absolute; left: 0; top: 0; width: 1348px; height: 1019px; background-image: radial-gradient(circle, {{c.dot}} 1.4px, transparent 1.6px); background-size: 26px 26px; touch-action: none">
<svg aria-hidden="true" width="1348" height="1019" viewBox="0 0 1348 1019" style="position: absolute; left: 0; top: 0; pointer-events: none">
<sc-for list="{{arrows}}" as="a" hint-placeholder-count="2">
<line x1="{{a.x1}}" y1="{{a.y1}}" x2="{{a.x2}}" y2="{{a.y2}}" stroke="{{a.hit}}" stroke-width="18" stroke-linecap="round" style="pointer-events: stroke; cursor: move" onPointerDown="{{a.down}}"></line>
<line x1="{{a.x1}}" y1="{{a.y1}}" x2="{{a.x2}}" y2="{{a.y2}}" stroke="{{a.main}}" stroke-width="4" stroke-linecap="round"></line>
<polygon points="{{a.head}}" fill="{{a.main}}"></polygon>
</sc-for>
</svg>
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<div onPointerDown="{{it.down}}" style="position: absolute; left: {{it.x}}px; top: {{it.y}}px; width: {{it.w}}px; height: {{it.h}}px; outline: {{it.ring}}; outline-offset: 3px; border-radius: {{it.radius}}; cursor: {{it.cursor}}">
<sc-if value="{{it.isNote}}" hint-placeholder-val="{{true}}">
<div style="width: 100%; height: 100%; border-radius: 4px 4px 18px 4px; background: {{it.soft}}; box-shadow: 0 10px 22px rgba(0,0,0,.22); display: flex; flex-direction: column; overflow: hidden">
<div style="height: 22px; flex-shrink: 0; background: {{it.main}}; opacity: .55"></div>
<textarea aria-label="Texte du post-it" placeholder="Écrire…" onInput="{{it.input}}" style="all: unset; flex-grow: 1; padding: 10px 14px; font-size: 19px; line-height: 1.3; font-weight: 600; color: #1c1c1e; white-space: pre-wrap">{{it.text}}</textarea>
</div>
</sc-if>
<sc-if value="{{it.isShape}}" hint-placeholder-val="{{false}}">
<div style="width: 100%; height: 100%; box-sizing: border-box; border-radius: {{it.radius}}; background: {{it.tint}}; border: 3px solid {{it.main}}; display: flex; align-items: center; justify-content: center">
<input aria-label="Texte de la forme" placeholder="Texte" value="{{it.text}}" onInput="{{it.input}}" style="all: unset; width: 80%; text-align: center; font-size: 18px; font-weight: 700; color: {{c.fg}}">
</div>
</sc-if>
<sc-if value="{{it.isText}}" hint-placeholder-val="{{false}}">
<input aria-label="Texte libre" value="{{it.text}}" onInput="{{it.input}}" style="all: unset; width: 100%; font-size: {{it.fs}}px; font-weight: 800; color: {{c.fg}}">
</sc-if>
<sc-if value="{{it.isImage}}" hint-placeholder-val="{{false}}">
<div style="width: 100%; height: 100%; border-radius: 12px; background: linear-gradient(160deg,#ffae3d,#b8326f 60%,#2b1a5e); box-shadow: 0 10px 22px rgba(0,0,0,.25); display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; color: #fff; font-size: 14px; font-weight: 600">{{it.text}}</div>
</sc-if>
</div>
</sc-for>
<svg aria-label="Dessin" width="1348" height="1019" viewBox="0 0 1348 1019" onPointerDown="{{down}}" style="position: absolute; left: 0; top: 0; pointer-events: {{overlayEvents}}; cursor: crosshair">
<sc-for list="{{strokes}}" as="st" hint-placeholder-count="2">
<polyline points="{{st.pts}}" fill="none" stroke="{{st.main}}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline>
</sc-for>
</svg>
</div>

<button onClick="{{toggleBoards}}" aria-label="Liste des tableaux" class="{{c.glass}}" style="all: unset; cursor: pointer; position: absolute; left: 24px; top: 24px; height: 48px; padding: 0 18px; border-radius: 24px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: {{c.fg}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0088ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>{{boardName}}</button>

<div class="{{c.glass}}" style="position: absolute; left: 50%; top: 24px; transform: translateX(-50%); height: 56px; border-radius: 28px; display: flex; align-items: center; gap: 4px; padding: 0 10px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="6">
<button onClick="{{t.go}}" aria-label="{{t.label}}" style="all: unset; cursor: pointer; width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; background: {{t.bg}}; color: {{t.fg}}; transition: background .2s"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"/></svg></button>
</sc-for>
<button onClick="{{toggleColors}}" aria-label="Couleur" style="all: unset; cursor: pointer; width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 13px; background: {{curColor}}; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 0 0 1.5px {{c.sep}}"></span></button>
</div>

<div style="position: absolute; right: 24px; top: 24px; display: flex; gap: 10px">
<sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}"><button onClick="{{delSel}}" aria-label="Supprimer la sélection" class="{{c.glass}}" style="all: unset; cursor: pointer; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #ff383c"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button></sc-if>
<button onClick="{{undo}}" aria-label="Annuler" class="{{c.glass}}" style="all: unset; cursor: pointer; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: {{c.fg}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 8"/></svg></button>
</div>

<sc-if value="{{showShapes}}" hint-placeholder-val="{{false}}">
<div class="{{c.glass}}" style="position: absolute; left: 50%; top: 94px; transform: translateX(-50%); height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 4px; padding: 0 10px">
<sc-for list="{{shapes}}" as="sh" hint-placeholder-count="3">
<button onClick="{{sh.go}}" aria-label="{{sh.label}}" style="all: unset; cursor: pointer; width: 42px; height: 42px; border-radius: 21px; display: flex; align-items: center; justify-content: center; background: {{sh.bg}}; color: {{sh.fg}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{sh.d}}"/></svg></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{showColors}}" hint-placeholder-val="{{false}}">
<div class="{{c.glass}}" style="position: absolute; left: 50%; top: 94px; margin-left: 40px; height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 8px; padding: 0 14px">
<sc-for list="{{palette}}" as="p" hint-placeholder-count="6">
<button onClick="{{p.go}}" aria-label="{{p.label}}" style="all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 15px; background: {{p.main}}; box-shadow: 0 0 0 3px {{p.ring}}; transition: box-shadow .2s"></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{showBoards}}" hint-placeholder-val="{{false}}">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px"><span style="font-size: 24px; font-weight: 700">Tableaux</span>
<button onClick="{{newBoard}}" aria-label="Nouveau tableau" style="all: unset; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 18px; background: #0088ff; color: #fff; font-size: 15px; font-weight: 600; display: flex; align-items: center">+ Nouveau</button></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
<sc-for list="{{thumbs}}" as="b" hint-placeholder-count="3">
<button onClick="{{b.pick}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px">
<svg aria-hidden="true" width="226" height="171" viewBox="0 0 1348 1019" style="border-radius: 14px; background: {{c.canvas}}; outline: {{b.ring}}; outline-offset: 2px; box-shadow: 0 2px 8px rgba(0,0,0,.15)">
<sc-for list="{{b.rects}}" as="r" hint-placeholder-count="3"><rect x="{{r.x}}" y="{{r.y}}" width="{{r.w}}" height="{{r.h}}" rx="{{r.r}}" fill="{{r.fill}}"></rect></sc-for>
<sc-for list="{{b.lines}}" as="l" hint-placeholder-count="1"><polyline points="{{l.pts}}" fill="none" stroke="{{l.main}}" stroke-width="10" stroke-linecap="round"></polyline></sc-for>
</svg>
<span style="font-size: 15px; font-weight: 600; color: {{c.fg}}; padding: 0 4px">{{b.name}}</span>
<span style="font-size: 13px; color: {{c.sub}}; padding: 0 4px">{{b.date}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
</div>
</x-dc>

newBoard: () => { const id = s.nid; this.setState({ boards: s.boards.concat([{ id, name: 'Tableau ' + (s.boards.length + 1), date: 'À l’instant', items: [], strokes: [] }]), cur: s.boards.length, nid: id + 1, showBoards: false, sel: null }); }
};
}
}
</script>
