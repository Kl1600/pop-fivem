<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Contacts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; display: flex; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: {{c.bg}}; color: {{c.fg}}; overflow: hidden; position: relative">

<nav aria-label="Liste des contacts" style="width: 430px; flex-shrink: 0; height: 100%; box-sizing: border-box; background: {{c.side}}; border-right: 1px solid {{c.sep}}; display: flex; flex-direction: column; position: relative">
<div style="padding: 46px 18px 8px; display: flex; flex-direction: column; gap: 12px">
<span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 34px; font-weight: 700">Contacts</span>
<button onClick="{{addContact}}" aria-label="Nouveau contact" class="{{c.glass}}" style="box-sizing: border-box; padding: 0; font: inherit; outline: none; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #0088ff"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></span>
<label style="height: 40px; border-radius: 20px; background: {{c.fill}}; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: {{c.sub}}">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input aria-label="Rechercher" placeholder="Rechercher" value="{{query}}" onInput="{{onQuery}}" style="all: unset; flex-grow: 1; font-size: 17px; color: {{c.fg}}">
</label>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5"><button onClick="{{g.go}}" style="all: unset; cursor: pointer; height: 32px; padding: 0 14px; border-radius: 16px; font-size: 15px; font-weight: 600; background: {{g.bg}}; color: {{g.fg}}; display: flex; align-items: center; transition: background .2s">{{g.name}}</button></sc-for>
</div>
</div>
<div id="ctc-scroll" style="flex-grow: 1; overflow-y: auto; padding: 4px 40px 24px 14px">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
<span id="{{sec.id}}" style="display: block; font-size: 15px; font-weight: 700; color: {{c.sub}}; padding: 12px 8px 6px">{{sec.letter}}</span>
<div style="border-radius: 14px; background: {{c.cell}}; overflow: hidden">
<sc-for list="{{sec.items}}" as="p" hint-placeholder-count="3">
<button onClick="{{p.pick}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 9px 14px; background: {{p.bg}}; color: {{p.fg}}">
<span style="width: 40px; height: 40px; border-radius: 20px; background: {{p.grad}}; color: #fff; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{p.ini}}</span>
<span style="font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><b style="font-weight: 700">{{p.first}}</b> {{p.rest}}</span>
</button>
</sc-for>
</div>
</sc-for>
<sc-if value="{{noRows}}" hint-placeholder-val="{{false}}"><span style="display: block; text-align: center; padding: 60px 10px; color: {{c.sub}}; font-size: 16px">Aucun contact.</span></sc-if>
</div>
<div style="position: absolute; right: 8px; top: 230px; bottom: 30px; width: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center">
<sc-for list="{{index}}" as="l" hint-placeholder-count="12"><button onClick="{{l.go}}" aria-label="{{l.label}}" style="all: unset; cursor: pointer; font-size: 11px; font-weight: 700; line-height: 1; padding: 2.500px 6px; color: {{l.color}}">{{l.l}}</button></sc-for>
</div>
</nav>

<main style="flex-grow: 1; min-width: 0; height: 100%; position: relative; display: flex; flex-direction: column; background: {{c.cell}}">
<sc-if value="{{hasCur}}" hint-placeholder-val="{{true}}">
<div style="height: 76px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; padding: 0 22px 8px">
<sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><button onClick="{{del}}" style="all: unset; cursor: pointer; height: 40px; padding: 0 16px; border-radius: 20px; font-size: 16px; font-weight: 600; color: #ff383c; display: flex; align-items: center">Supprimer</button></sc-if>
<button onClick="{{toggleEdit}}" class="{{c.glass}}" style="box-sizing: border-box; padding: 0 20px; font: inherit; outline: none; cursor: pointer; height: 40px; border-radius: 20px; font-size: 16px; font-weight: 600; color: #0088ff">{{editLabel}}</button>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 0 70px 40px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 22px">
<span style="width: 150px; height: 150px; border-radius: 75px; background: {{cur.grad}}; color: #fff; font-size: 54px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{cur.ini}}</span>
<span style="font-size: 34px; font-weight: 700; padding-top: 10px">{{cur.name}}</span>
<span style="font-size: 17px; color: {{c.sub}}">{{cur.groupName}}</span>
</div>
<sc-if value="{{viewing}}" hint-placeholder-val="{{true}}">
<div style="display: flex; justify-content: center; gap: 22px; padding-bottom: 26px">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
<span style="display: flex; flex-direction: column; align-items: center; gap: 8px"><button onClick="{{a.go}}" aria-label="{{a.label}}" style="all: unset; cursor: pointer; width: 64px; height: 64px; border-radius: 32px; background: {{c.fill}}; color: #0088ff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.d}}"/></svg></button><span style="font-size: 13px; color: #0088ff">{{a.label}}</span></span>
</sc-for>
</div>
<div style="border-radius: 14px; background: {{c.bg}}; overflow: hidden">
<sc-for list="{{info}}" as="r" hint-placeholder-count="4">
<div style="padding: 11px 18px; border-bottom: 1px solid {{r.line}}; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: {{c.sub}}">{{r.label}}</span><span style="font-size: 17px; color: {{r.color}}; white-space: pre-wrap">{{r.value}}</span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
<div style="border-radius: 14px; background: {{c.bg}}; overflow: hidden">
<sc-for list="{{fields}}" as="fl" hint-placeholder-count="6">
<label style="display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 50px; border-bottom: 1px solid {{fl.line}}"><span style="width: 110px; font-size: 16px; color: {{c.sub}}">{{fl.label}}</span><input aria-label="{{fl.label}}" value="{{fl.value}}" onInput="{{fl.input}}" style="all: unset; flex-grow: 1; font-size: 17px; color: {{c.fg}}"></label>
</sc-for>
</div>
<span style="display: block; font-size: 13px; color: {{c.sub}}; padding: 14px 18px 6px">Groupe</span>
<div style="display: flex; gap: 8px; padding: 0 18px">
<sc-for list="{{groupPick}}" as="g" hint-placeholder-count="4"><button onClick="{{g.go}}" style="all: unset; cursor: pointer; height: 34px; padding: 0 16px; border-radius: 17px; font-size: 15px; font-weight: 600; background: {{g.bg}}; color: {{g.fg}}; display: flex; align-items: center">{{g.name}}</button></sc-for>
</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{noCur}}" hint-placeholder-val="{{false}}"><div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; color: {{c.sub}}; font-size: 20px">Aucun contact sélectionné</div></sc-if>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div class="{{c.glass}}" style="position: absolute; top: 24px; left: 50%; margin-left: -150px; width: 300px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; z-index: 8">{{toast}}</div></sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1348,"height":1019}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const P = (id, first, last, num, mail, addr, notes, group, g) => ({ id, first, last, num, mail, addr, notes, group, g });
const contacts = [
P(1, 'Lina', 'Costa', '555-0187', 'lina.costa@pop.ls', '12 Vinewood Boulevard, Vinewood', 'Commerçante, témoin du fourgon blanc.', 'ami', ['#ff8d28', '#ff2d55']),
P(2, 'Sam', 'Leroy', '555-0123', 'sam.leroy@lspd.gov', 'Mission Row, Los Santos', 'Coéquipier, patrouilles de nuit.', 'lspd', ['#34c759', '#00c0e8']),
P(3, 'Noah', 'Petit', '555-0166', 'noah.petit@pop.ls', '48 Del Perro Pier, Del Perro', 'Agent immobilier à ses heures.', 'ami', ['#0088ff', '#cb30e0']),
P(4, 'Jade', 'Moreau', '555-0109', 'jade.moreau@pop.ls', '3 Route 68, Sandy Shores', '', 'lspd', ['#cb30e0', '#ff2d55']),
P(5, 'Eli', 'Garcia', '555-0150', '', '7 Rue de la Plage, Paleto Bay', 'Pêche le dimanche.', 'famille', ['#ffcc00', '#ff8d28']),
P(6, 'Garage', 'Del Perro', '555-0199', 'contact@pop.ls', '21 Del Perro Pier, Del Perro', 'Ouvert de 8h à 19h.', 'travail', ['#8e8e93', '#48484a']),
P(7, 'Commissariat', 'Mission Row', '555-0911', 'accueil@lspd.gov', 'Mission Row, Los Santos', '', 'lspd', ['#0088ff', '#00c0e8']),
P(8, 'Maze', 'Bank', '555-0300', 'support@mazebank.ls', 'Tower Maze Bank, Pillbox Hill', 'Service client.', 'travail', ['#ff383c', '#ff8d28'])
];
this.state = { dark: !!props.dark, contacts, sel: 1, query: '', group: 'all', edit: false, toast: '', nid: 11 };
}
componentDidUpdate(prev) { if (prev.dark !== this.props.dark) this.setState({ dark: !!this.props.dark }); }
upd(id, fn) { this.setState({ contacts: this.state.contacts.map((x) => (x.id === id ? fn(x) : x)) }); }
renderVals() {
const s = this.state; const dark = s.dark;
const c = dark
? { bg: '#000000', side: '#000000', cell: '#1c1c1e', fg: '#ffffff', sub: 'rgba(235,235,245,.6)', sep: 'rgba(84,84,88,.6)', fill: '#2c2c2e', glass: 'glass dk' }
: { bg: '#f2f2f7', side: '#f2f2f7', cell: '#ffffff', fg: '#000000', sub: 'rgba(60,60,67,.6)', sep: 'rgba(60,60,67,.18)', fill: '#e3e3e8', glass: 'glass' };
const gdef = [['all', 'Tous'], ['famille', 'Famille'], ['travail', 'Travail'], ['lspd', 'LSPD'], ['ami', 'Amis']];
const gname = (k) => (gdef.find((g) => g[0] === k) || ['', 'Aucun groupe'])[1];
const full = (x) => (x.first + ' ' + x.last).trim() || 'Sans nom';
const key = (x) => (x.last || x.first || '#').toUpperCase();
const letterOf = (x) => { const l = key(x)[0]; return /[A-Z]/.test(l) ? l : '#'; };
const ini = (x) => ((x.first[0] || '') + (x.last[0] || '')).toUpperCase() || '?';
const grad = (x) => 'linear-gradient(160deg,' + x.g[0] + ',' + x.g[1] + ')';
const q = s.query.trim().toLowerCase();
const vis = s.contacts.filter((x) => (s.group === 'all' || x.group === s.group) && (!q || (full(x) + x.num).toLowerCase().indexOf(q) >= 0)).sort((a, b) => key(a).localeCompare(key(b)));
const sections = [];
vis.forEach((x) => {
const l = letterOf(x); let sec = sections.find((z) => z.letter === l);
if (!sec) { sec = { letter: l, id: 'ctc-' + l, items: [] }; sections.push(sec); }
const on = s.sel === x.id;
sec.items.push({ first: x.last ? x.first : '', rest: x.last ? x.last : x.first || 'Sans nom', ini: ini(x), grad: grad(x), bg: on ? '#0088ff' : 'transparent', fg: on ? '#fff' : c.fg, pick: () => this.setState({ sel: x.id, edit: false }) });
});
const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
const index = letters.map((l) => ({ l, label: 'Lettre ' + l, color: sections.find((z) => z.letter === l) ? '#0088ff' : c.sub, go: () => { const el = document.getElementById('ctc-' + l); if (el) el.scrollIntoView({ block: 'start' }); } }));
const cur = s.contacts.find((x) => x.id === s.sel);
const flash = (t) => { this.setState({ toast: t }); setTimeout(() => this.setState({ toast: '' }), 1800); };
const info = cur ? [['Téléphone', cur.num, '#0088ff'], ['Mail', cur.mail, '#0088ff'], ['Adresse', cur.addr, c.fg], ['Notes', cur.notes, c.fg]].filter((r) => r[1]).map((r, i, a) => ({ label: r[0], value: r[1], color: r[2], line: i < a.length - 1 ? c.sep : 'transparent' })) : [];
const set = (k) => (e) => this.upd(cur.id, (x) => ({ ...x, [k]: e.target.value }));
const fl = cur ? [['Prénom', 'first'], ['Nom', 'last'], ['Téléphone', 'num'], ['Mail', 'mail'], ['Adresse', 'addr'], ['Notes', 'notes']].map((f, i, a) => ({ label: f[0], value: cur[f[1]], input: set(f[1]), line: i < a.length - 1 ? c.sep : 'transparent' })) : [];
const actions = cur ? [
{ label: 'message', d: 'M4 5h16v11H9l-5 4z', go: () => flash('Message à ' + full(cur)) },
{ label: 'appeler', d: 'M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2', go: () => flash('Appel de ' + full(cur) + '…') },
{ label: 'mail', d: 'M3 6h18v12H3zM3 7l9 7 9-7', go: () => flash('Mail à ' + (cur.mail || full(cur))) }
] : [];
return {
c, dark, groups: gdef.map((g) => ({ name: g[1], bg: s.group === g[0] ? '#0088ff' : c.fill, fg: s.group === g[0] ? '#fff' : c.fg, go: () => this.setState({ group: g[0] }) })),
sections, noRows: !vis.length, index, query: s.query, onQuery: (e) => this.setState({ query: e.target.value }),
hasCur: !!cur, noCur: !cur, cur: cur ? { name: full(cur), ini: ini(cur), grad: grad(cur), groupName: gname(cur.group) } : {},
editing: s.edit, viewing: !s.edit, editLabel: s.edit ? 'OK' : 'Modifier', toggleEdit: () => this.setState({ edit: !s.edit }),
info, fields: fl, actions, toast: s.toast,
groupPick: gdef.slice(1).map((g) => ({ name: g[1], bg: cur && cur.group === g[0] ? '#0088ff' : c.fill, fg: cur && cur.group === g[0] ? '#fff' : c.fg, go: () => this.upd(cur.id, (x) => ({ ...x, group: g[0] })) })),
addContact: () => this.setState({ contacts: s.contacts.concat([{ id: s.nid, first: '', last: '', num: '', mail: '', addr: '', notes: '', group: 'ami', g: ['#8e8e93', '#48484a'] }]), sel: s.nid, nid: s.nid + 1, edit: true, group: 'all', query: '' }),
del: () => { const rest = s.contacts.filter((x) => x.id !== cur.id); this.setState({ contacts: rest, sel: rest.length ? rest[0].id : null, edit: false }); }
};
}
}
</script>
</body>
</html>
