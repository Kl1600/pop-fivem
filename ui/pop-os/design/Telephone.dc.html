<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Téléphone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
.callglass{background:rgba(255,255,255,.18);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; display: flex; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: {{c.bg}}; color: {{c.fg}}; overflow: hidden; position: relative">

<nav aria-label="Téléphone" style="width: 300px; flex-shrink: 0; height: 100%; box-sizing: border-box; background: {{c.side}}; border-right: 1px solid {{c.sep}}; padding: 46px 14px 20px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 34px; font-weight: 700; padding: 0 10px 12px">Téléphone</span>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.go}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 10px; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"/></svg>
<span style="flex-grow: 1; font-size: 17px">{{t.name}}</span>
<span style="min-width: 22px; height: 22px; border-radius: 11px; background: #ff383c; color: #fff; font-size: 13px; font-weight: 700; display: {{t.badge}}; align-items: center; justify-content: center">{{t.n}}</span>
</button>
</sc-for>
<span style="flex-grow: 1"></span>
<button onClick="{{simIncoming}}" style="all: unset; cursor: pointer; font-size: 14px; color: {{c.sub}}; padding: 10px; text-align: center">Simuler un appel entrant</button>
</nav>

<main style="flex-grow: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; position: relative">
<div style="padding: 46px 40px 10px; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 34px; font-weight: 700">{{title}}</span>
<sc-if value="{{isRecents}}" hint-placeholder-val="{{false}}">
<span class="{{c.glass}}" style="display: flex; padding: 3px; border-radius: 20px; gap: 2px">
<sc-for list="{{seg}}" as="g" hint-placeholder-count="2"><button onClick="{{g.go}}" style="all: unset; cursor: pointer; height: 34px; padding: 0 18px; border-radius: 17px; font-size: 15px; font-weight: 600; background: {{g.bg}}; color: {{g.fg}}">{{g.name}}</button></sc-for>
</span>
</sc-if>
</div>

<sc-if value="{{isFavs}}" hint-placeholder-val="{{false}}">
<div style="padding: 10px 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; overflow-y: auto">
<sc-for list="{{favs}}" as="f" hint-placeholder-count="6">
<button onClick="{{f.call}}" style="all: unset; cursor: pointer; background: {{c.cell}}; border-radius: 20px; padding: 18px; display: flex; align-items: center; gap: 14px">
<span style="width: 56px; height: 56px; border-radius: 28px; background: {{f.grad}}; color: #fff; font-size: 21px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{f.ini}}</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">{{f.name}}</span><span style="font-size: 14px; color: {{c.sub}}">{{f.kind}}</span></span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
<div style="flex-grow: 1; overflow-y: auto; padding: 10px 40px 30px">
<div style="background: {{c.cell}}; border-radius: 16px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 64px; border-bottom: 1px solid {{r.line}}">
<button onClick="{{r.call}}" style="all: unset; cursor: pointer; flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 18px; font-weight: 600; color: {{r.fg}}">{{r.name}}</span>
<span style="font-size: 14px; color: {{c.sub}}; display: flex; align-items: center; gap: 5px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" style="display: {{r.arrow}}; transform: rotate({{r.rot}})"><path d="M7 17L17 7M9 7h8v8"/></svg>{{r.sub}}</span>
</button>
<span style="font-size: 15px; color: {{c.sub}}">{{r.time}}</span>
<button onClick="{{r.call}}" aria-label="Appeler" style="all: unset; cursor: pointer; width: 38px; height: 38px; border-radius: 19px; background: {{c.fill}}; color: #0088ff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button>
</div>
</sc-for>
<sc-if value="{{noRows}}" hint-placeholder-val="{{false}}"><span style="display: block; text-align: center; padding: 50px; color: {{c.sub}}">Aucun élément.</span></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{isVoice}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; overflow-y: auto; padding: 10px 40px 30px">
<div style="background: {{c.cell}}; border-radius: 16px; overflow: hidden">
<sc-for list="{{voice}}" as="v" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid {{v.line}}">
<button onClick="{{v.play}}" aria-label="Lecture" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: #0088ff; color: #fff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="{{v.icon}}"/></svg></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 18px; font-weight: 600">{{v.name}}</span><span style="height: 4px; border-radius: 2px; background: {{c.fill}}; position: relative; overflow: hidden"><span style="position: absolute; inset: 0; width: {{v.w}}; background: #0088ff; transition: width .3s"></span></span></span>
<span style="font-size: 15px; color: {{c.sub}}">{{v.dur}} · {{v.time}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{isPad}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding-top: 10px">
<span style="height: 70px; font-size: 44px; font-weight: 300; letter-spacing: 0.04em; display: flex; align-items: center">{{shown}}</span>
<div style="display: grid; grid-template-columns: repeat(3, 92px); gap: 18px 26px; margin-top: 10px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button onClick="{{k.press}}" aria-label="{{k.d}}" style="all: unset; cursor: pointer; width: 92px; height: 92px; border-radius: 46px; background: {{c.fill}}; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 36px; font-weight: 400; line-height: 1">{{k.d}}</span><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: {{c.sub}}; height: 13px">{{k.l}}</span>
</button>
</sc-for>
<span></span>
<button onClick="{{dial}}" aria-label="Appeler" style="all: unset; cursor: pointer; width: 92px; height: 92px; border-radius: 46px; background: #34c759; color: #fff; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="#fff"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button>
<button onClick="{{back}}" aria-label="Effacer" style="all: unset; cursor: pointer; width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; color: {{c.sub}}; opacity: {{backOp}}"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11v12H9l-6-6zM12 9.500l5 5M17 9.500l-5 5"/></svg></button>
</div>
</div>
</sc-if>
</main>

<sc-if value="{{inCall}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 30; background: linear-gradient(170deg,#3a4a7a,#1d2a52 55%,#0a0f26); color: #fff; display: flex; flex-direction: column; align-items: center">
<span style="width: 120px; height: 120px; border-radius: 60px; margin-top: 130px; background: {{call.grad}}; font-size: 44px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{call.ini}}</span>
<span style="font-size: 44px; font-weight: 700; margin-top: 22px">{{call.name}}</span>
<span style="font-size: 20px; opacity: .75; margin-top: 6px">{{callState}}</span>
<sc-if value="{{call.keypad}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(3, 76px); gap: 12px 22px; margin-top: 36px">
<sc-for list="{{callKeys}}" as="k" hint-placeholder-count="12"><button onClick="{{k.press}}" aria-label="{{k.d}}" class="callglass" style="box-sizing: border-box; padding: 0; font: inherit; outline: none; cursor: pointer; width: 76px; height: 76px; border-radius: 38px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff">{{k.d}}</button></sc-for>
</div>
<button onClick="{{hideKeypad}}" style="all: unset; cursor: pointer; font-size: 17px; margin-top: 18px; opacity: .85">Masquer</button>
</sc-if>
<sc-if value="{{call.noKeypad}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 34px; margin-top: 90px">
<sc-for list="{{callBtns}}" as="b" hint-placeholder-count="4">
<span style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<button onClick="{{b.go}}" aria-label="{{b.name}}" class="callglass" style="box-sizing: border-box; padding: 0; font: inherit; outline: none; cursor: pointer; width: 88px; height: 88px; border-radius: 44px; display: flex; align-items: center; justify-content: center; background: {{b.bg}}; color: {{b.fg}}; transition: background .2s"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.d}}"/></svg></button>
<span style="font-size: 15px">{{b.name}}</span></span>
</sc-for>
</div>
</sc-if>
<span style="flex-grow: 1"></span>
<button onClick="{{hangUp}}" aria-label="Raccrocher" style="all: unset; cursor: pointer; width: 88px; height: 88px; border-radius: 44px; background: #ff383c; margin-bottom: 90px; display: flex; align-items: center; justify-content: center; color: #fff"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="#fff" style="transform: rotate(135deg)"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button>
</div>
</sc-if>

<sc-if value="{{inIncoming}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; z-index: 40; background: linear-gradient(170deg,#4b3a7a,#2a1d52 55%,#0d0a26); color: #fff; display: flex; flex-direction: column; align-items: center">
<span style="font-size: 18px; opacity: .75; margin-top: 120px">Appel entrant</span>
<span style="width: 120px; height: 120px; border-radius: 60px; margin-top: 24px; background: {{inc.grad}}; font-size: 44px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{inc.ini}}</span>
<span style="font-size: 44px; font-weight: 700; margin-top: 22px">{{inc.name}}</span>
<span style="font-size: 20px; opacity: .75; margin-top: 6px">{{inc.num}}</span>
<span style="flex-grow: 1"></span>
<div style="display: flex; gap: 160px; margin-bottom: 110px">
<span style="display: flex; flex-direction: column; align-items: center; gap: 10px"><button onClick="{{refuse}}" aria-label="Refuser" style="all: unset; cursor: pointer; width: 88px; height: 88px; border-radius: 44px; background: #ff383c; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="#fff" style="transform: rotate(135deg)"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button><span style="font-size: 15px">Refuser</span></span>
<span style="display: flex; flex-direction: column; align-items: center; gap: 10px"><button onClick="{{accept}}" aria-label="Accepter" style="all: unset; cursor: pointer; width: 88px; height: 88px; border-radius: 44px; background: #34c759; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="#fff"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button><span style="font-size: 15px">Accepter</span></span>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"incoming":{"editor":"boolean","default":false},"$preview":{"width":1348,"height":1019}}'>

{ name: 'Haut-parleur', d: 'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.500 6a8 8 0 0 1 0 12', on: cl.spk, go: () => this.setState({ call: { ...cl, spk: !cl.spk } }) },
