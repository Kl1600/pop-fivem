<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Calendrier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; display: flex; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: {{c.cell}}; color: {{c.fg}}; overflow: hidden; position: relative">

<nav aria-label="Calendriers" style="width: 300px; flex-shrink: 0; height: 100%; box-sizing: border-box; background: {{c.side}}; border-right: 1px solid {{c.sep}}; padding: 46px 18px 20px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px 8px">
<span style="font-size: 20px; font-weight: 700">{{mini.title}}</span>
<span style="display: flex; gap: 14px; font-size: 22px; color: #ff383c"><button onClick="{{mini.prev}}" aria-label="Mois précédent" style="all: unset; cursor: pointer">‹</button><button onClick="{{mini.next}}" aria-label="Mois suivant" style="all: unset; cursor: pointer">›</button></span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; text-align: center">
<sc-for list="{{mini.heads}}" as="h" hint-placeholder-count="7"><span style="font-size: 12px; font-weight: 600; color: {{c.sub}}">{{h}}</span></sc-for>
<sc-for list="{{mini.days}}" as="d" hint-placeholder-count="35">
<button onClick="{{d.go}}" aria-label="{{d.label}}" style="all: unset; cursor: pointer; justify-self: center; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: {{d.weight}}; background: {{d.bg}}; color: {{d.fg}}">{{d.n}}</button>
</sc-for>
</div>
<span style="font-size: 13px; font-weight: 600; color: {{c.sub}}; padding: 26px 4px 6px; text-transform: uppercase">Sur la tablette</span>
<sc-for list="{{cals}}" as="k" hint-placeholder-count="4">
<button onClick="{{k.toggle}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 4px; font-size: 17px">
<span style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: 2px solid {{k.color}}; background: {{k.fill}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="opacity: {{k.check}}"><path d="M5 12l5 5 9-10"/></svg></span>{{k.name}}
</button>
</sc-for>
</nav>

<main style="flex-grow: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; position: relative">
<div style="flex-shrink: 0; padding: 40px 24px 12px; display: flex; align-items: center; gap: 16px">
<span style="font-size: 34px; font-weight: 700; flex-grow: 1; white-space: nowrap">{{title}}</span>
<div class="{{c.glass}}" style="display: flex; padding: 3px; border-radius: 20px">
<sc-for list="{{views}}" as="v" hint-placeholder-count="4"><button onClick="{{v.go}}" style="all: unset; cursor: pointer; height: 34px; padding: 0 16px; border-radius: 17px; font-size: 15px; font-weight: 600; background: {{v.bg}}; color: {{v.fg}}; transition: background .2s">{{v.name}}</button></sc-for>
</div>
<span class="{{c.glass}}" style="display: flex; align-items: center; height: 40px; border-radius: 20px; padding: 0 6px; gap: 2px; font-size: 16px; font-weight: 600">
<button onClick="{{prev}}" aria-label="Précédent" style="all: unset; cursor: pointer; width: 32px; text-align: center; font-size: 22px">‹</button>
<button onClick="{{goToday}}" style="all: unset; cursor: pointer; padding: 0 8px">Aujourd’hui</button>
<button onClick="{{next}}" aria-label="Suivant" style="all: unset; cursor: pointer; width: 32px; text-align: center; font-size: 22px">›</button>
</span>
<button onClick="{{addEvent}}" aria-label="Ajouter un événement" class="{{c.glass}}" style="all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #ff383c; font-size: 28px; font-weight: 300">+</button>
</div>

<sc-if value="{{is.cols}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-shrink: 0; padding-left: 56px; border-bottom: 1px solid {{c.sep}}">
<sc-for list="{{cols}}" as="d" hint-placeholder-count="7">
<div style="flex: 1; text-align: center; padding: 6px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 13px; font-weight: 600; color: {{c.sub}}; text-transform: uppercase">{{d.dow}}</span><span style="width: 36px; height: 36px; border-radius: 50%; background: {{d.bg}}; color: {{d.fg}}; font-size: 22px; font-weight: 500; display: flex; align-items: center; justify-content: center">{{d.n}}</span></div>
</sc-for>
</div>
<div style="flex-grow: 1; overflow-y: auto; position: relative">
<div style="display: flex; height: {{gridH}}px; position: relative">
<div style="width: 56px; flex-shrink: 0; position: relative">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="12"><span style="position: absolute; right: 8px; top: {{h.top}}px; font-size: 12px; color: {{c.sub}}; transform: translateY(-7px)">{{h.label}}</span></sc-for>
</div>
<div style="flex-grow: 1; position: relative; display: flex">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="12"><span style="position: absolute; left: 0; right: 0; top: {{h.top}}px; border-top: 1px solid {{c.sep}}"></span></sc-for>
<sc-for list="{{cols}}" as="d" hint-placeholder-count="7">
<div style="flex: 1; position: relative; border-left: 1px solid {{c.sep}}">
<sc-for list="{{d.events}}" as="e" hint-placeholder-count="2">
<button onClick="{{e.pick}}" style="all: unset; cursor: pointer; position: absolute; left: 3px; right: 3px; top: {{e.top}}px; height: {{e.h}}px; box-sizing: border-box; border-radius: 8px; padding: 5px 8px; border-left: 4px solid {{e.color}}; background: {{e.bg}}; color: {{e.fg}}; overflow: hidden; font-size: 13px; font-weight: 600; line-height: 1.25"><span style="display: block">{{e.title}}</span><span style="display: block; font-weight: 400; opacity: .8">{{e.time}}</span></button>
</sc-for>
<sc-if value="{{d.today}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 0; right: 0; top: {{nowTop}}px; border-top: 2px solid #ff383c"><span style="position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: #ff383c"></span></span></sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{is.month}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid {{c.sep}}; flex-shrink: 0"><sc-for list="{{monthHeads}}" as="h" hint-placeholder-count="7"><span style="text-align: center; font-size: 13px; font-weight: 600; color: {{c.sub}}; padding: 6px 0; text-transform: uppercase">{{h}}</span></sc-for></div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; overflow: hidden">
<sc-for list="{{monthCells}}" as="m" hint-placeholder-count="35">
<div style="border-right: 1px solid {{c.sep}}; border-bottom: 1px solid {{c.sep}}; padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow: hidden; opacity: {{m.op}}">
<button onClick="{{m.go}}" style="all: unset; cursor: pointer; align-self: flex-end; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; background: {{m.bg}}; color: {{m.fg}}">{{m.n}}</button>
<sc-for list="{{m.events}}" as="e" hint-placeholder-count="2"><button onClick="{{e.pick}}" style="all: unset; cursor: pointer; border-radius: 5px; padding: 2px 6px; font-size: 12px; font-weight: 600; background: {{e.bg}}; color: {{e.fg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.title}}</button></sc-for>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{is.year}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 10px 28px 30px">
<sc-for list="{{yearMonths}}" as="ym" hint-placeholder-count="12">
<button onClick="{{ym.go}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 18px; font-weight: 700; color: {{ym.fg}}">{{ym.name}}</span>
<span style="display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 3px; text-align: center; font-size: 11px"><sc-for list="{{ym.days}}" as="d" hint-placeholder-count="35"><span style="width: 20px; height: 20px; line-height: 20px; border-radius: 50%; background: {{d.bg}}; color: {{d.fg}}">{{d.n}}</span></sc-for></span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{pop.on}}" hint-placeholder-val="{{false}}">
<div onClick="{{closePop}}" style="position: absolute; inset: 0"></div>
<div class="{{c.glass}}" style="position: absolute; left: 50%; top: 170px; margin-left: -190px; width: 380px; border-radius: 22px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<span style="display: flex; gap: 12px; align-items: flex-start"><span style="width: 6px; align-self: stretch; border-radius: 3px; background: {{pop.color}}"></span><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 22px; font-weight: 700">{{pop.title}}</span><span style="font-size: 16px; color: {{c.sub}}">{{pop.when}}</span></span></span>
<span style="font-size: 16px">{{pop.place}}</span><span style="font-size: 15px; color: {{c.sub}}">Calendrier : {{pop.cal}}</span><span style="font-size: 15px; color: {{c.sub}}">{{pop.note}}</span>
<span style="display: flex; justify-content: space-between; padding-top: 6px"><button onClick="{{delPop}}" style="all: unset; cursor: pointer; font-size: 16px; font-weight: 600; color: #ff383c">Supprimer</button><button onClick="{{closePop}}" style="all: unset; cursor: pointer; font-size: 16px; font-weight: 600; color: #0088ff">Fermer</button></span>
</div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1348,"height":1019}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const events = [
{ id: 1, title: 'Patrouille', cal: 'pol', dow: [1, 3, 5], s: 8, e: 12, place: 'Vinewood Boulevard', note: 'Équipe Sam Leroy / Alex Martin.' },
{ id: 2, title: 'Réunion au poste', cal: 'post', dow: [2], s: 14, e: 15.5, place: 'Poste de Mission Row', note: 'Point hebdomadaire avec le commissaire.' },
{ id: 3, title: 'Rendez-vous garage', cal: 'gar', dow: [4], s: 10, e: 11, place: 'Garage de Del Perro', note: 'Révision du véhicule de service.' },
{ id: 4, title: 'Entraînement tir', cal: 'post', dow: [6], s: 9, e: 11, place: 'Stand de La Mesa', note: 'Apporter la carte d’accès.' },
{ id: 5, title: 'Dîner avec Lina', cal: 'perso', dow: [6], s: 19.5, e: 21.5, place: 'Restaurant de Vespucci', note: '' },
{ id: 6, title: 'Brunch à Del Perro', cal: 'perso', date: '2026-11-22', s: 11, e: 12.5, place: 'Del Perro Pier', note: 'Avec Jade et Noah.' },
{ id: 7, title: 'Contrôle technique', cal: 'gar', date: '2026-11-18', s: 16, e: 17, place: 'Centre de Rancho', note: '' },
{ id: 8, title: 'Formation secours', cal: 'post', dow: [3], s: 14, e: 16, place: 'Hôpital de Pillbox', note: 'Gestes de premiers secours.' }
];
this.state = { dark: !!props.dark, view: 'week', anchor: new Date(2026, 10, 22).getTime(), miniMonth: new Date(2026, 10, 1).getTime(), hidden: {}, events, sel: null, nid: 9 };
}
componentDidUpdate(prev) { if (prev.dark !== this.props.dark) this.setState({ dark: !!this.props.dark }); }
renderVals() {
const s = this.state; const dark = s.dark;
const c = dark
? { side: '#000000', cell: '#000000', fg: '#ffffff', sub: 'rgba(235,235,245,.6)', sep: 'rgba(84,84,88,.6)', glass: 'glass dk', hi: '#2c2c2e' }
: { side: '#f2f2f7', cell: '#ffffff', fg: '#000000', sub: 'rgba(60,60,67,.6)', sep: 'rgba(60,60,67,.18)', glass: 'glass', hi: '#e3e3e8' };
const CAL = { pol: ['Patrouilles', '#ff383c'], post: ['Poste', '#0088ff'], gar: ['Garage', '#ff8d28'], perso: ['Personnel', '#34c759'] };
const MN = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const DN = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const HEAD = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const anchor = new Date(s.anchor); const today = new Date(2026, 10, 22);
const key = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const add = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const same = (a, b) => key(a) === key(b);
const dow = (d) => (d.getDay() === 0 ? 7 : d.getDay());
const monday = (d) => add(d, 1 - dow(d));
const fmt = (h) => Math.floor(h) + ':' + (h % 1 ? '30' : '00');
const evOn = (d) => s.events.filter((e) => !s.hidden[e.cal] && (e.date ? e.date === key(d) : e.dow.indexOf(dow(d)) >= 0)).sort((a, b) => a.s - b.s);
const pick = (e, d) => () => this.setState({ sel: { id: e.id, day: key(d) } });
const goDay = (d) => () => this.setState({ anchor: d.getTime(), view: 'day', miniMonth: new Date(d.getFullYear(), d.getMonth(), 1).getTime() });
const PX = 56;
const evView = (e, d) => ({ title: e.title, time: fmt(e.s) + ' – ' + fmt(e.e), top: (e.s - 8) * PX, h: (e.e - e.s) * PX - 2, color: CAL[e.cal][1], bg: CAL[e.cal][1] + (dark ? '55' : '2e'), fg: dark ? '#fff' : CAL[e.cal][1], pick: pick(e, d) });
const days = s.view === 'day' ? [anchor] : [0, 1, 2, 3, 4, 5, 6].map((i) => add(monday(anchor), i));
const cols = days.map((d) => ({ dow: DN[d.getDay()].slice(0, 3) + '.', n: d.getDate(), today: same(d, today), bg: same(d, today) ? '#ff383c' : 'transparent', fg: same(d, today) ? '#fff' : c.fg, events: evOn(d).map((e) => evView(e, d)) }));
const hours = []; for (let h = 8; h <= 20; h++) hours.push({ label: h + ':00', top: (h - 8) * PX });
const ms = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
const mStart = monday(ms);
const monthCells = []; for (let i = 0; i < 42; i++) { const d = add(mStart, i); if (i >= 35 && d.getMonth() !== ms.getMonth()) break; const evs = evOn(d); monthCells.push({ n: d.getDate(), op: d.getMonth() === ms.getMonth() ? 1 : 0.4, bg: same(d, today) ? '#ff383c' : 'transparent', fg: same(d, today) ? '#fff' : c.fg, go: goDay(d), events: evs.slice(0, 3).map((e) => ({ title: e.title, bg: CAL[e.cal][1] + (dark ? '55' : '2e'), fg: dark ? '#fff' : CAL[e.cal][1], pick: pick(e, d) })) }); }
const mm = new Date(s.miniMonth); const mm0 = monday(new Date(mm.getFullYear(), mm.getMonth(), 1));
const miniDays = []; for (let i = 0; i < 42; i++) { const d = add(mm0, i); if (i >= 35 && d.getMonth() !== mm.getMonth()) break; const t = same(d, today); const sl = same(d, anchor); miniDays.push({ n: d.getDate(), label: d.getDate() + ' ' + MN[d.getMonth()], weight: t || sl ? 700 : 400, bg: t ? '#ff383c' : sl ? c.hi : 'transparent', fg: t ? '#fff' : d.getMonth() === mm.getMonth() ? c.fg : c.sub, go: () => this.setState({ anchor: d.getTime(), view: s.view === 'year' ? 'day' : s.view }) }); }
const yearMonths = MN.map((nm, mi) => { const f = new Date(anchor.getFullYear(), mi, 1); const st = monday(f); const dd = []; for (let i = 0; i < 42; i++) { const d = add(st, i); if (i >= 35 && d.getMonth() !== mi) break; const t = same(d, today); dd.push({ n: d.getMonth() === mi ? d.getDate() : '', bg: t ? '#ff383c' : 'transparent', fg: t ? '#fff' : c.fg }); } return { name: nm.charAt(0).toUpperCase() + nm.slice(1), days: dd, fg: today.getMonth() === mi && today.getFullYear() === anchor.getFullYear() ? '#ff383c' : c.fg, go: () => this.setState({ anchor: f.getTime(), view: 'month', miniMonth: f.getTime() }) }; });
const step = (n) => { const v = s.view; const d = v === 'day' ? add(anchor, n) : v === 'week' ? add(anchor, 7 * n) : v === 'month' ? new Date(anchor.getFullYear(), anchor.getMonth() + n, 1) : new Date(anchor.getFullYear() + n, anchor.getMonth(), 1); this.setState({ anchor: d.getTime(), miniMonth: new Date(d.getFullYear(), d.getMonth(), 1).getTime() }); };
let title = '';
if (s.view === 'day') title = DN[anchor.getDay()] + ' ' + anchor.getDate() + ' ' + MN[anchor.getMonth()] + ' ' + anchor.getFullYear();
if (s.view === 'week') { const a = days[0], b = days[6]; title = a.getDate() + (a.getMonth() !== b.getMonth() ? ' ' + MN[a.getMonth()] : '') + ' – ' + b.getDate() + ' ' + MN[b.getMonth()] + ' ' + b.getFullYear(); }
if (s.view === 'month') title = MN[anchor.getMonth()] + ' ' + anchor.getFullYear();
if (s.view === 'year') title = String(anchor.getFullYear());
const selEv = s.sel ? s.events.find((e) => e.id === s.sel.id) : null;
const pop = selEv ? { on: true, title: selEv.title, color: CAL[selEv.cal][1], cal: CAL[selEv.cal][0], place: selEv.place, note: selEv.note, when: s.sel.day.split('-').reverse().join('/') + ' · ' + fmt(selEv.s) + ' – ' + fmt(selEv.e) } : { on: false };
const vn = [['day', 'Jour'], ['week', 'Semaine'], ['month', 'Mois'], ['year', 'Année']];
return {
c, dark, title, cols, hours, gridH: 13 * PX, nowTop: (14.53 - 8) * PX, monthCells, yearMonths, pop,
monthHeads: ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'],
is: { cols: s.view === 'day' || s.view === 'week', month: s.view === 'month', year: s.view === 'year' },
views: vn.map((v) => ({ name: v[1], bg: s.view === v[0] ? '#ff383c' : 'transparent', fg: s.view === v[0] ? '#fff' : c.fg, go: () => this.setState({ view: v[0] }) })),
prev: () => step(-1), next: () => step(1), goToday: () => this.setState({ anchor: today.getTime(), miniMonth: new Date(2026, 10, 1).getTime() }),
mini: { title: MN[mm.getMonth()].charAt(0).toUpperCase() + MN[mm.getMonth()].slice(1) + ' ' + mm.getFullYear(), heads: HEAD, days: miniDays, prev: () => this.setState({ miniMonth: new Date(mm.getFullYear(), mm.getMonth() - 1, 1).getTime() }), next: () => this.setState({ miniMonth: new Date(mm.getFullYear(), mm.getMonth() + 1, 1).getTime() }) },
cals: Object.keys(CAL).map((k) => ({ name: CAL[k][0], color: CAL[k][1], fill: s.hidden[k] ? 'transparent' : CAL[k][1], check: s.hidden[k] ? 0 : 1, toggle: () => this.setState({ hidden: { ...s.hidden, [k]: !s.hidden[k] } }) })),
closePop: () => this.setState({ sel: null }),
delPop: () => this.setState({ events: s.events.filter((e) => e.id !== s.sel.id), sel: null }),
addEvent: () => { const ev = { id: s.nid, title: 'Nouvel événement', cal: 'perso', date: key(anchor), s: 16, e: 17, place: 'À définir', note: '' }; this.setState({ events: s.events.concat([ev]), nid: s.nid + 1, sel: { id: ev.id, day: key(anchor) }, hidden: { ...s.hidden, perso: false } }); }
};
}
}
</script>
</body>
</html>
