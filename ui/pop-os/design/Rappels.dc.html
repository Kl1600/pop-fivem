<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rappels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; display: flex; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: {{c.bg}}; color: {{c.fg}}; overflow: hidden; position: relative">

<nav aria-label="Rappels" style="width: 400px; flex-shrink: 0; height: 100%; box-sizing: border-box; background: {{c.side}}; border-right: 1px solid {{c.sep}}; padding: 46px 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px">
<label style="height: 40px; border-radius: 20px; background: {{c.fill}}; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: {{c.sub}}; margin-top: 8px">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input aria-label="Rechercher" placeholder="Rechercher" value="{{query}}" onInput="{{onQuery}}" style="all: unset; flex-grow: 1; font-size: 17px; color: {{c.fg}}">
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.go}}" style="all: unset; cursor: pointer; grid-column: {{t.span}}; height: 86px; border-radius: 16px; background: {{t.bg}}; box-sizing: border-box; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; outline: {{t.ring}}; transition: outline .15s">
<span style="display: flex; justify-content: space-between; align-items: center"><span style="width: 34px; height: 34px; border-radius: 50%; background: {{t.color}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"/></svg></span><span style="font-size: 28px; font-weight: 700">{{t.n}}</span></span>
<span style="font-size: 16px; font-weight: 600; color: {{c.sub}}">{{t.name}}</span>
</button>
</sc-for>
</div>
<span style="font-size: 22px; font-weight: 700; padding: 10px 4px 0">Mes listes</span>
<div style="border-radius: 16px; background: {{c.cell}}; overflow: hidden">
<sc-for list="{{lists}}" as="l" hint-placeholder-count="3">
<button onClick="{{l.go}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; height: 52px; padding: 0 14px; background: {{l.bg}}; color: {{l.fg}}; border-bottom: 1px solid {{c.sep}}">
<span style="width: 32px; height: 32px; border-radius: 50%; background: {{l.color}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M8 7h11M8 12h11M8 17h11M4 7h.1M4 12h.1M4 17h.1"/></svg></span>
<span style="flex-grow: 1; font-size: 17px; font-weight: 500">{{l.name}}</span><span style="font-size: 17px; color: {{l.sub}}">{{l.n}}</span>
</button>
</sc-for>
</div>
</nav>

<main style="flex-grow: 1; min-width: 0; height: 100%; position: relative; overflow-y: auto; padding: 0 60px 140px">
<div style="height: 90px; display: flex; align-items: flex-end; justify-content: flex-end; padding-bottom: 6px">
<button onClick="{{startAdd}}" aria-label="Ajouter un rappel" class="{{c.glass}}" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: {{view.color}}; font-size: 30px; font-weight: 300">+</button>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; color: {{view.color}}">
<span style="font-size: 34px; font-weight: 800">{{view.name}}</span><span style="font-size: 34px; font-weight: 800">{{view.n}}</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="padding: 8px 0; border-bottom: 1px solid {{c.sep}}">
<div style="display: flex; align-items: flex-start; gap: 14px">
<button onClick="{{r.toggle}}" aria-label="Terminer" style="all: unset; cursor: pointer; margin-top: 1px; width: 26px; height: 26px; border-radius: 50%; box-sizing: border-box; border: 2px solid {{r.ring}}; background: {{r.fill}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .25s, border-color .25s, transform .25s; transform: scale({{r.scale}})"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: {{r.check}}; transition: opacity .2s"><path d="M5 12l5 5 9-10"/></svg></button>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 18px; color: {{r.fg}}; text-decoration: {{r.deco}}; transition: color .25s">{{r.title}}</span>
<span style="font-size: 14px; color: {{r.dateFg}}">{{r.dateLabel}}</span>
</span>
<button onClick="{{r.flag}}" aria-label="Signaler" style="all: unset; cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="{{r.flagFill}}" stroke="{{r.flagColor}}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg></button>
</div>
<sc-for list="{{r.subs}}" as="sb" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; margin: 6px 0 0 40px">
<button onClick="{{sb.toggle}}" aria-label="Terminer la sous-tâche" style="all: unset; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; border: 2px solid {{sb.ring}}; background: {{sb.fill}}; transition: background .25s"></button>
<span style="font-size: 16px; color: {{sb.fg}}; text-decoration: {{sb.deco}}">{{sb.t}}</span>
</div>
</sc-for>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><span style="display: block; padding: 60px 0; text-align: center; color: {{c.sub}}; font-size: 18px">Aucun rappel.</span></sc-if>
<sc-if value="{{adding}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 0">
<span style="width: 26px; height: 26px; border-radius: 50%; box-sizing: border-box; border: 2px solid {{c.sub}}"></span>
<input aria-label="Nouveau rappel" placeholder="Nouveau rappel" value="{{draft}}" onInput="{{onDraft}}" onKeyDown="{{onKey}}" style="all: unset; flex-grow: 1; font-size: 18px; color: {{c.fg}}">
<button onClick="{{commit}}" style="all: unset; cursor: pointer; font-size: 16px; font-weight: 600; color: #0088ff">Ajouter</button>
</div>
</sc-if>
<button onClick="{{startAdd}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 14px 0; font-size: 17px; font-weight: 700; color: {{view.color}}">+ Nouveau rappel</button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1348,"height":1019}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const R = (id, list, title, day, flag, subs, done) => ({ id, list, title, day, flag: !!flag, subs: subs || [], done: !!done });
const S = (t, done) => ({ t, done: !!done });
this.state = {
dark: !!props.dark, sel: 'today', query: '', adding: false, draft: '', nid: 20,
items: [
R(1, 'travail', 'Rédiger le rapport d’enquête Vinewood', 0, true, [S('Relire les témoignages'), S('Joindre les photos', true)]),
R(2, 'travail', 'Réunion au poste de Mission Row', 2, false),
R(3, 'perso', 'Appeler Lina Costa', 0, false),
R(4, 'perso', 'Rendez-vous garage de Del Perro', 4, true),
R(5, 'courses', 'Acheter du café et du pain', 0, false, [S('Café en grains'), S('Pain complet')]),
R(6, 'courses', 'Huile moteur 5W-30', null, false),
R(7, 'travail', 'Renouveler l’assurance du véhicule de service', -1, false),
R(8, 'perso', 'Réserver le dîner à Vespucci', 6, false),
R(9, 'travail', 'Envoyer le planning de patrouille', -2, false, [], true),
R(10, 'courses', 'Lessive', null, false, [], true)
]
};
}
componentDidUpdate(prev) { if (prev.dark !== this.props.dark) this.setState({ dark: !!this.props.dark }); }
setItem(id, fn) { this.setState({ items: this.state.items.map((x) => (x.id === id ? fn(x) : x)) }); }
add() {
const s = this.state; const t = s.draft.trim();
if (!t) { this.setState({ adding: false }); return; }
const list = ['travail', 'perso', 'courses'].indexOf(s.sel) >= 0 ? s.sel : 'perso';
const day = s.sel === 'today' ? 0 : null;
this.setState({ items: s.items.concat([{ id: s.nid, list, title: t, day, flag: s.sel === 'flag', subs: [], done: false }]), nid: s.nid + 1, draft: '', adding: true });
}
renderVals() {
const s = this.state; const dark = s.dark;
const c = dark
? { bg: '#000000', side: '#000000', cell: '#1c1c1e', fg: '#ffffff', sub: 'rgba(235,235,245,.6)', sep: 'rgba(84,84,88,.6)', fill: '#3a3a3c', tile: '#1c1c1e', glass: 'glass dk' }
: { bg: '#ffffff', side: '#f2f2f7', cell: '#ffffff', fg: '#000000', sub: 'rgba(60,60,67,.6)', sep: 'rgba(60,60,67,.18)', fill: '#e3e3e8', tile: '#ffffff', glass: 'glass' };
const todo = s.items.filter((x) => !x.done);
const F = {
today: (x) => !x.done && x.day !== null && x.day <= 0, sched: (x) => !x.done && x.day !== null, all: (x) => !x.done, flag: (x) => !x.done && x.flag, done: (x) => x.done,
travail: (x) => x.list === 'travail', perso: (x) => x.list === 'perso', courses: (x) => x.list === 'courses'
};
const tileDef = [['today', 'Aujourd’hui', '#0088ff', 'M8 3v3M16 3v3M4 8h16M5 5h14v15H5z'], ['sched', 'Programmés', '#ff383c', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2'], ['all', 'Tous', '#636366', 'M4 7h16M4 12h16M4 17h16'], ['flag', 'Signalés', '#ff8d28', 'M5 21V4M5 4h12l-2 4 2 4H5'], ['done', 'Terminés', '#8e8e93', 'M5 12l5 5 9-10']];
const listDef = [['travail', 'Travail', '#0088ff'], ['perso', 'Personnel', '#ff2d55'], ['courses', 'Courses', '#34c759']];
const colorOf = {}; tileDef.forEach((t) => { colorOf[t[0]] = t[2]; }); listDef.forEach((l) => { colorOf[l[0]] = l[2]; });
const nameOf = {}; tileDef.forEach((t) => { nameOf[t[0]] = t[1]; }); listDef.forEach((l) => { nameOf[l[0]] = l[1]; });
const count = (k) => s.items.filter((x) => F[k](x) && (k === 'done' || ['travail', 'perso', 'courses'].indexOf(k) < 0 || !x.done)).length;
const tiles = tileDef.map((t, i) => ({ name: t[1], color: t[2], d: t[3], n: count(t[0]), bg: c.tile, span: i === 4 ? '1 / span 2' : 'auto', ring: s.sel === t[0] ? '2px solid ' + t[2] : '2px solid transparent', go: () => this.setState({ sel: t[0], adding: false }) }));
const lists = listDef.map((l) => ({ name: l[1], color: l[2], n: count(l[0]), bg: s.sel === l[0] ? c.fill : 'transparent', fg: c.fg, sub: c.sub, go: () => this.setState({ sel: l[0], adding: false }) }));
const q = s.query.trim().toLowerCase();
let shown = s.items.filter((x) => F[s.sel](x) && (!q || x.title.toLowerCase().indexOf(q) >= 0));
shown = shown.slice().sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1));
const MN = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const DN = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const label = (d) => { if (d === null) return ''; if (d === 0) return 'Aujourd’hui'; if (d === 1) return 'Demain'; if (d === -1) return 'Hier'; const dt = new Date(2026, 10, 22 + d); return DN[dt.getDay()] + ' ' + dt.getDate() + ' ' + MN[dt.getMonth()]; };
const col = colorOf[s.sel];
const rows = shown.map((x) => ({
title: x.title, dateLabel: label(x.day), dateFg: x.day !== null && x.day < 0 && !x.done ? '#ff383c' : c.sub,
ring: x.done ? col : c.sub, fill: x.done ? col : 'transparent', check: x.done ? 1 : 0, scale: x.done ? 1 : 1, fg: x.done ? c.sub : c.fg, deco: x.done ? 'line-through' : 'none',
flagFill: x.flag ? '#ff8d28' : 'none', flagColor: x.flag ? '#ff8d28' : c.sub,
toggle: () => this.setItem(x.id, (y) => ({ ...y, done: !y.done })), flag: () => this.setItem(x.id, (y) => ({ ...y, flag: !y.flag })),
subs: x.subs.map((sb, i) => ({ t: sb.t, ring: sb.done ? col : c.sub, fill: sb.done ? col : 'transparent', fg: sb.done ? c.sub : c.fg, deco: sb.done ? 'line-through' : 'none', toggle: () => this.setItem(x.id, (y) => ({ ...y, subs: y.subs.map((z, j) => (j === i ? { ...z, done: !z.done } : z)) })) }))
}));
return {
c, dark, tiles, lists, rows, query: s.query, onQuery: (e) => this.setState({ query: e.target.value }),
view: { name: nameOf[s.sel], color: col, n: shown.filter((x) => !x.done || s.sel === 'done').length },
empty: !shown.length && !s.adding, adding: s.adding, draft: s.draft,
startAdd: () => this.setState({ adding: true }),
onDraft: (e) => this.setState({ draft: e.target.value }),
onKey: (e) => { if (e.key === 'Enter') this.add(); if (e.key === 'Escape') this.setState({ adding: false, draft: '' }); },
commit: () => this.add()
};
}
}
</script>
</body>
</html>
