<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Plans</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
@keyframes pulse{0%{r:10;opacity:.55}100%{r:34;opacity:0}}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: {{map.land}}; color: {{c.fg}}">

<div style="position: absolute; left: -326px; top: -240px; width: 2000px; height: 1500px; transform: {{mapTf}}; transform-origin: 1000px 749px; transition: transform .8s cubic-bezier(.3,.7,.2,1)">
<svg aria-label="Carte de Los Santos" width="2000" height="1500" viewBox="0 0 2000 1500">
<defs><pattern id="rues" width="130" height="110" patternUnits="userSpaceOnUse" patternTransform="rotate(-9)"><path d="M0 0H130M0 0V110" stroke="{{map.minor}}" stroke-width="6" fill="none"></path></pattern></defs>
<rect x="0" y="0" width="2000" height="1500" fill="{{map.land}}"></rect>
<rect x="0" y="0" width="2000" height="1500" fill="url(#rues)"></rect>
<sc-for list="{{parks}}" as="pk" hint-placeholder-count="4"><rect x="{{pk.x}}" y="{{pk.y}}" width="{{pk.w}}" height="{{pk.h}}" rx="{{pk.r}}" fill="{{map.park}}"></rect></sc-for>
<sc-for list="{{roads}}" as="r" hint-placeholder-count="6"><path d="{{r.d}}" fill="none" stroke="{{map.roadCase}}" stroke-width="{{r.cw}}" stroke-linecap="round"></path></sc-for>
<sc-for list="{{roads}}" as="r" hint-placeholder-count="6"><path d="{{r.d}}" fill="none" stroke="{{map.road}}" stroke-width="{{r.w}}" stroke-linecap="round"></path></sc-for>
<path d="M0 0H570C530 150 610 260 550 380C490 500 570 600 510 720C450 840 530 960 470 1080C430 1180 490 1330 440 1500H0Z" fill="{{map.sea}}"></path>
<path d="M570 0C530 150 610 260 550 380C490 500 570 600 510 720C450 840 530 960 470 1080C430 1180 490 1330 440 1500" fill="none" stroke="{{map.beach}}" stroke-width="7"></path>
<path d="M545 748H655M545 772H655" stroke="{{map.roadCase}}" stroke-width="8" fill="none"></path>
<g style="opacity: {{map.transitOp}}; transition: opacity .4s" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M700 380L900 540L1120 700L1300 940L1480 1060" stroke="#CB30E0"></path><path d="M800 1000L1000 860L1260 700L1500 600" stroke="#34C759"></path></g>
<sc-for list="{{labels}}" as="l" hint-placeholder-count="8"><text x="{{l.x}}" y="{{l.y}}" text-anchor="middle" font-size="{{l.fs}}" font-weight="700" letter-spacing="2" fill="{{map.label}}" font-family="Inter, system-ui, sans-serif">{{l.t}}</text></sc-for>
<polyline points="{{routePts}}" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke-dasharray: 1; stroke-dashoffset: {{routeOff}}; transition: stroke-dashoffset .9s ease"></polyline>
<polyline points="{{routePts}}" fill="none" stroke="#0a84ff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke-dasharray: 1; stroke-dashoffset: {{routeOff}}; transition: stroke-dashoffset .9s ease"></polyline>
<sc-for list="{{pins}}" as="p" hint-placeholder-count="9">
<g transform="{{p.tf}}" style="cursor: pointer" onClick="{{p.go}}">
<circle cx="0" cy="0" r="{{p.r}}" fill="{{p.col}}" stroke="#ffffff" stroke-width="4"></circle>
<circle cx="0" cy="0" r="6" fill="#ffffff"></circle>
<text x="0" y="{{p.ty}}" text-anchor="middle" font-size="19" font-weight="700" fill="{{map.pinText}}" stroke="{{map.halo}}" stroke-width="5" paint-order="stroke" font-family="Inter, system-ui, sans-serif">{{p.name}}</text>
</g>
</sc-for>
<g transform="translate(1000,860)"><circle cx="0" cy="0" r="10" fill="#0a84ff" opacity=".5" style="animation: pulse 2s ease-out infinite"></circle><circle cx="0" cy="0" r="12" fill="#0a84ff" stroke="#fff" stroke-width="4"></circle></g>
</svg>
</div>

<aside aria-label="Panneau" class="{{c.glass}}" style="position: absolute; left: 20px; top: 20px; bottom: 20px; width: 380px; border-radius: 32px; box-sizing: border-box; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<sc-if value="{{v.home}}" hint-placeholder-val="{{true}}">

<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input aria-label="Rechercher un lieu" placeholder="Rechercher dans Plans" value="{{query}}" onInput="{{onQuery}}" style="all: unset; flex-grow: 1; font-size: 17px; color: {{c.fg}}">
</label>
<div style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px">
<sc-if value="{{noQuery}}" hint-placeholder-val="{{true}}">
<span style="font-size: 20px; font-weight: 700; padding: 6px 4px 2px">Favoris</span>
<div style="display: flex; gap: 8px; padding-bottom: 8px">
<sc-for list="{{favs}}" as="f" hint-placeholder-count="3">
<button onClick="{{f.go}}" style="all: unset; cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0">
<span style="width: 58px; height: 58px; border-radius: 29px; background: {{f.col}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.d}}"/></svg></span>
<span style="font-size: 14px; font-weight: 600; text-align: center">{{f.short}}</span>
<span style="font-size: 12px; color: {{c.sub}}">{{f.area}}</span>
</button>
</sc-for>
</div>
<span style="font-size: 20px; font-weight: 700; padding: 6px 4px 2px">Récents</span>
</sc-if>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<button onClick="{{r.go}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-bottom: 1px solid {{c.sep}}">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: {{r.col}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"/></svg></span>

</button>
</sc-for>
<sc-if value="{{noRows}}" hint-placeholder-val="{{false}}"><span style="display: block; text-align: center; padding: 40px 10px; color: {{c.sub}}; font-size: 16px">Aucun résultat.</span></sc-if>
</div>
</sc-if>

<sc-if value="{{v.place}}" hint-placeholder-val="{{false}}">
<button onClick="{{back}}" aria-label="Retour" style="all: unset; cursor: pointer; align-self: flex-start; display: flex; align-items: center; gap: 4px; font-size: 17px; color: #0088ff; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Plans</button>

<button onClick="{{toggleFav}}" aria-label="Favori" style="all: unset; cursor: pointer; width: 54px; height: 54px; border-radius: 27px; background: {{c.fill}}; display: flex; align-items: center; justify-content: center; color: #ff9f0a"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.600 6.100.8-4.500 4.200 1.100 6.100L12 16.800 6.600 19.700l1.100-6.100L3.200 9.400l6.100-.8z"/></svg></button>
</div>
<div style="border-radius: 18px; background: {{c.cell}}; overflow: hidden">
<sc-for list="{{infos}}" as="i" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-bottom: 1px solid {{c.sep}}"><span style="font-size: 13px; color: {{c.sub}}">{{i.k}}</span><span style="font-size: 16px">{{i.v}}</span></div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{v.route}}" hint-placeholder-val="{{false}}">
<button onClick="{{backPlace}}" aria-label="Retour" style="all: unset; cursor: pointer; align-self: flex-start; display: flex; align-items: center; gap: 4px; font-size: 17px; color: #0088ff; font-weight: 600"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>{{pl.name}}</button>
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #0a84ff"></span><span style="font-size: 16px">Ma position</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #ff383c"></span><span style="font-size: 16px; font-weight: 600">{{pl.name}}</span></div>
<div style="display: flex; gap: 6px; background: {{c.fill}}; border-radius: 22px; padding: 4px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button onClick="{{m.go}}" style="all: unset; cursor: pointer; flex: 1; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600; background: {{m.bg}}; color: {{m.fg}}; transition: background .2s"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{m.d}}"/></svg>{{m.label}}</button></sc-for>
</div>
<div style="border-radius: 18px; background: {{c.cell}}; padding: 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 44px; font-weight: 700; line-height: 1">{{trip.time}}</span>
<span style="font-size: 16px; color: {{c.sub}}">{{trip.dist}} · arrivée à {{trip.arr}}</span>
<span style="font-size: 15px; color: {{c.sub}}; padding-top: 6px">Via {{trip.via}}</span>
</div>
<button onClick="{{start}}" style="all: unset; cursor: pointer; height: 54px; border-radius: 27px; background: #34c759; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">Démarrer</button>
</sc-if>

<sc-if value="{{v.nav}}" hint-placeholder-val="{{false}}">
<div style="border-radius: 22px; background: #0a84ff; color: #fff; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; opacity: .85">Navigation vers {{pl.name}}</span>
<span style="font-size: 24px; font-weight: 700; line-height: 1.2">{{trip.step1}}</span>
</div>
<div style="border-radius: 18px; background: {{c.cell}}; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: {{c.sub}}">Ensuite</span><span style="font-size: 17px">{{trip.step2}}</span></div>
<div style="display: flex; justify-content: space-between; padding: 6px 6px"><span style="font-size: 28px; font-weight: 700">{{trip.time}}</span><span style="font-size: 17px; color: {{c.sub}}; align-self: flex-end">{{trip.dist}} · {{trip.arr}}</span></div>
<button onClick="{{stop}}" style="all: unset; cursor: pointer; height: 54px; border-radius: 27px; background: #ff383c; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">Terminer</button>
</sc-if>
</aside>

<div style="position: absolute; right: 22px; top: 24px; display: flex; flex-direction: column; gap: 12px; align-items: flex-end">
<button onClick="{{toggleMenu}}" aria-label="Type de carte" class="{{c.glass}}" style="all: unset; cursor: pointer; width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: {{c.fg}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg></button>
<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<div class="{{c.glass}}" style="width: 200px; border-radius: 22px; padding: 8px; display: flex; flex-direction: column">
<sc-for list="{{types}}" as="t" hint-placeholder-count="3"><button onClick="{{t.go}}" style="all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 14px; font-size: 16px; font-weight: 600; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}<span style="opacity: {{t.on}}">✓</span></button></sc-for>
</div>
</sc-if>
<button onClick="{{toggle3d}}" aria-label="Vue 3D" class="{{c.glass}}" style="all: unset; cursor: pointer; width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: {{btn3d}}">3D</button>
<button onClick="{{locate}}" aria-label="Ma position" class="{{c.glass}}" style="all: unset; cursor: pointer; width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: #0a84ff"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-8 16-2-6z"/></svg></button>
</div>
</div>
</x-dc>
