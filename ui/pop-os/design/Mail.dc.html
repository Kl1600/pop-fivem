<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; display: flex; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: {{c.bg}}; color: {{c.fg}}; overflow: hidden; position: relative">

<nav aria-label="Boîtes" style="width: 270px; flex-shrink: 0; height: 100%; box-sizing: border-box; background: {{c.side}}; border-right: 1px solid {{c.sep}}; padding: 46px 14px 20px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 34px; font-weight: 700; padding: 0 10px 12px">Boîtes</span>
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
<span style="display: {{b.headShow}}; font-size: 13px; font-weight: 600; color: {{c.sub}}; padding: 14px 10px 6px">Dossiers</span>
<button onClick="{{b.go}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; border-radius: 10px; background: {{b.bg}}; color: {{b.fg}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{b.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.d}}"/></svg>
<span style="flex-grow: 1; font-size: 17px">{{b.name}}</span><span style="font-size: 16px; color: {{b.sub}}">{{b.n}}</span>
</button>
</sc-for>
</nav>

<section aria-label="Messages" style="width: 410px; flex-shrink: 0; height: 100%; box-sizing: border-box; background: {{c.cell}}; border-right: 1px solid {{c.sep}}; display: flex; flex-direction: column">
<div style="padding: 46px 18px 10px; display: flex; flex-direction: column; gap: 12px">
<span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 34px; font-weight: 700">{{boxTitle}}</span>
<button onClick="{{compose}}" aria-label="Nouveau message" class="{{c.glass}}" style="box-sizing: border-box; padding: 0; font: inherit; outline: none; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #0088ff"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg></button></span>
<label style="height: 40px; border-radius: 20px; background: {{c.fill}}; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: {{c.sub}}">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input aria-label="Rechercher" placeholder="Rechercher" value="{{query}}" onInput="{{onQuery}}" style="all: unset; flex-grow: 1; font-size: 17px; color: {{c.fg}}">
</label>
</div>
<div style="flex-grow: 1; overflow-y: auto">
<sc-for list="{{rows}}" as="m" hint-placeholder-count="5">
<button onClick="{{m.pick}}" style="all: unset; cursor: pointer; display: flex; gap: 8px; width: 100%; box-sizing: border-box; padding: 12px 14px 12px 8px; background: {{m.bg}}; color: {{m.fg}}">
<span style="width: 10px; flex-shrink: 0; padding-top: 7px"><span style="display: block; width: 10px; height: 10px; border-radius: 5px; background: {{m.dot}}"></span></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid {{m.line}}; padding-bottom: 10px">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.who}}</span><span style="font-size: 14px; color: {{m.sub}}; flex-shrink: 0">{{m.date}}</span></span>
<span style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="#ff8d28" stroke="#ff8d28" stroke-width="2" style="display: {{m.flagShow}}; flex-shrink: 0"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg>{{m.subj}}</span>
<span style="font-size: 15px; line-height: 1.3; color: {{m.sub}}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{m.preview}}</span>
</span>
</button>
</sc-for>
<sc-if value="{{noRows}}" hint-placeholder-val="{{false}}"><span style="display: block; text-align: center; padding: 60px 10px; color: {{c.sub}}; font-size: 16px">Aucun message.</span></sc-if>
</div>
</section>

<main style="flex-grow: 1; min-width: 0; height: 100%; position: relative; display: flex; flex-direction: column; background: {{c.cell}}">
<sc-if value="{{hasMail}}" hint-placeholder-val="{{true}}">
<div class="{{c.glass}}" style="position: absolute; top: 22px; right: 22px; z-index: 4; height: 48px; border-radius: 24px; display: flex; align-items: center; padding: 0 8px; gap: 2px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.go}}" aria-label="{{t.label}}" style="all: unset; cursor: pointer; width: 42px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: {{t.color}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="{{t.fill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"/></svg></button>
</sc-for>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 100px 44px 40px">
<span style="display: block; font-size: 30px; font-weight: 800; line-height: 1.2; padding-bottom: 18px">{{mail.subj}}</span>
<div style="display: flex; align-items: center; gap: 14px; padding-bottom: 18px; border-bottom: 1px solid {{c.sep}}">
<span style="width: 52px; height: 52px; border-radius: 26px; background: {{mail.grad}}; color: #fff; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{mail.ini}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">{{mail.who}}</span><span style="font-size: 14px; color: {{c.sub}}">{{mail.addr}}</span><span style="font-size: 14px; color: {{c.sub}}">{{mail.dir}}</span></span>
<span style="font-size: 14px; color: {{c.sub}}; align-self: flex-start">{{mail.full}}</span>
</div>
<span style="display: block; padding-top: 22px; font-size: 17px; line-height: 1.55; white-space: pre-wrap">{{mail.body}}</span>
</div>
</sc-if>
<sc-if value="{{noMail}}" hint-placeholder-val="{{false}}"><div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; color: {{c.sub}}; font-size: 20px">Aucun message sélectionné</div></sc-if>
</main>

<sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: center; justify-content: center">
<div style="width: 680px; height: 620px; border-radius: 26px; background: {{c.cell}}; padding: 22px 26px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.4)">
<span style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px"><button onClick="{{closeSheet}}" style="all: unset; cursor: pointer; font-size: 17px; color: #0088ff">Annuler</button><span style="font-size: 17px; font-weight: 700">{{sheetTitle}}</span>
<button onClick="{{sendMail}}" aria-label="Envoyer" style="all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 18px; background: #0088ff; color: #fff; display: flex; align-items: center; justify-content: center; opacity: {{sendOp}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></span>
<label style="display: flex; gap: 10px; height: 46px; align-items: center; border-bottom: 1px solid {{c.sep}}"><span style="color: {{c.sub}}; font-size: 17px; width: 56px">À :</span><input aria-label="Destinataire" placeholder="nom@pop.ls" value="{{f.to}}" onInput="{{onTo}}" style="all: unset; flex-grow: 1; font-size: 17px; color: {{c.fg}}"></label>
<label style="display: flex; gap: 10px; height: 46px; align-items: center; border-bottom: 1px solid {{c.sep}}"><span style="color: {{c.sub}}; font-size: 17px; width: 56px">Objet :</span><input aria-label="Objet" value="{{f.subj}}" onInput="{{onSubj}}" style="all: unset; flex-grow: 1; font-size: 17px; font-weight: 600; color: {{c.fg}}"></label>
<label style="display: flex; gap: 10px; height: 40px; align-items: center; border-bottom: 1px solid {{c.sep}}; font-size: 15px; color: {{c.sub}}"><span style="width: 56px">De :</span>alex.martin@pop.ls</label>
<textarea aria-label="Corps du message" placeholder="Votre message" onInput="{{onBody}}" style="all: unset; flex-grow: 1; padding-top: 14px; font-size: 17px; line-height: 1.5; white-space: pre-wrap; color: {{c.fg}}">{{f.body}}</textarea>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1348,"height":1019}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const M = (id, box, who, addr, subj, date, full, body, o) => ({ id, box, who, addr, subj, date, full, body, unread: false, flag: false, vip: false, ...(o || {}) });
const mails = [
M(1, 'inbox', 'LSPD - Ressources humaines', 'rh@lspd.gov', 'Convocation : briefing du 24 novembre', '09:48', '22 novembre 2026 à 09:48', 'Bonjour Alex,\n\nUn briefing général aura lieu mardi 24 novembre à 18h00 à Mission Row, salle 2.\nMerci d’apporter vos rapports de la semaine et de confirmer votre présence.\n\nCordialement,\nService des ressources humaines', { unread: true, vip: true, flag: true }),
M(2, 'inbox', 'Maze Bank', 'support@mazebank.ls', 'Votre relevé de compte de novembre est disponible', '08:30', '22 novembre 2026 à 08:30', 'Bonjour,\n\nVotre relevé du mois de novembre est disponible.\nSolde au 21 novembre : 4 820 $\n\nPour votre sécurité, Maze Bank ne vous demandera jamais votre code par message.\n\nL’équipe Maze Bank', { unread: true }),
M(3, 'inbox', 'Lina Costa', 'lina.costa@pop.ls', 'Témoignage : fourgon blanc', 'Hier', '21 novembre 2026 à 18:12', 'Salut Alex,\n\nJe t’écris ce que j’ai vu devant la boutique : un fourgon blanc, plaque 42 ABC 117, resté garé une heure avec le moteur allumé. Deux hommes sont montés à l’arrière vers 10h20.\n\nJe reste disponible pour une déposition.\n\nLina', { unread: true, vip: true }),
M(4, 'inbox', 'Sam Leroy', 'sam.leroy@lspd.gov', 'Planning des patrouilles de la semaine', 'Hier', '21 novembre 2026 à 14:05', 'Alex,\n\nTu es avec Jade mardi sur Sandy Shores et avec moi mercredi à Paleto Bay. Je t’envoie le tableau complet demain.\n\nSam', { vip: true }),
M(5, 'inbox', 'Noah Petit', 'noah.petit@pop.ls', 'Annonce : garage à louer à Del Perro', 'Samedi', '21 novembre 2026 à 11:20', 'Salut,\n\nJ’ai repéré un garage à louer à Del Perro, 850 $ par mois, deux baies et un pont élévateur. Ça pourrait t’intéresser pour ton projet.\n\nNoah'),
M(6, 'inbox', 'Jade Moreau', 'jade.moreau@pop.ls', 'Concert samedi soir', '18/11/2026', '18 novembre 2026 à 20:41', 'Hello !\n\nJ’ai pris les places pour le concert de Vinewood Bowl samedi à 21h. On se retrouve devant l’entrée à 20h30 ?\n\nJade', { flag: true }),
M(7, 'sent', 'Alex Martin', 'lina.costa@pop.ls', 'Re : Témoignage : fourgon blanc', 'Hier', '21 novembre 2026 à 18:40', 'Merci Lina, je passe demain après-midi pour la déposition.\n\nAlex', { dir: 'À : Lina Costa' }),
M(8, 'drafts', 'Alex Martin', 'sam.leroy@lspd.gov', 'Rapport de patrouille', 'Vendredi', '20 novembre 2026 à 17:02', 'Sam,\n\nCi-joint le rapport de la patrouille de Vinewood…', { dir: 'À : Sam Leroy' }),
M(9, 'trash', 'Weazel Promo', 'promo@pop.ls', 'Offre spéciale : 20 % sur tous les forfaits', '14/11/2026', '14 novembre 2026 à 07:00', 'Profitez de 20 % de remise sur tous les forfaits ce week-end seulement.', {}),
M(10, 'archive', 'Maze Bank', 'support@mazebank.ls', 'Confirmation de virement', '12/11/2026', '12 novembre 2026 à 11:02', 'Votre virement de 1 200 $ a bien été exécuté.', {})
];
this.state = { dark: !!props.dark, mails, box: 'inbox', sel: 1, query: '', sheet: false, f: { to: '', subj: '', body: '' }, nid: 11 };
}
componentDidUpdate(prev) { if (prev.dark !== this.props.dark) this.setState({ dark: !!this.props.dark }); }
upd(id, fn) { this.setState({ mails: this.state.mails.map((m) => (m.id === id ? fn(m) : m)) }); }
renderVals() {
const s = this.state; const dark = s.dark;
const c = dark
? { bg: '#000000', side: '#000000', cell: '#1c1c1e', fg: '#ffffff', sub: 'rgba(235,235,245,.6)', sep: 'rgba(84,84,88,.6)', fill: '#3a3a3c', glass: 'glass dk' }
: { bg: '#f2f2f7', side: '#f2f2f7', cell: '#ffffff', fg: '#000000', sub: 'rgba(60,60,67,.6)', sep: 'rgba(60,60,67,.18)', fill: '#e3e3e8', glass: 'glass' };
const folder = 'M4 6a2 2 0 0 1 2-2h4l2 3h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z';
const bdef = [['inbox', 'Réception', 'M4 13l2-8h12l2 8v6H4zM4 13h5l1 2h4l1-2h5', '#0088ff'], ['vip', 'VIP', 'M12 3l2.700 5.600 6.100.9-4.400 4.300 1 6.100L12 17l-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z', '#ff9f0a'], ['sent', 'Envoyés', 'M3 11l18-8-8 18-2-8z', '#0088ff'], ['drafts', 'Brouillons', 'M6 3h9l4 4v14H6zM9 12h7M9 16h7', '#8e8e93'], ['trash', 'Corbeille', 'M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13', '#8e8e93'], ['archive', 'Archive', 'M3 5h18v4H3zM5 9v10h14V9M10 13h4', '#8e8e93'], ['travail', 'Travail', folder, '#0088ff'], ['perso', 'Personnel', folder, '#0088ff']];
const inBox = (m, b) => (b === 'vip' ? m.box === 'inbox' && m.vip : m.box === b);
const boxes = bdef.map((b) => { const list = s.mails.filter((m) => inBox(m, b[0])); const n = b[0] === 'drafts' ? list.length : list.filter((m) => m.unread).length; const on = s.box === b[0]; return { name: b[1], d: b[2], n: n || '', color: on ? '#fff' : b[3], bg: on ? '#0088ff' : 'transparent', fg: on ? '#fff' : c.fg, sub: on ? 'rgba(255,255,255,.85)' : c.sub, headShow: b[0] === 'travail' ? 'block' : 'none', go: () => { const first = s.mails.find((m) => inBox(m, b[0])); this.setState({ box: b[0], sel: first ? first.id : null, query: '' }); } }; });
const q = s.query.trim().toLowerCase();
const list = s.mails.filter((m) => inBox(m, s.box) && (!q || (m.who + m.subj + m.body).toLowerCase().indexOf(q) >= 0));
const pre = (m) => m.body.replace(/\n+/g, ' ');
const rows = list.map((m, i) => { const on = s.sel === m.id; return { who: s.box === 'sent' || s.box === 'drafts' ? (m.dir || '').replace('À : ', '') : m.who, subj: m.subj, date: m.date, preview: pre(m), dot: m.unread ? (on ? '#fff' : '#0088ff') : 'transparent', flagShow: m.flag ? 'block' : 'none', bg: on ? '#0088ff' : 'transparent', fg: on ? '#fff' : c.fg, sub: on ? 'rgba(255,255,255,.85)' : c.sub, line: on || i === list.length - 1 ? 'transparent' : c.sep, pick: () => { this.upd(m.id, (x) => ({ ...x, unread: false })); this.setState({ sel: m.id }); } }; });
const cur = s.mails.find((m) => m.id === s.sel);
const grads = ['#ff8d28', '#34c759', '#0088ff', '#cb30e0', '#ff2d55', '#00c0e8'];
const ini = (n) => n.split(/[ -]+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
const mail = cur ? { subj: cur.subj, who: cur.who, addr: cur.addr, dir: cur.dir || 'À : alex.martin@pop.ls', full: cur.full, body: cur.body, ini: ini(cur.who), grad: 'linear-gradient(160deg,' + grads[cur.id % 6] + ',#444)' } : {};
const pick = (id) => { const rest = list.filter((m) => m.id !== id); return rest.length ? rest[0].id : null; };
const open = (to, subj, body) => this.setState({ sheet: true, f: { to, subj, body } });
const ic = (d, label, go, color, fill) => ({ d, label, go, color: color || '#0088ff', fill: fill || 'none' });
const tools = cur ? [
ic('M5 21V4M5 4h12l-2 4 2 4H5', 'Drapeau', () => this.upd(cur.id, (x) => ({ ...x, flag: !x.flag })), '#ff8d28', cur.flag ? '#ff8d28' : 'none'),
ic('M3 5h18v4H3zM5 9v10h14V9M10 13h4', 'Archiver', () => { this.upd(cur.id, (x) => ({ ...x, box: 'archive' })); this.setState({ sel: pick(cur.id) }); }),
ic('M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13', 'Supprimer', () => { this.upd(cur.id, (x) => ({ ...x, box: 'trash' })); this.setState({ sel: pick(cur.id) }); }, '#ff383c'),
ic('M9 14L4 9l5-5M4 9h10a6 6 0 0 1 6 6v3', 'Répondre', () => open(cur.box === 'sent' ? cur.addr : cur.addr, /^Re :/.test(cur.subj) ? cur.subj : 'Re : ' + cur.subj, '\n\n— Le ' + cur.full + ', ' + cur.who + ' a écrit :\n' + cur.body)),
ic('M15 14l5-5-5-5M20 9H10a6 6 0 0 0-6 6v3', 'Transférer', () => open('', 'Tr : ' + cur.subj, '\n\n— Message transféré de ' + cur.who + ' (' + cur.addr + ') :\n' + cur.body))
] : [];
const f = s.f;
return {
c, dark, boxes, rows, noRows: !rows.length, tools, mail, hasMail: !!cur, noMail: !cur,
boxTitle: (bdef.find((b) => b[0] === s.box) || bdef[0])[1], query: s.query, onQuery: (e) => this.setState({ query: e.target.value }),
sheet: s.sheet, f, sheetTitle: f.subj || 'Nouveau message', sendOp: f.to.trim() ? 1 : 0.35,
compose: () => open('', '', ''), closeSheet: () => {
if (f.to.trim() || f.subj.trim() || f.body.trim()) this.setState({ mails: [{ id: s.nid, box: 'drafts', who: 'Alex Martin', addr: f.to, dir: 'À : ' + f.to, subj: f.subj || '(Sans objet)', date: 'À l’instant', full: '22 novembre 2026', body: f.body, unread: false, flag: false, vip: false }].concat(s.mails), nid: s.nid + 1, sheet: false });
else this.setState({ sheet: false });
},
onTo: (e) => this.setState({ f: { ...f, to: e.target.value } }), onSubj: (e) => this.setState({ f: { ...f, subj: e.target.value } }), onBody: (e) => this.setState({ f: { ...f, body: e.target.value } }),
sendMail: () => {
if (!f.to.trim()) return;
const d = new Date(); const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
this.setState({ mails: [{ id: s.nid, box: 'sent', who: 'Alex Martin', addr: f.to.trim(), dir: 'À : ' + f.to.trim(), subj: f.subj || '(Sans objet)', date: hm, full: '22 novembre 2026 à ' + hm, body: f.body, unread: false, flag: false, vip: false }].concat(s.mails), nid: s.nid + 1, sheet: false, box: 'sent', sel: s.nid });
}
};
}
}
</script>
</body>
</html>
