<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Appareil photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; position: relative; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: #000; color: #fff; overflow: hidden">

<div style="position: absolute; inset: 0; overflow: hidden; transform: scaleX({{mirror}})">
<svg aria-hidden="true" viewBox="0 0 1348 1019" preserveAspectRatio="xMidYMid slice" width="1348" height="1019" style="position: absolute; inset: 0; transform: scale({{zoomScale}}); transition: transform .35s; filter: {{sceneFilter}}">
<defs>
<linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1a5e"/><stop offset=".35" stop-color="#b8326f"/><stop offset=".6" stop-color="#ff7a45"/><stop offset=".75" stop-color="#ffc46b"/></linearGradient>
<linearGradient id="route" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a4a"/><stop offset="1" stop-color="#14101c"/></linearGradient>
<radialGradient id="soleil" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c8"/><stop offset=".4" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ff8d28" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1348" height="1019" fill="url(#ciel)"/>
<circle cx="690" cy="560" r="260" fill="url(#soleil)"/>
<circle cx="690" cy="560" r="62" fill="#fff3c0"/>
<path d="M0 560h110v-140h70v90h60v-190h80v200h50v-110h90v160h80v-70h60v90h300v-90h70v-230h60v250h80v-150h90v170h120v70H0z" fill="#3b1f4d" opacity=".75"/>
<path d="M0 600h70v-100h60v70h90v-170h70v170h60v-80h70v110h90v-60h80v90h220v-110h80v-190h70v190h70v-80h90v100h110v60H0z" fill="#1d0f2e"/>
<g fill="#10081c"><rect x="150" y="470" width="12" height="190"/><path d="M156 470c-50-10-90 10-110 40 40-20 80-25 110-20zM156 470c50-10 90 10 110 40-40-20-80-25-110-20zM156 470c-20-40-60-55-95-40 40 0 70 15 95 40zM156 470c20-40 60-55 95-40-40 0-70 15-95 40z"/>
<rect x="1180" y="440" width="12" height="220"/><path d="M1186 440c-50-10-90 10-110 40 40-20 80-25 110-20zM1186 440c50-10 90 10 110 40-40-20-80-25-110-20zM1186 440c-20-40-60-55-95-40 40 0 70 15 95 40zM1186 440c20-40 60-55 95-40-40 0-70 15-95 40z"/></g>
<path d="M0 660h1348v359H0z" fill="url(#route)"/>
<path d="M0 660h1348" stroke="#ffb86b" stroke-width="3" opacity=".5"/>
<path d="M660 660L120 1019h280l280-359zM690 660l-8 359h40l-20-359z" fill="#0d0814" opacity=".0"/>
<g stroke="#ffe08a" stroke-width="8" stroke-linecap="round" opacity=".9"><path d="M674 668l-30 80"/><path d="M642 780l-50 130"/><path d="M588 940l-70 100"/></g>
<g stroke="#f3e9ff" stroke-width="3" opacity=".35"><path d="M520 664L-60 1019"/><path d="M860 664L1500 1019"/></g>
<g><rect x="1010" y="560" width="8" height="120" fill="#0d0814"/><rect x="990" y="552" width="48" height="10" rx="5" fill="#0d0814"/><circle cx="1000" cy="566" r="9" fill="#ffd27a"/><ellipse cx="1000" cy="690" rx="46" ry="12" fill="#ffd27a" opacity=".22"/></g>
<g><rect x="360" y="580" width="8" height="100" fill="#0d0814"/><rect x="340" y="572" width="48" height="10" rx="5" fill="#0d0814"/><circle cx="350" cy="586" r="9" fill="#ffd27a"/></g>
<path d="M880 700h200l24 40v36H856v-36z" fill="#1a0f26"/><path d="M890 712h180l12 28H878z" fill="#ff7a45" opacity=".55"/><circle cx="894" cy="772" r="18" fill="#0d0814"/><circle cx="1066" cy="772" r="18" fill="#0d0814"/><circle cx="868" cy="750" r="6" fill="#ff383c"/><circle cx="1092" cy="750" r="6" fill="#ff383c"/>
</svg>
<div style="position: absolute; inset: 0; background: radial-gradient(70% 70% at 50% 50%, transparent 55%, rgba(0,0,0,{{vignette}}) 100%)"></div>
</div>

<sc-if value="{{is.square}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 165px; background: #000"></div><div style="position: absolute; left: 1183px; top: 0; bottom: 0; width: 165px; background: #000"></div></sc-if>
<sc-if value="{{is.pano}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; right: 0; top: 0; height: 280px; background: #000"></div><div style="position: absolute; left: 0; right: 0; bottom: 0; height: 280px; background: #000"></div><div style="position: absolute; left: 120px; right: 260px; top: 505px; height: 4px; border-radius: 2px; background: #ffd60a"></div></sc-if>
<sc-if value="{{is.portrait}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 50%; top: 50%; margin: -170px 0 0 -250px; width: 500px; height: 340px; border: 2px solid #ffd60a; border-radius: 16px"></div><span class="glass dk" style="position: absolute; top: 40px; left: 50%; margin-left: -70px; padding: 6px 16px; border-radius: 16px; font-size: 14px; font-weight: 600">Profondeur f/2,8</span></sc-if>
<div style="position: absolute; left: 50%; top: 50%; margin: -40px 0 0 -40px; width: 80px; height: 80px; border: 1.5px solid rgba(255,214,10,.9); border-radius: 6px; opacity: {{focusOp}}; transition: opacity .3s"></div>

<div style="position: absolute; left: 24px; top: 24px; display: flex; gap: 12px">
<button onClick="{{toggleFlash}}" aria-label="Flash" class="glass dk" style="all: unset; cursor: pointer; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: {{flashColor}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="{{flashFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
</button>
<button onClick="{{toggleTimer}}" aria-label="Minuteur" class="glass dk" style="all: unset; cursor: pointer; height: 48px; min-width: 48px; padding: 0 14px; box-sizing: border-box; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 6px; color: {{timerColor}}; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>{{timerLabel}}
</button>
</div>

<sc-if value="{{rec.on}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 50%; top: 24px; margin-left: -60px; width: 120px; height: 40px; border-radius: 20px; background: #ff383c; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums"><span style="width: 10px; height: 10px; border-radius: 50%; background: #fff"></span>{{rec.time}}</div></sc-if>
<sc-if value="{{count.on}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 160px; font-weight: 800; text-shadow: 0 4px 30px rgba(0,0,0,.4)">{{count.n}}</div></sc-if>

<div style="position: absolute; left: 50%; bottom: 36px; margin-left: -110px; display: flex; gap: 10px">
<sc-for list="{{zooms}}" as="z" hint-placeholder-count="3">
<button onClick="{{z.go}}" class="glass dk" style="all: unset; cursor: pointer; width: {{z.size}}; height: {{z.size}}; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: {{z.fg}}; transition: width .2s, height .2s">{{z.label}}</button>
</sc-for>
</div>

<div style="position: absolute; right: 0; top: 0; bottom: 0; width: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: linear-gradient(270deg, rgba(0,0,0,.35), transparent)">
<div style="height: 250px; width: 120px; overflow: hidden; position: relative; -webkit-mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent)">
<div style="position: absolute; left: 0; right: 0; top: 0; transform: translateY({{modesY}}px); transition: transform .3s; display: flex; flex-direction: column; align-items: center">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="5">
<button onClick="{{m.go}}" style="all: unset; cursor: pointer; height: 50px; display: flex; align-items: center; font-size: {{m.size}}; font-weight: 700; color: {{m.fg}}; transition: color .2s">{{m.name}}</button>
</sc-for>
</div>
</div>
<button onClick="{{shutter}}" aria-label="{{shutterLabel}}" style="all: unset; cursor: pointer; width: 88px; height: 88px; border-radius: 50%; border: 4px solid #fff; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<span style="width: {{shutterIn.size}}; height: {{shutterIn.size}}; border-radius: {{shutterIn.rad}}; background: {{shutterIn.bg}}; transition: all .2s"></span>
</button>
<button onClick="{{flip}}" aria-label="Changer de caméra" class="glass dk" style="all: unset; cursor: pointer; width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8a8 8 0 0 0-14-2M4 4v3h3M4 16a8 8 0 0 0 14 2M20 20v-3h-3"/></svg>
</button>
<button onClick="{{openThumb}}" aria-label="Dernière photo" style="all: unset; cursor: pointer; width: 64px; height: 64px; border-radius: 12px; background: {{thumb}}; border: 2px solid #fff; box-sizing: border-box; box-shadow: 0 4px 12px rgba(0,0,0,.4); transform: scale({{thumbScale}}); transition: transform .25s"></button>
</div>

<div style="position: absolute; inset: 0; background: #fff; opacity: {{flashOp}}; transition: opacity {{flashDur}}; pointer-events: none"></div>
<sc-if value="{{viewer}}" hint-placeholder-val="{{false}}">
<div onClick="{{closeThumb}}" style="position: absolute; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px">
<span style="width: 760px; height: 570px; border-radius: 18px; background: {{thumb}}"></span>
<span style="font-size: 16px; color: rgba(255,255,255,.7)">{{viewerLabel}} · touchez pour fermer</span>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1348,"height":1019}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { dark: !!props.dark, mode: 'photo', zoom: 1, flash: false, timer: 0, flashOn: false, shots: 0, rec: false, secs: 0, count: 0, viewer: false, flipped: false, kind: 'Photo', focus: false };
this.t = null; this.ct = null; this.ft = null;
}
componentDidUpdate(prev) { if (prev.dark !== this.props.dark) this.setState({ dark: !!this.props.dark }); }
componentWillUnmount() { clearInterval(this.t); clearTimeout(this.ct); clearTimeout(this.ft); }
takePhoto() {
const n = this.state.shots + 1;
this.setState({ flashOn: true, focus: true });
clearTimeout(this.ft);
this.ft = setTimeout(() => this.setState({ flashOn: false, shots: n, kind: this.state.mode === 'video' ? 'Vidéo' : 'Photo' }), 90);
setTimeout(() => this.setState({ focus: false }), 900);
}
shutter() {
const s = this.state;
if (s.count > 0) return;
if (s.mode === 'video') {
if (s.rec) { clearInterval(this.t); this.setState({ rec: false, shots: s.shots + 1, kind: 'Vidéo' }); }
else { this.setState({ rec: true, secs: 0 }); this.t = setInterval(() => this.setState({ secs: this.state.secs + 1 }), 1000); }
return;
}
if (s.timer > 0) {
let n = s.timer; this.setState({ count: n });
const tick = () => { n -= 1; if (n <= 0) { this.setState({ count: 0 }); this.takePhoto(); } else { this.setState({ count: n }); this.ct = setTimeout(tick, 1000); } };
this.ct = setTimeout(tick, 1000);
return;
}
this.takePhoto();
}
renderVals() {
const s = this.state; const dark = s.dark;
const c = { fg: '#ffffff' };
const names = [['video', 'Vidéo'], ['photo', 'Photo'], ['portrait', 'Portrait'], ['square', 'Carré'], ['pano', 'Panorama']];
const idx = names.findIndex((m) => m[0] === s.mode);
const modes = names.map((m) => ({ name: m[1], size: s.mode === m[0] ? '19px' : '16px', fg: s.mode === m[0] ? '#ffd60a' : 'rgba(255,255,255,.75)', go: () => { if (!s.rec) this.setState({ mode: m[0] }); } }));
const zl = [[0.5, '0,5×'], [1, '1×'], [2, '2×']];
const zooms = zl.map((z) => ({ label: s.zoom === z[0] ? z[1] : z[1].replace('×', ''), size: s.zoom === z[0] ? '54px' : '42px', fg: s.zoom === z[0] ? '#ffd60a' : '#fff', go: () => this.setState({ zoom: z[0] }) }));
const grads = ['linear-gradient(160deg,#ff9f43,#6a11cb)', 'linear-gradient(160deg,#ffd27a,#b8326f)', 'linear-gradient(160deg,#2b1a5e,#ff7a45)', 'linear-gradient(160deg,#ff7a45,#14101c)', 'linear-gradient(160deg,#b8326f,#ffc46b)'];
const thumb = s.shots ? grads[(s.shots - 1) % grads.length] : 'linear-gradient(160deg,#4a3a6a,#14101c)';
const isVideo = s.mode === 'video';
const mm = String(Math.floor(s.secs / 60)).padStart(2, '0'); const ss = String(s.secs % 60).padStart(2, '0');
const shutterIn = isVideo ? (s.rec ? { size: '34px', rad: '8px', bg: '#ff383c' } : { size: '70px', rad: '50%', bg: '#ff383c' }) : { size: '70px', rad: '50%', bg: '#ffffff' };
return {
c, dark, modes, zooms, thumb, shutterIn,
modesY: 100 - idx * 50,
mirror: s.flipped ? -1 : 1,
zoomScale: s.zoom === 0.5 ? 1 : s.zoom === 1 ? 1.2 : 2.2,
sceneFilter: s.mode === 'portrait' ? 'saturate(1.15) contrast(1.05)' : 'none',
vignette: s.mode === 'portrait' ? 0.55 : 0.3,
focusOp: s.focus ? 1 : 0,
is: { square: s.mode === 'square', pano: s.mode === 'pano', portrait: s.mode === 'portrait' },
toggleFlash: () => this.setState({ flash: !s.flash }), flashColor: s.flash ? '#ffd60a' : '#fff', flashFill: s.flash ? '#ffd60a' : 'none',
toggleTimer: () => this.setState({ timer: s.timer === 0 ? 3 : s.timer === 3 ? 10 : 0 }), timerColor: s.timer ? '#ffd60a' : '#fff', timerLabel: s.timer ? s.timer + ' s' : '',
rec: { on: s.rec, time: mm + ':' + ss }, count: { on: s.count > 0, n: s.count },
shutter: () => this.shutter(), shutterLabel: isVideo ? (s.rec ? 'Arrêter l’enregistrement' : 'Enregistrer') : 'Prendre une photo',
flip: () => this.setState({ flipped: !s.flipped }),
flashOp: s.flashOn ? 1 : 0, flashDur: s.flashOn ? '0s' : '.4s',
thumbScale: s.flashOn ? 0.8 : 1,
viewer: s.viewer, openThumb: () => this.setState({ viewer: true }), closeThumb: () => this.setState({ viewer: false }),
viewerLabel: s.shots ? s.kind + ' n° ' + s.shots + ' · Los Santos' : 'Aucune photo pour le moment'
};
}
}
</script>
</body>
</html>
