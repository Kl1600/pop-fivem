<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Météo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(0,0,0,.12)}
.glass.dk{background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.4)}
.wcard{background:rgba(255,255,255,.2);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.wcard.dk{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
@keyframes drift{from{transform:translateX(-520px)}to{transform:translateX(1500px)}}
@keyframes fall{from{background-position:0 0}to{background-position:-90px 480px}}
@keyframes snowfall{from{background-position:0 0}to{background-position:40px 300px}}
@keyframes glow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
</style>
</helmet>
<div style="width: 1348px; height: 1019px; display: flex; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.01em; background: {{c.bg}}; color: {{c.fg}}; overflow: hidden; position: relative">

<nav aria-label="Lieux" style="width: 320px; flex-shrink: 0; height: 100%; box-sizing: border-box; background: {{c.side}}; border-right: 1px solid {{c.sep}}; padding: 46px 14px 20px; display: flex; flex-direction: column; gap: 12px; z-index: 3">
<span style="font-size: 34px; font-weight: 700; padding: 0 8px">Météo</span>
<label style="height: 40px; border-radius: 20px; background: {{c.fill}}; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: {{c.sub}}; margin: 0 4px">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input aria-label="Rechercher un lieu" placeholder="Rechercher un lieu" value="{{query}}" onInput="{{onQuery}}" style="all: unset; flex-grow: 1; font-size: 17px; color: {{c.fg}}">
</label>
<div style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 4px">
<sc-for list="{{places}}" as="p" hint-placeholder-count="4">
<button onClick="{{p.go}}" style="all: unset; cursor: pointer; height: 100px; border-radius: 22px; box-sizing: border-box; padding: 12px 16px; background: {{p.grad}}; color: #fff; display: flex; justify-content: space-between; outline: {{p.ring}}; outline-offset: 2px; flex-shrink: 0">
<span style="display: flex; flex-direction: column; justify-content: space-between"><span><span style="display: block; font-size: 20px; font-weight: 700">{{p.name}}</span><span style="display: block; font-size: 14px; opacity: .85">{{p.time}}</span></span><span style="font-size: 14px">{{p.cond}}</span></span>
<span style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end"><span style="font-size: 44px; font-weight: 300; line-height: 1">{{p.temp}}°</span><span style="font-size: 14px">Max {{p.hi}}° Min {{p.lo}}°</span></span>
</button>
</sc-for>
<sc-if value="{{noPlace}}" hint-placeholder-val="{{false}}"><span style="display: block; text-align: center; padding: 40px 10px; color: {{c.sub}}; font-size: 16px">Aucun lieu.</span></sc-if>
</div>
</nav>

<main style="flex-grow: 1; min-width: 0; height: 100%; position: relative; overflow: hidden; color: #fff">
<sc-for list="{{skies}}" as="sk" hint-placeholder-count="4"><div style="position: absolute; inset: 0; background: {{sk.bg}}; opacity: {{sk.op}}; transition: opacity .9s"></div></sc-for>
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<sc-if value="{{isSun}}" hint-placeholder-val="{{true}}"><div style="position: absolute; right: 90px; top: 40px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,236,160,.95) 0%, rgba(255,214,90,.5) 35%, rgba(255,214,90,0) 70%); animation: glow 6s ease-in-out infinite"></div></sc-if>
<sc-for list="{{clouds}}" as="k" hint-placeholder-count="5"><div style="position: absolute; left: 0; top: {{k.top}}px; width: {{k.w}}px; height: {{k.h}}px; border-radius: 50%; background: rgba({{k.rgb}},{{k.op}}); filter: blur(22px); animation: drift {{k.dur}}s linear {{k.delay}}s infinite"></div></sc-for>
<sc-if value="{{isRain}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(105deg, rgba(255,255,255,.28) 0 2px, transparent 2px 30px); background-size: 90px 160px; animation: fall .7s linear infinite"></div></sc-if>
<sc-if value="{{isSnow}}" hint-placeholder-val="{{false}}"><div style="position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,.95) 2.5px, transparent 3px), radial-gradient(circle, rgba(255,255,255,.7) 1.8px, transparent 2.2px); background-size: 90px 90px, 57px 57px; background-position: 0 0, 30px 20px; animation: snowfall 7s linear infinite"></div></sc-if>
</div>

<div style="position: absolute; inset: 0; overflow-y: auto; padding: 34px 30px 40px">
<div style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: -20px; position: relative; z-index: 2">
<button onClick="{{toggleUnit}}" aria-label="Changer d’unité" class="{{c.card}}" style="all: unset; cursor: pointer; height: 40px; padding: 0 18px; border-radius: 20px; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: #fff">{{unitLabel}}</button>
</div>
<div style="display: flex; flex-direction: column; align-items: center; padding-top: 6px; text-shadow: 0 2px 14px rgba(0,0,0,.2)">
<span style="font-size: 38px; font-weight: 600">{{loc.name}}</span>
<span style="font-size: 190px; font-weight: 200; line-height: 1.02; letter-spacing: -0.04em; padding-left: 28px">{{loc.temp}}°</span>
<span style="font-size: 26px; font-weight: 500">{{loc.cond}}</span>
<span style="font-size: 20px; font-weight: 500; padding-top: 4px">Max {{loc.hi}}° Min {{loc.lo}}°</span>
</div>

<div class="{{c.card}}" style="margin-top: 28px; border-radius: 24px; padding: 14px 18px 16px">
<span style="display: block; font-size: 14px; font-weight: 600; opacity: .8; padding-bottom: 10px">{{loc.summary}}</span>
<div style="display: flex; gap: 6px; overflow-x: auto; border-top: 1px solid rgba(255,255,255,.25); padding-top: 12px">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="12">
<div style="width: 76px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px">
<span style="font-size: 15px; font-weight: 600">{{h.t}}</span>
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{h.col}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{h.d}}"/></svg>
<span style="font-size: 12px; font-weight: 700; color: #8fd3ff; height: 14px">{{h.pct}}</span>
<span style="font-size: 20px; font-weight: 600">{{h.temp}}°</span>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 20px; margin-top: 20px; align-items: flex-start">
<div class="{{c.card}}" style="flex: 1.35; border-radius: 24px; padding: 14px 20px 8px">
<span style="display: block; font-size: 14px; font-weight: 600; opacity: .8; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,.25)">PRÉVISIONS SUR 10 JOURS</span>
<sc-for list="{{days}}" as="d" hint-placeholder-count="10">
<div style="display: flex; align-items: center; height: 52px; border-bottom: 1px solid rgba(255,255,255,.15)">
<span style="width: 120px; font-size: 18px; font-weight: 600">{{d.name}}</span>
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{d.col}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.d}}"/></svg>
<span style="width: 44px; text-align: right; font-size: 18px; opacity: .7">{{d.lo}}°</span>
<span style="flex-grow: 1; height: 6px; border-radius: 3px; background: rgba(0,0,0,.25); margin: 0 12px; position: relative"><span style="position: absolute; top: 0; bottom: 0; left: {{d.left}}%; width: {{d.width}}%; border-radius: 3px; background: {{d.bar}}"></span></span>
<span style="width: 40px; font-size: 18px; font-weight: 600">{{d.hi}}°</span>
</div>
</sc-for>
</div>
<div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<div class="{{c.card}}" style="border-radius: 22px; padding: 12px 16px; height: 172px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; opacity: .8"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"/></svg>{{t.title}}</span>
<span style="font-size: 34px; font-weight: 500; line-height: 1.1">{{t.value}}<span style="font-size: 17px; font-weight: 500"> {{t.unit}}</span></span>
<span style="display: block; position: relative; height: 6px; border-radius: 3px; background: {{t.track}}; opacity: {{t.showBar}}"><span style="position: absolute; top: -3px; left: {{t.pos}}%; width: 12px; height: 12px; margin-left: -6px; border-radius: 6px; background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.25)"></span></span>
<span style="font-size: 14px; line-height: 1.25">{{t.sub}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1348,"height":1019}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { dark: !!props.dark, loc: 'ls', query: '', fahrenheit: false };
}
componentDidUpdate(prev) { if (prev.dark !== this.props.dark) this.setState({ dark: !!this.props.dark }); }
renderVals() {
const s = this.state; const dark = s.dark;
const c = dark
? { bg: '#000000', side: '#000000', fg: '#ffffff', sub: 'rgba(235,235,245,.6)', sep: 'rgba(84,84,88,.6)', fill: '#3a3a3c', card: 'wcard dk' }
: { bg: '#f2f2f7', side: '#f2f2f7', fg: '#000000', sub: 'rgba(60,60,67,.6)', sep: 'rgba(60,60,67,.18)', fill: '#e3e3e8', card: 'wcard' };
const grads = dark
? { S: 'linear-gradient(180deg,#0b1f4d 0%,#17408a 55%,#2d6bb8 100%)', C: 'linear-gradient(180deg,#1c2430 0%,#2c3646 55%,#3f4c60 100%)', R: 'linear-gradient(180deg,#10161f 0%,#1d2836 55%,#2b394b 100%)', N: 'linear-gradient(180deg,#2a3646 0%,#44566c 55%,#6a7f97 100%)' }
: { S: 'linear-gradient(180deg,#2c7be5 0%,#5aaef0 55%,#a9d8f7 100%)', C: 'linear-gradient(180deg,#5d6f88 0%,#8798ae 55%,#b6c3d3 100%)', R: 'linear-gradient(180deg,#34445c 0%,#52657f 55%,#7a8ca3 100%)', N: 'linear-gradient(180deg,#6f86a3 0%,#a8bbd1 55%,#dfe8f1 100%)' };
const names = { S: 'Ensoleillé', C: 'Nuageux', R: 'Pluvieux', N: 'Neigeux' };
const icons = { S: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4', C: 'M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9.5 4.3 4.3 0 0 1 17 18z', R: 'M7 15a4 4 0 0 1-.5-8A6 6 0 0 1 18 6.5 4.3 4.3 0 0 1 17 15zM8 18l-1 3M12 18l-1 3M16 18l-1 3', N: 'M7 15a4 4 0 0 1-.5-8A6 6 0 0 1 18 6.5 4.3 4.3 0 0 1 17 15zM8 19h.01M12 19h.01M16 19h.01M10 21.5h.01M14 21.5h.01', M: 'M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z' };
const iconCol = { S: '#ffd60a', C: '#ffffff', R: '#cfe8ff', N: '#ffffff', M: '#e8e8ff' };
const places = [
{ id: 'ls', name: 'Los Santos', cond: 'S', temp: 29, hi: 31, lo: 21, pat: 'SSCSSSCSSS', uv: 7, wind: 14, dir: 'O', deg: 270, hum: 48, vis: 16, pres: 1016, rise: '06:24', set: '17:08', time: '14:32', summary: 'Ciel dégagé toute la journée, vent faible de l’ouest.' },
{ id: 'ss', name: 'Sandy Shores', cond: 'S', temp: 38, hi: 40, lo: 25, pat: 'SSSSCSSSSS', uv: 10, wind: 9, dir: 'SE', deg: 135, hum: 14, vis: 24, pres: 1011, rise: '06:19', set: '17:12', time: '14:32', summary: 'Chaleur sèche, risque de mirages sur la route 68.' },
{ id: 'pb', name: 'Paleto Bay', cond: 'R', temp: 17, hi: 19, lo: 12, pat: 'RCRCCRCCSC', uv: 2, wind: 27, dir: 'NO', deg: 315, hum: 82, vis: 7, pres: 1004, rise: '06:31', set: '17:01', time: '14:32', summary: 'Averses côtières, rafales jusqu’à 40 km/h ce soir.' },
{ id: 'mc', name: 'Mont Chiliad', cond: 'N', temp: 3, hi: 5, lo: -2, pat: 'NNCNCNNCNN', uv: 1, wind: 21, dir: 'N', deg: 0, hum: 71, vis: 5, pres: 968, rise: '06:27', set: '17:04', time: '14:32', summary: 'Chutes de neige faibles, sommet pris dans la brume.' }
];
const q = s.query.trim().toLowerCase();
const T = (v) => (s.fahrenheit ? Math.round(v * 9 / 5 + 32) : Math.round(v));
const cur = places.find((p) => p.id === s.loc);
const list = places.filter((p) => !q || p.name.toLowerCase().indexOf(q) >= 0).map((p) => ({ name: p.name, time: p.time, cond: names[p.cond], temp: T(p.temp), hi: T(p.hi), lo: T(p.lo), grad: grads[p.cond], ring: p.id === s.loc ? '3px solid ' + (dark ? '#ffffff' : '#0088ff') : '3px solid transparent', go: () => this.setState({ loc: p.id }) }));
const skies = ['S', 'C', 'R', 'N'].map((k) => ({ bg: grads[k], op: cur.cond === k ? 1 : 0 }));
const cl = { S: { n: 2, rgb: '255,255,255', op: 0.32 }, C: { n: 6, rgb: '238,242,248', op: 0.5 }, R: { n: 6, rgb: '52,64,84', op: 0.6 }, N: { n: 5, rgb: '255,255,255', op: 0.45 } }[cur.cond];
const clouds = []; for (let i = 0; i < cl.n; i++) clouds.push({ top: 30 + ((i * 97) % 380), w: 320 + (i % 3) * 90, h: 90 + (i % 2) * 40, rgb: cl.rgb, op: cl.op, dur: 70 + i * 17, delay: -(i * 23) });
const hours = []; const mid = (cur.hi + cur.lo) / 2; const amp = (cur.hi - cur.lo) / 2;
for (let i = 0; i < 12; i++) {
const h = (14 + i) % 24; const night = h >= 19 || h < 6; const t = mid + amp * Math.sin(((h - 9) / 24) * 2 * Math.PI); const k = night && cur.cond === 'S' ? 'M' : cur.cond;
hours.push({ t: i === 0 ? 'Maint.' : h + ' h', d: icons[k], col: iconCol[k], temp: T(t), pct: cur.cond === 'R' ? 40 + ((i * 13) % 50) + '%' : '' });
}
const dn = ['Auj.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.', 'lun.', 'mar.'];
const dh = [0, 1, -1, 2, 0, -2, -1, 1, 2, 0]; const dl = [0, 0, -1, 1, 0, -1, -2, 0, 1, 0];
const rows = dn.map((n, i) => ({ n, k: cur.pat.charAt(i), hi: cur.hi + dh[i], lo: cur.lo + dl[i] }));
const gmin = Math.min.apply(null, rows.map((r) => r.lo)); const gmax = Math.max.apply(null, rows.map((r) => r.hi));
const tcol = (v) => (v <= 5 ? '#5ac8fa' : v <= 14 ? '#30d158' : v <= 22 ? '#ffd60a' : v <= 30 ? '#ff9f0a' : '#ff453a');
const days = rows.map((r) => ({ name: r.n, d: icons[r.k], col: iconCol[r.k], hi: T(r.hi), lo: T(r.lo), left: Math.round(((r.lo - gmin) / (gmax - gmin)) * 100), width: Math.max(8, Math.round(((r.hi - r.lo) / (gmax - gmin)) * 100)), bar: 'linear-gradient(90deg,' + tcol(r.lo) + ',' + tcol(r.hi) + ')' }));
const uvLabel = cur.uv >= 8 ? 'Très élevé' : cur.uv >= 6 ? 'Élevé' : cur.uv >= 3 ? 'Modéré' : 'Faible';
const dew = Math.round(cur.temp - (100 - cur.hum) / 5);
const visLabel = cur.vis >= 15 ? 'Excellente visibilité.' : cur.vis >= 8 ? 'Bonne visibilité.' : 'Visibilité réduite.';
const gradBar = 'linear-gradient(90deg,#34c759,#ffd60a,#ff9500,#ff3b30)';
const tiles = [
{ title: 'INDICE UV', d: icons.S, value: cur.uv, unit: '', sub: uvLabel, track: gradBar, showBar: 1, pos: Math.min(100, cur.uv * 9) },
{ title: 'VENT', d: 'M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7', value: cur.wind, unit: 'km/h', sub: 'Direction ' + cur.dir + ' (' + cur.deg + '°)', track: 'transparent', showBar: 0, pos: 0 },
{ title: 'HUMIDITÉ', d: 'M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z', value: cur.hum, unit: '%', sub: 'Le point de rosée est de ' + T(dew) + '°.', track: 'transparent', showBar: 0, pos: 0 },
{ title: 'VISIBILITÉ', d: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', value: cur.vis, unit: 'km', sub: visLabel, track: 'transparent', showBar: 0, pos: 0 },
{ title: 'PRESSION', d: 'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 12l4-4', value: cur.pres, unit: 'hPa', sub: cur.pres < 1008 ? 'En baisse' : 'Stable', track: 'transparent', showBar: 0, pos: 0 },
{ title: 'LEVER DU SOLEIL', d: 'M3 18h18M7 18a5 5 0 0 1 10 0M12 6v4M5 11l2 2M19 11l-2 2', value: cur.rise, unit: '', sub: 'Coucher : ' + cur.set, track: 'transparent', showBar: 0, pos: 0 }
];
return {
c, dark, skies, clouds, hours, days, tiles, places: list, noPlace: !list.length, query: s.query,
isSun: cur.cond === 'S', isRain: cur.cond === 'R', isSnow: cur.cond === 'N',
loc: { name: cur.name, temp: T(cur.temp), hi: T(cur.hi), lo: T(cur.lo), cond: names[cur.cond], summary: cur.summary },
unitLabel: s.fahrenheit ? '°F' : '°C', toggleUnit: () => this.setState({ fahrenheit: !s.fahrenheit }),
onQuery: (e) => this.setState({ query: e.target.value })
};
}
}
</script>
</body>
</html>
